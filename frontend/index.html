<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牧马人线上多维表</title>
<style>
:root {
  --bg:#F7F8FA; --panel:#FFFFFF; --border:#E5E6EB; --border-soft:#F0F1F4;
  --text:#1D2129; --text-2:#4E5969; --text-3:#86909C;
  --primary:#3370FF; --primary-2:#2E62E6; --primary-light:#E8F0FF;
  --red:#F54A45; --green:#00B42A; --orange:#FF7D00; --purple:#7B61FF;
  --shadow:0 1px 2px rgba(29,33,41,.04); --shadow-lg:0 12px 32px -8px rgba(29,33,41,.14);
  --radius:10px; --radius-sm:8px;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-num:"SF Mono",ui-monospace,Consolas,monospace;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:14px; --fs-xl:20px;
  --white:#FFFFFF; --gray-50:#FAFBFC; --gray-100:#F7F8FA; --gray-300:#C9CDD4;
  --bg-danger:#FFECE8; --bg-green:#E8FFEA; --bg-orange:#FFF3E8; --bg-purple:#F5F0FF;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { font-family:var(--font-ui); background:var(--bg); color:var(--text); font-size:var(--fs-lg);
  line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
::selection { background:rgba(51,112,255,.16); }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:#D5D8DE; border-radius:6px; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:#BFC4CC; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-track { background:transparent; }
a { color:var(--primary); text-decoration:none; }
button { font-family:var(--font-ui); }

/* ---------- 顶栏 ---------- */
#topnav { height:52px; flex-shrink:0; background:var(--panel); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:0 16px; position:relative; z-index:30; }
.top-left { display:flex; align-items:center; gap:10px; min-width:0; }
.top-sb-toggle { display:none; align-items:center; gap:5px; height:30px; padding:0 9px;
  border:1px solid var(--border); border-radius:8px; background:var(--panel); color:var(--text-2);
  font-size:var(--fs-sm); cursor:pointer; transition:.15s; flex:none; white-space:nowrap; }
.top-sb-toggle:hover { background:var(--gray-100); color:var(--text); border-color:#D5D8DE; }
body.in-table .top-sb-toggle, body.in-analysis .top-sb-toggle { display:inline-flex; }
#topnav #btn-back { display:none; }
body.in-table #topnav #btn-back { display:inline-flex; }
body.sb-collapsed #sidebar { display:none !important; }
@media (max-width:860px) { .top-sb-toggle { display:none !important; } }
.brand { display:flex; align-items:center; gap:9px; color:var(--text); }
.brand-logo { width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center;
  font-weight:600; font-size:13px; color:#fff;
  background:linear-gradient(135deg,#4D8DFF 0%,#2E62E6 100%); box-shadow:0 2px 6px rgba(51,112,255,.28); }
.brand h1 { font-size:var(--fs-lg); font-weight:600; letter-spacing:.1px; }
.top-meta { display:flex; align-items:center; gap:8px; }
.top-tag { display:inline-flex; align-items:center; justify-content:center; gap:4px;
  height:30px; padding:0 12px; border-radius:var(--radius-sm); background:var(--panel);
  border:1px solid var(--border); font-size:var(--fs-md); line-height:1; white-space:nowrap;
  color:var(--text-2); cursor:pointer; transition:.15s; }
.top-tag:hover { background:var(--gray-100); color:var(--text); border-color:#D5D8DE; }
.top-tag.primary { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:400;
  box-shadow:0 2px 6px rgba(51,112,255,.24); }
.top-tag.primary:hover { background:var(--primary-2); border-color:var(--primary-2); }
.user-box { display:flex; align-items:center; gap:8px; position:relative; }
.user-chip { display:inline-flex; align-items:center; gap:6px; }
.user-menu { position:absolute; top:38px; right:0; min-width:150px; padding:6px; background:var(--panel);
  border:1px solid var(--border); border-radius:9px; box-shadow:0 12px 32px rgba(29,33,41,.14);
  display:none; z-index:80; }
.user-menu.open { display:block; }
.user-menu div { padding:8px 10px; border-radius:6px; font-size:var(--fs-md); color:var(--text-2); cursor:pointer; }
.user-menu div:hover { background:var(--gray-100); color:var(--text); }
.user-menu .um-sep { height:1px; padding:0; margin:4px 2px; background:var(--border-soft); cursor:default; }
.user-menu .um-sep:hover { background:var(--border-soft); }

#app { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
#layout { flex:1; display:flex; min-height:0; }

/* ---------- 侧栏 ---------- */
#sidebar { width:236px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow-y:auto; padding:10px 8px; }
.sb-head { display:flex; align-items:center; justify-content:space-between; padding:4px 8px 10px; }
.sb-title { font-size:var(--fs-sm); color:var(--text-3); font-weight:400; letter-spacing:.2px; }
.sb-add { margin-left:auto; width:26px; height:26px; padding:0; border:0; border-radius:6px;
  background:transparent; color:var(--text-3); cursor:pointer; transition:.15s;
  display:inline-flex; align-items:center; justify-content:center; }
.sb-add:hover { background:var(--primary-light); color:var(--primary); }
.sb-item { display:flex; align-items:center; gap:6px; height:34px; padding:0 10px; border-radius:var(--radius-sm);
  cursor:pointer; color:var(--text-2); font-size:var(--fs-lg); margin-bottom:1px; transition:background .12s,color .12s; }
.sb-item:hover { background:var(--gray-100); color:var(--text); }
.sb-item.active { background:var(--primary-light); color:var(--primary); font-weight:400; }
.sb-item.editing { padding:0 6px; cursor:text; }
.sb-rename-ipt { flex:1; min-width:0; width:100%; height:26px; padding:0 6px; border:1px solid var(--primary);
  border-radius:5px; font:inherit; font-size:var(--fs-lg); color:var(--text); background:var(--panel);
  outline:none; box-shadow:none; }
.sb-item .sb-ic { flex-shrink:0; font-size:14px; width:18px; text-align:center; }
.sb-item .sb-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sb-del { flex:none; width:24px; height:24px; border:0; border-radius:6px; background:transparent;
  color:var(--text-3); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  opacity:.35; transition:opacity .12s; }
.sb-item:hover .sb-del { opacity:1; }
.sb-del:hover { background:var(--bg-danger); color:var(--red); }
.sb-item.editing .sb-del { display:none; }
.sheet-del { color:var(--text-3); }
.sheet-del:hover { background:var(--bg-danger); color:var(--red); }
.sb-item, .sheet-tab { cursor:pointer; }
.sb-item.dragging, .sheet-tab.dragging { opacity:.9; background:var(--panel);
  box-shadow:0 8px 22px rgba(29,33,41,.18); }
#sb-list.sorting .sb-item, .sheet-bar.sorting .sheet-tab { cursor:grabbing; }

/* ---------- 主区 ---------- */
#main { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
#table-view { flex:1; min-height:0; flex-direction:column; padding:10px 14px 0; }
#table-view.on { display:flex !important; }
.tb-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.tb-tools { display:flex; align-items:center; gap:8px; width:100%; flex-wrap:wrap; row-gap:6px; }
.tb-tools .btn, .tb-tools .back-btn { white-space:nowrap; flex:none; }
.tb-tools .search-box { flex:0 1 220px; min-width:150px; }
.tb-tools .search-box input { width:100%; }
.tb-tools #tv-name { font-size:var(--fs-xl); font-weight:400; letter-spacing:-.1px;
  flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.search-box { position:relative; }
.search-box input { height:32px; width:220px; padding:0 12px 0 30px; border:1px solid var(--border);
  border-radius:var(--radius-sm); font-size:var(--fs-md); outline:none; background:var(--panel);
  color:var(--text); transition:.15s; }
.search-box input::placeholder { color:var(--text-3); }
.search-box input:hover { border-color:#C9CDD4; }
.search-box input:focus { background:var(--panel); border-color:var(--primary); box-shadow:0 0 0 3px rgba(51,112,255,.12); }
.search-box .s-ic { position:absolute; left:10px; top:50%; transform:translateY(-50%);
  display:inline-flex; align-items:center; color:var(--text-3); pointer-events:none; }
.btn { height:32px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:0 12px;
  font-size:var(--fs-md); cursor:pointer; background:var(--panel); color:var(--text-2);
  font-weight:400; transition:.15s; }
.btn:hover { background:var(--gray-100); color:var(--text); border-color:#D5D8DE; }
.btn-primary { background:var(--primary); border-color:var(--primary); color:#fff;
  box-shadow:0 2px 6px rgba(51,112,255,.22); }
.btn-primary:hover { background:var(--primary-2); border-color:var(--primary-2); color:#fff; }
.btn-danger { background:var(--red); border-color:var(--red); color:#fff; }.btn-danger:hover { background:#E33B36; border-color:#E33B36; color:#fff; }
.btn-danger:disabled { opacity:.6; cursor:default; }
/* 键盘可达性：所有能聚焦的控件都给一圈清晰但不刺眼的焦点环 */
.btn:focus-visible, .top-tag:focus-visible, .back-btn:focus-visible, .sheet-tab:focus-visible,
.sb-item:focus-visible, .pg-btn:focus-visible, .row-del:focus-visible, .th-f:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible,
[role="button"]:focus-visible { outline:2px solid rgba(51,112,255,.55); outline-offset:1px; }
/* 「重置」：只在视图被搜索/筛选/排序改动过时出现 */
#btn-reset { padding:0 10px; gap:5px; display:inline-flex; align-items:center; color:var(--primary); border-color:#C9D6F2; background:var(--primary-light); }
#btn-reset:hover { background:#DDE8FF; border-color:#B7CBF5; color:var(--primary-2); }
#btn-reset svg { flex:none; }
/* 常用视图：把搜索+筛选+排序存成命名视图，一键切换（只存本机） */
.view-btn { display:inline-flex; align-items:center; gap:5px; padding:0 9px; }
.view-btn.on { border-color:#C9D6F2; background:var(--primary-light); color:var(--primary); }
.view-btn .vw-caret { color:var(--text-3); }
.view-btn.on .vw-caret { color:var(--primary); }
.view-menu .ctx-item { justify-content:space-between; }
.view-menu .vw-del { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  margin-left:8px; border-radius:4px; color:var(--text-3); font-size:14px; opacity:0; }
.view-menu .ctx-item:hover .vw-del { opacity:1; }
.view-menu .vw-del:hover { background:var(--bg-danger); color:var(--red); }
.view-menu .vw-check { margin-left:8px; color:var(--primary); font-size:12px; }
.back-btn { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border);
  background:var(--panel); color:var(--text-2); border-radius:var(--radius-sm); height:30px; padding:0 10px;
  font-size:var(--fs-md); cursor:pointer; transition:.15s; }
.back-btn:hover { background:var(--gray-100); color:var(--text); border-color:#D5D8DE; }

/* ---------- Sheet 页签 ---------- */
.sheet-bar { display:flex; align-items:center; gap:4px; margin-bottom:8px; overflow-x:auto; flex-shrink:0; }
.sheet-tab { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; font-size:var(--fs-md);
  color:var(--text-2); cursor:pointer; white-space:nowrap; border-radius:7px; transition:background .12s,color .12s; }
.sheet-tab:hover { background:var(--gray-100); color:var(--text); }
.sync-chip { margin-left:6px; padding:1px 7px; border-radius:999px; font-size:11px; line-height:16px;
  color:#8a5a00; background:#fff4d6; border:1px solid #f0dba6; vertical-align:2px; }
.fm-hint { margin:0 0 10px; padding:8px 10px; font-size:12px; line-height:1.6; color:var(--text-3);
  background:var(--gray-50); border-radius:6px; }
.del-row-sync { color:#8a5a00; }
#tbody td.in-sel { background:#eef3ff; }
#tbody td.fill-target { background:#e6f7ee; }
#fill-handle { position:fixed; width:8px; height:8px; background:#3370ff; border:1px solid #fff;
  border-radius:1px; z-index:40; cursor:crosshair; display:none; box-shadow:0 0 0 1px rgba(0,0,0,.18); }
body.filling, body.filling * { cursor:crosshair !important; user-select:none; }
.ctx-caption { padding:6px 12px 2px; font-size:var(--fs-xs); color:var(--text-3); }
.ctx-sub { margin-left:8px; font-size:var(--fs-xs); color:var(--text-3); }
.sheet-tab.on { background:var(--primary-light); color:var(--primary); font-weight:400; }
.sheet-tab.editing { padding:0 6px; }
.tab-ipt { width:100%; height:24px; padding:0 6px; border:1px solid var(--primary); border-radius:5px;
  font:inherit; font-size:var(--fs-md); color:var(--text); outline:none; background:var(--panel);
  box-shadow:none; }
.sheet-add { color:var(--text-3); padding:0 10px; display:inline-flex; align-items:center; justify-content:center; }
.sheet-add:hover { color:var(--primary); }
.field-mgr { margin-left:auto; color:var(--text-3); }

/* ---------- 表格 ---------- */
.tbl-wrap { flex:1; min-height:0; overflow:auto; background:var(--panel); scrollbar-gutter:stable;
  border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
table.tbl { border-collapse:separate; border-spacing:0; width:100%; font-size:var(--fs-md); table-layout:fixed; }
.tbl thead th { position:sticky; top:0; z-index:10; background:var(--gray-100); color:var(--text-2);
  font-weight:400; height:38px; padding:0 12px; text-align:left; white-space:nowrap;
  border-bottom:1px solid var(--border); cursor:pointer; overflow:hidden; text-overflow:ellipsis;
  font-size:var(--fs-md); }
.th-inner { display:flex; align-items:center; gap:5px; min-width:0; width:100%; overflow:hidden; }
.th-label { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.th-sort { flex:none; color:var(--primary); }
.tbl thead th.num .th-label { text-align:right; }
.tbl thead th:hover { background:#F2F3F5; }
/* 正在按这一列排序：整列头换个底色，一眼看出当前排序（只影响你自己的视图） */
.tbl thead th.sorted { background:#EDF3FF; }
.tbl thead th.sorted:hover { background:#E4EDFF; }
/* 表头吸顶时给一点阴影，滚动后能看出表头浮在内容上方 */
.tbl-wrap.scrolled .tbl thead th { box-shadow:0 6px 10px -8px rgba(29,33,41,.3); }
.tbl thead th.num, .tbl td.num { text-align:right; }
.tbl td.num { font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
.tbl tbody td { height:40px; padding:0 12px; border-bottom:1px solid var(--border-soft); vertical-align:middle;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis; position:relative; font-size:var(--fs-md);
  color:var(--text); }
.tbl tbody tr:last-child td { border-bottom:0; }
.tbl tbody tr:hover { background:#F7F9FC; }
.tbl tbody tr.row-flash td { animation:rowFlash 1.8s ease-out; }
@keyframes rowFlash { 0%,35% { background:#E8F0FF; } 100% { background:transparent; } }
.tbl tbody tr { transition:none; }
.tbl tbody tr.vsp td, .tbl tbody tr.vsp td:first-child { height:0; padding:0; border:0; background:transparent;
  position:static; z-index:auto; }
.tbl tbody tr.vsp:hover td { background:transparent; }
td.editable { cursor:text; }
td.formula { background:#FAF7FF; color:#6C50B5; font-variant-numeric:tabular-nums; cursor:default; }
.tbl tbody td.formula { padding-left:18px; }
td.formula::before { content:"ƒ"; position:absolute; left:5px; top:50%; transform:translateY(-50%);
  font-size:10px; opacity:.45; }
table.tbl td { position:relative; }
.mt-editor { position:absolute; inset:0; z-index:30; display:flex; align-items:center; padding:0 12px;
  background:var(--panel); border-radius:6px; outline:none; overflow:hidden; }
.mt-editor::before { content:""; position:absolute; inset:0; border-radius:6px; pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(51,112,255,.58); }
.mt-editor-ipt { flex:1; min-width:0; height:100%; border:0; outline:none; background:transparent; font:inherit;
  color:inherit; text-align:inherit; padding:0; }
.idx-col { color:#A9AEB8; font-size:var(--fs-sm); font-variant-numeric:tabular-nums;
  cursor:pointer; user-select:none; white-space:nowrap; }
@media (hover:hover) { .tbl tbody td.idx-col { cursor:grab; } }
.tbl tbody tr.row-drag td { opacity:.55; }
.tbl tbody tr.row-drag td.idx-col { cursor:grabbing; }
.row-drop-line { position:fixed; z-index:130; height:2px; background:var(--primary); border-radius:2px;
  pointer-events:none; display:none; box-shadow:0 0 0 3px rgba(51,112,255,.14); }
.idx-col:hover { color:var(--primary); }
@media (hover:hover) { #tbody td.idx-col, .tbl thead th:first-child { padding-left:32px; } }   /* 给左侧行间「＋」留位置，行号不跳；手机端不加 */
/* 行号之间悬浮出现的「插入一行」按钮（fixed，避免被 td 的 overflow 裁掉） */
.row-ins { position:fixed; z-index:120; width:20px; height:20px; padding:0; display:none;
  align-items:center; justify-content:center; border:1px solid var(--primary); border-radius:50%;
  background:var(--panel); color:var(--primary); box-shadow:0 2px 6px rgba(51,112,255,.25);
  cursor:pointer; transform:translateY(-50%); }
.row-ins.on { display:inline-flex; }
.row-ins:hover { background:var(--primary); color:#fff; }
.row-ins:disabled { opacity:.45; cursor:default; }
.tbl thead th:first-child { position:sticky; left:0; top:0; z-index:12; background:var(--gray-100); }
.tbl tbody td:first-child { position:sticky; left:0; z-index:5; background:var(--panel); }
.tbl tbody tr:hover td:first-child { background:#F7F9FC; }
.cell-empty { color:#C9CDD4; }
.cell-img { height:28px; max-width:100%; border-radius:4px; object-fit:cover; display:inline-block;
  vertical-align:middle; -webkit-user-drag:none; }
.cell-link { display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--primary); }
#tbody td.cell-sel { outline:2px solid rgba(51,112,255,.30); outline-offset:-2px; border-radius:6px; background:#fff; z-index:4; }
.cell-expand { position:absolute; right:3px; top:50%; transform:translateY(-50%); width:20px; height:20px; padding:0;
  display:inline-flex; align-items:center; justify-content:center; border:1px solid transparent; border-radius:5px;
  background:var(--panel); color:var(--text-3); cursor:pointer; opacity:0; pointer-events:none; z-index:5;
  transition:opacity .12s, border-color .15s, color .15s; }
#tbody td.cell-sel:hover .cell-expand, .cell-expand:focus-visible { opacity:1; pointer-events:auto; }
.cell-expand:hover { border-color:var(--primary); color:var(--primary); }
/* 单元格批注：有批注的格子右上角一个小角标，点开看/写；没批注的从选中后的气泡按钮进 */
.cmt-dot { position:absolute; top:2px; right:2px; min-width:14px; height:14px; padding:0 4px; border-radius:8px;
  background:#FF9F1C; color:#fff; font-size:10px; line-height:14px; text-align:center; cursor:pointer; z-index:3;
  box-shadow:0 1px 3px rgba(255,159,28,.45); }
.cmt-dot:hover { background:#F08C00; }
.cell-cmt { position:absolute; right:26px; top:50%; transform:translateY(-50%); width:20px; height:20px; padding:0;
  display:inline-flex; align-items:center; justify-content:center; border:1px solid transparent; border-radius:5px;
  background:var(--panel); color:var(--text-3); cursor:pointer; opacity:0; pointer-events:none; z-index:5;
  transition:opacity .12s, border-color .15s, color .15s; }
#tbody td.cell-sel:hover .cell-cmt, .cell-cmt:focus-visible { opacity:1; pointer-events:auto; }
.cell-cmt:hover { border-color:var(--primary); color:var(--primary); }
.cmt-pop { position:fixed; z-index:150; width:320px; max-width:calc(100vw - 16px); background:var(--panel);
  border:1px solid var(--border); border-radius:10px; box-shadow:0 14px 36px -8px rgba(23,29,41,.24); }
.cmt-head { display:flex; align-items:center; gap:6px; padding:10px 12px 6px; font-size:12px; color:var(--text-3); }
.cmt-head b { color:var(--text); font-weight:400; font-size:13px; }
.cmt-x { margin-left:auto; border:0; background:transparent; color:var(--text-3); cursor:pointer; width:22px; height:22px; border-radius:5px; font-size:14px; }
.cmt-x:hover { background:var(--gray-100); color:var(--text); }
.cmt-list { max-height:210px; overflow:auto; padding:2px 12px; }
.cmt-item { padding:7px 0; border-bottom:1px solid var(--border-soft); }
.cmt-item:last-child { border-bottom:0; }
.cmt-meta { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-3); margin-bottom:2px; }
.cmt-del { margin-left:auto; border:0; background:transparent; color:var(--text-3); cursor:pointer; font-size:14px; padding:0 3px; }

  opacity:0; z-index:300; transition:opacity .18s,transform .18s; pointer-events:none;
  box-shadow:0 8px 24px rgba(0,0,0,.18); }
#toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

/* ---------- 弹窗 ---------- */
.mask { position:fixed; inset:0; z-index:140; background:rgba(29,33,41,.40); display:flex; align-items:center; justify-content:center;
  backdrop-filter:blur(2px); }
.box { width:440px; max-width:92vw; max-height:82vh; display:flex; flex-direction:column;
  background:var(--panel); border-radius:12px; box-shadow:var(--shadow-lg);
  animation:pop .16s cubic-bezier(.2,.8,.3,1) backwards; }
@keyframes pop { from { opacity:0; transform:translateY(8px) scale(.985); } to { opacity:1; transform:none; } }
.box-head { display:flex; align-items:center; justify-content:space-between; padding:16px 20px 8px; }
.box-head h3 { font-size:15px; font-weight:600; }
.box-x { border:0; background:transparent; font-size:16px; color:var(--text-3); cursor:pointer; width:28px; height:28px; border-radius:6px; }
.box-x:hover { background:var(--gray-100); color:var(--text); }
.box-body { flex:1; overflow-y:auto; padding:8px 20px 4px; }
.box-foot { display:flex; justify-content:flex-end; gap:8px; padding:12px 20px 16px; }
/* 写入密钥 */
.ak-list { max-height:230px; overflow-y:auto; overflow-x:hidden; margin:-4px 0 0; }
.ak-empty { color:var(--text-3); font-size:13px; padding:10px 0; }
.ak-item { display:flex; align-items:center; gap:8px; padding:9px 0; border-bottom:1px solid var(--border); font-size:13px; }
.ak-item:last-child { border-bottom:0; }
.ak-prefix { flex:none; font-family:var(--font-num); font-size:12px; color:var(--text-2); }
.ak-note { flex:1 1 auto; min-width:70px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
.ak-meta { flex:none; font-size:12px; color:var(--text-3); }
.ak-revoked { flex:none; font-size:12px; color:var(--text-3); }
.ak-new { display:flex; gap:8px; margin-top:12px; }
.ak-new input { flex:1; min-width:0; height:34px; padding:0 10px; border:1px solid var(--border);
  border-radius:7px; font-size:13px; color:var(--text); background:var(--panel); outline:none; }
.ak-new input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(51,112,255,.12); }
.ak-secret { margin-top:14px; background:var(--gray-50); border:1px solid var(--border); border-radius:8px; padding:12px; }
.ak-secret-head { font-size:12px; color:#B45309; margin-bottom:8px; }
.ak-keyrow { display:flex; gap:8px; align-items:center; }
.ak-keyrow code { flex:1; min-width:0; font-family:var(--font-num); font-size:12px; word-break:break-all; color:var(--text); }
.ak-secret pre { margin:10px 0 0; padding:10px; background:var(--panel); border:1px solid var(--border);
  border-radius:6px; font-family:var(--font-num); font-size:11.5px; line-height:1.65; color:var(--text-2);
  white-space:pre-wrap; word-break:break-all; }
@media (max-width:860px) {
  .ak-item { flex-wrap:wrap; row-gap:3px; }
  .ak-prefix { order:0; }
  .ak-note { order:1; flex:1 1 60px; }
  .ak-item .mini { order:2; margin-left:auto; }
  .ak-revoked { order:2; margin-left:auto; }
  .ak-meta { order:3; flex:1 1 100%; font-size:11px; }
}
#confirm-root .mask { z-index:300; }
#confirm-root .cf-box { width:380px; max-width:calc(100vw - 32px); }
#busy-root { display:none; }
#busy-root.on { display:block; }
.busy-mask { position:fixed; inset:0; z-index:400; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.55); backdrop-filter:blur(1.5px); cursor:wait; }
.busy-box { min-width:270px; max-width:calc(100vw - 48px); padding:18px 22px; border-radius:10px;
  background:var(--panel); border:1px solid var(--border); box-shadow:0 16px 42px rgba(29,33,41,.18); }
.busy-title { font-size:var(--fs-lg); color:var(--text); line-height:1.5; text-align:center;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.busy-cursor { display:inline-block; width:2px; height:14px; margin-left:3px; vertical-align:-2px;
  background:var(--primary); animation:busyBlink .9s steps(1) infinite; }
.busy-sub { margin-top:6px; font-size:var(--fs-sm); color:var(--text-3); text-align:center; }
@keyframes busyBlink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
.cf-msg { font-size:14px; line-height:1.7; color:var(--text); }
.frm { margin-bottom:14px; }
.frm label { display:block; font-size:var(--fs-md); color:var(--text-2); margin-bottom:6px; font-weight:400; }
.frm input,.frm select,.frm textarea { width:100%; box-sizing:border-box; padding:8px 10px;
  border:1px solid var(--border); border-radius:7px; font-size:var(--fs-md); outline:none;
  font-family:var(--font-ui); color:var(--text); background:var(--panel); transition:.15s; }
.frm input:hover,.frm textarea:hover { border-color:#C9CDD4; }
.frm input:focus,.frm textarea:focus,.frm select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(51,112,255,.12); }
.frm textarea { min-height:80px; font-family:var(--font-num); resize:vertical; line-height:1.6; }
.frm .hint { font-size:var(--fs-sm); color:var(--text-3); margin-top:6px; line-height:1.6; }
.frm .hint, .xt-box .hint { overflow-wrap:anywhere; word-break:break-word; }
.nt-col { display:flex; align-items:center; gap:6px; margin-bottom:6px; flex-wrap:wrap; }
.frm .nt-col-name { flex:1; width:auto; min-width:120px; height:32px; padding:0 10px; border:1px solid var(--border);
  border-radius:7px; font-size:var(--fs-md); outline:none; color:var(--text); background:var(--panel); }
.frm .nt-col-name:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(51,112,255,.12); }
.frm .nt-col-type { width:96px; flex:none; height:32px; padding:0 8px; border:1px solid var(--border); border-radius:7px;
  font-size:var(--fs-md); color:var(--text-2); background:var(--panel); outline:none; cursor:pointer; }

  font-family:var(--font-num); font-size:var(--fs-sm); color:var(--text); outline:none; background:var(--gray-50); }

  color:var(--text-3); cursor:pointer; font-size:12px; }

.opt-row { display:flex; align-items:center; gap:6px; margin-bottom:6px; }
.opt-row .opt-name { flex:1; min-width:0; width:auto; height:32px; padding:0 10px; border:1px solid var(--border);
  border-radius:7px; font-size:var(--fs-md); color:var(--text); outline:none; background:var(--panel); }
.opt-row .opt-name:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(51,112,255,.12); }
.opt-row .opt-color { flex:0 0 118px; height:26px; padding:0 10px; border:0; border-radius:999px;
  font-size:var(--fs-sm); font-weight:400; cursor:pointer; outline:none; appearance:none; text-align:center; }
.opt-row .opt-del { width:26px; height:26px; border:0; border-radius:6px; background:transparent;
  color:var(--text-3); cursor:pointer; font-size:12px; }
.opt-row .opt-del:hover { background:var(--bg-danger); color:var(--red); }
.chip-ins { display:inline-block; padding:1px 8px; margin:2px 3px 0 0; border-radius:999px;
  background:var(--primary-light); color:var(--primary); font-size:var(--fs-sm); cursor:pointer; }
.expr-preview { padding:8px 10px; margin-top:6px; border-radius:7px; background:var(--gray-100);
  font-family:var(--font-num); font-size:var(--fs-md); color:var(--text-2); min-height:34px; }
.expr-preview.err { background:var(--bg-danger); color:#CB2634; }
.xt-box { margin-top:8px; padding:10px; border:1px solid var(--border-soft); border-radius:8px; background:var(--gray-50); }
.xt-title { font-size:var(--fs-sm); color:var(--text-2); font-weight:400; margin-bottom:6px; }
.xt-row { display:flex; gap:6px; flex-wrap:wrap; }
.xt-row select { height:30px; min-width:0; padding:0 8px; border:1px solid var(--border); border-radius:6px;
  font-size:var(--fs-sm); color:var(--text); background:var(--panel); outline:none; cursor:pointer; }
.xt-row select:focus { border-color:var(--primary); }
#xt-table { flex:1 1 100%; }
#xt-match, #xt-local, #xt-take { flex:1 1 92px; min-width:0; }
#xt-fn    { flex:0 0 72px; }
.xt-eq { color:var(--text-3); font-size:var(--fs-sm); }
.xt-box .hint { margin-top:6px; }

/* 字段管理 */
.box.wide { width:560px; }
.fm-row { display:flex; align-items:center; gap:8px; padding:6px 10px; border:1px solid var(--border-soft);
  border-radius:8px; margin-bottom:4px; }
.fm-row:hover { border-color:var(--border); background:var(--gray-50); }
.fm-row.off .fm-name { color:var(--text-3); text-decoration:line-through; }
.fm-row input[type=checkbox] { width:14px; height:14px; flex:none; accent-color:var(--primary); }
.fm-name { flex:1; min-width:0; font-size:var(--fs-md); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.fm-expr { flex:0 1 36%; min-width:0; font-size:11px; color:var(--text-3); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; font-family:var(--font-ui); }
@media (max-width:860px){ .fm-expr { display:none; } }
.fm-type { flex:none; font-size:var(--fs-sm); color:var(--text-3); padding:1px 7px; border-radius:4px; background:var(--gray-100); }
.fm-ud { display:flex; flex-direction:row; gap:6px; flex:none; margin-left:6px; }
.fm-ud button { border:1px solid var(--border); background:var(--panel); color:var(--text-2); cursor:pointer; width:28px; height:28px;
  padding:0; border-radius:6px; line-height:1; display:flex; align-items:center; justify-content:center; }
.fm-ud button svg { width:13px; height:13px; display:block; }
.fm-ud button:hover:not(:disabled) { background:var(--primary-light); border-color:rgba(51,112,255,.35); color:var(--primary); }
.fm-ud button:disabled { opacity:.32; cursor:default; }
.fm-del { flex:none; width:28px; height:28px; border:0; border-radius:6px; background:transparent;
  color:var(--text-3); cursor:pointer; font-size:13px; display:inline-flex; align-items:center; justify-content:center; }
.fm-del[data-edit] { margin-left:10px; }
.fm-del[data-del] { margin-left:6px; }
.fm-del:hover { background:var(--gray-100); color:var(--text); }
.fm-del[data-del]:hover { background:var(--bg-danger); color:var(--red); }

/* 汇总同步 */
.box.sync-box { width:860px; }
.sync-sec { font-size:var(--fs-sm); color:var(--text-3); margin:14px 0 6px; }
.sync-rule { border:1px solid var(--border-soft); border-radius:8px; padding:8px 10px; margin-bottom:6px; }
.sync-rule-top { display:flex; align-items:center; gap:8px; }
.sync-rule-name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-md); }
.sync-rule-meta { font-size:11px; color:var(--text-3); margin-top:3px; }
.sync-rule-meta .err { color:var(--red); }
.sync-rule-acts { display:flex; gap:6px; flex:none; }
.sync-rule .mini { height:26px; padding:0 8px; }
.sync-empty { font-size:var(--fs-sm); color:var(--text-3); padding:8px 0; }
.sync-form { border:1px solid var(--border); border-radius:8px; padding:10px; }
.sync-form-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.sync-form-head .cs-select { width:300px; height:30px; }
.sync-map { max-height:250px; overflow:auto; border-top:1px solid var(--border-soft); margin-top:6px; }
.sync-map-row { display:flex; align-items:center; gap:10px; padding:5px 2px; border-bottom:1px solid var(--border-soft); }
.sync-map-row .tc { width:170px; flex:none; font-size:var(--fs-sm); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sync-map-row .tt { font-size:10px; color:var(--text-3); margin-left:4px; }
.sync-map-row .cs-select { flex:1; width:auto; height:28px; min-width:0; }
.sync-map-row select { width:100%; }
.sync-foot { display:flex; justify-content:flex-end; gap:8px; margin-top:10px; }

/* 筛选浮层 / 日历 */
.f-pop { position:fixed; z-index:120; min-width:210px; max-width:290px; max-height:320px; overflow:auto;
  background:var(--panel); border:1px solid var(--border); border-radius:10px;
  box-shadow:0 12px 32px rgba(29,33,41,.14); padding:8px;
  animation:pop .14s cubic-bezier(.2,.8,.3,1); }
.f-pop .fp-search { width:100%; box-sizing:border-box; height:30px; padding:0 10px; border:1px solid transparent;
  border-radius:6px; font-size:var(--fs-md); outline:none; margin-bottom:6px; background:var(--gray-100); }
/* 浮层顶部的“升序/降序”：和表头点击等价，只影响自己的视图 */
.fp-sort { display:flex; gap:6px; margin-bottom:6px; padding-bottom:6px; border-bottom:1px solid var(--border-soft); }
.fp-sort-b { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:4px; height:28px; padding:0 6px;
  border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--text-2);
  font-size:var(--fs-sm); font-family:var(--font-ui); cursor:pointer; }
.fp-sort-b:hover { background:var(--gray-100); color:var(--text); border-color:#D5D8DE; }
.fp-sort-b.on { background:var(--primary-light); border-color:#C9D6F2; color:var(--primary); }
/* 浮层底部的「高级筛选」入口 + 已启用高级筛选时的提示 */
.fp-adv { padding:0 2px 6px; margin-bottom:6px; border-bottom:1px solid var(--border-soft); }
.fp-adv span { font-size:var(--fs-sm); color:var(--text-2); cursor:pointer; }
.fp-adv span:hover { color:var(--primary); }
.fp-adv-hint { font-size:11px; color:#B45309; background:var(--bg-orange); border-radius:6px;
  padding:5px 7px; margin-bottom:6px; line-height:1.5; }
/* 高级筛选：多列条件行 */
.adv-logic { display:flex; align-items:center; gap:14px; margin-bottom:12px; font-size:var(--fs-md); color:var(--text-2); flex-wrap:wrap; }
.adv-logic label { display:inline-flex; align-items:center; gap:6px; cursor:pointer; }
.adv-logic input { accent-color:var(--primary); margin:0; }
.adv-cond { display:grid; grid-template-columns:minmax(0,1.05fr) 96px minmax(0,1.5fr) 26px; gap:6px;
  align-items:center; margin-bottom:8px; }
.adv-cond select, .adv-cond input { width:100%; min-width:0; height:32px; padding:0 8px; box-sizing:border-box;
  border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--text);
  font-size:var(--fs-md); font-family:var(--font-ui); outline:none; }
.adv-cond select:focus, .adv-cond input:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(51,112,255,.12); }
.adv-vals { display:flex; gap:4px; min-width:0; }
.adv-vals input { flex:1 1 0; }
.adv-del { width:26px; height:26px; border:0; border-radius:6px; background:transparent; color:var(--text-3);
  cursor:pointer; font-size:13px; line-height:1; }
.adv-del:hover { background:var(--bg-danger); color:var(--red); }
.adv-add { height:30px; padding:0 10px; border:1px dashed var(--border); border-radius:6px; background:transparent;
  color:var(--text-2); font-size:var(--fs-sm); font-family:var(--font-ui); cursor:pointer; }
.adv-add:hover { border-color:var(--primary); color:var(--primary); background:var(--primary-light); }
.adv-hint { margin-top:12px; font-size:11px; color:var(--text-3); line-height:1.7; }
@media (max-width:600px){
  .adv-cond { grid-template-columns:minmax(0,1fr) 92px 26px; }
  .adv-cond .adv-del { grid-column:3; grid-row:1; }
  .adv-cond .adv-vals { grid-column:1 / 3; grid-row:2; }
}
.f-pop .fp-search:focus { background:var(--panel); border-color:var(--primary); }
.fp-opt { display:flex; align-items:center; gap:8px; height:30px; padding:0 8px; border-radius:6px; cursor:pointer; font-size:var(--fs-md); }
.fp-opt:hover { background:var(--gray-100); }
.fp-opt input { pointer-events:none; } .fp-opt .fp-v { flex:1; overflow:hidden; text-overflow:ellipsis; }
.fp-foot { display:flex; justify-content:space-between; align-items:center; margin-top:6px; padding:6px 4px 2px; border-top:1px solid var(--border-soft); }
.fp-foot-r { display:flex; gap:12px; }
.fc { display:flex; gap:6px; }
.fc select, .fc input { height:30px; border:1px solid var(--border); border-radius:6px; font-size:var(--fs-md);
  color:var(--text); background:var(--panel); outline:none; }
.fc select { flex:0 0 74px; padding:0 6px; cursor:pointer; }
.fc input { flex:1; min-width:0; padding:0 8px; }
.fc select:focus, .fc input:focus { border-color:var(--primary); }
.fp-foot span { font-size:var(--fs-sm); color:var(--primary); cursor:pointer; padding:2px 6px; border-radius:4px; }
.fp-foot span:hover { background:var(--primary-light); }
.f-pop.date-pop { width:304px; max-width:calc(100vw - 16px); max-height:none; padding:0; overflow:hidden;
  border-radius:10px; box-shadow:0 16px 40px rgba(29,33,41,.18); }
.dp-wrap { display:flex; min-width:0; }
.dp-side { width:88px; flex:none; border-right:1px solid var(--border-soft); padding:8px 5px; background:var(--gray-50); }
.dp-side .dp-t { display:none; }
.dp-q { display:block; width:100%; text-align:left; border:0; background:transparent; font:inherit;
  font-size:var(--fs-sm); color:var(--text-2); padding:6px 6px; border-radius:5px; cursor:pointer; margin-bottom:1px; white-space:nowrap; }
.dp-q:hover { background:var(--gray-100); color:var(--text); } .dp-q.on { background:var(--primary-light); color:var(--primary); font-weight:400; }
.dp-main { flex:1; min-width:0; padding:10px 10px 8px; }
.dp-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
.dp-ym { font-size:var(--fs-md); font-weight:400; color:var(--text); white-space:nowrap; }
.dp-nav { border:0; background:transparent; color:var(--text-2); cursor:pointer; width:24px; height:24px;
  border-radius:6px; font-size:14px; line-height:1; padding:0; display:inline-flex; align-items:center; justify-content:center; }
.dp-nav:hover { background:var(--gray-100); color:var(--text); }
.dp-week,.dp-days { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; text-align:center; }
.dp-week { font-size:10px; color:var(--text-3); margin-bottom:4px; }
.dp-week span { height:18px; display:flex; align-items:center; justify-content:center; }

  border-radius:6px; cursor:pointer; user-select:none; color:var(--text); }
.dp-day:hover { background:var(--gray-100); }
.dp-day.other { color:#C9CDD4; } .dp-day.inrange { background:var(--primary-light); border-radius:0; color:var(--primary); }

.dp-day.endpoint:hover { background:var(--primary-2); }
.dp-vals { display:flex; gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border-soft); }
.dp-vals input { flex:1; min-width:0; height:26px; text-align:center; border:1px solid var(--border);
  border-radius:5px; font-size:11px; font-family:var(--font-num); background:var(--gray-50); color:var(--text-2); }
.dp-vals > span { color:var(--text-3); font-size:10px; align-self:center; }
.dp-foot { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-top:1px solid var(--border-soft); }
.dp-foot button { border:0; border-radius:6px; padding:5px 12px; font-size:var(--fs-sm); cursor:pointer; font-weight:400; }
.dp-ok { background:var(--primary); color:#fff; } .dp-ok:hover { background:var(--primary-2); }
.dp-clear { background:transparent; color:var(--text-2); } .dp-clear:hover { background:var(--gray-100); }
/* 自定义单日期选择器 */

.date-field > input { width:100%; }
.date-field .date-btn { position:absolute; right:4px; top:50%; transform:translateY(-50%);
  width:30px; height:30px; padding:0; border:0; border-radius:6px; background:transparent;
  color:var(--text-3); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
.date-field .date-btn:hover { background:var(--gray-100); color:var(--text); }
.frm .date-field > input { padding-right:40px; }
.rp-date { width:100%; }
.rp-date > input { padding-right:34px; }
.rp-date .date-btn { width:28px; height:28px; }

.opt-color.cs-select .cs-val { text-align:center; }
.opt-color.cs-select .cs-caret { width:10px; height:10px; }

/* ---------- 手机端 ---------- */
.top-mobile-menu { display:none; width:32px; height:32px; flex:none; padding:0; border:0; border-radius:8px;
  background:transparent; color:var(--text-2); cursor:pointer; align-items:center; justify-content:center; }
.top-mobile-menu:hover { background:var(--gray-100); color:var(--text); }
#sidebar-mask { display:none; position:fixed; inset:52px 0 0 0; z-index:119; background:rgba(29,33,41,.38); }
#table-menu { position:fixed; z-index:135; min-width:176px; padding:6px; background:var(--panel);
  border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 32px rgba(29,33,41,.16); display:none; }
#table-menu.on { display:block; }
#table-menu .tm-item { display:flex; align-items:center; gap:9px; width:100%; height:40px; padding:0 10px;
  border:0; border-radius:7px; background:transparent; color:var(--text-2); font-size:var(--fs-md);
  text-align:left; cursor:pointer; white-space:nowrap; }
#table-menu .tm-item:hover { background:var(--gray-100); color:var(--text); }
#table-menu .tm-item svg { flex:none; color:var(--text-3); }
#table-menu .tm-sep { height:1px; margin:4px 6px; background:var(--border-soft); }
.tb-more { display:none; align-items:center; gap:4px; }
/* 右键菜单（表格行 / 表头） */
.ctx-menu { position:fixed; z-index:160; min-width:180px; padding:5px; background:var(--panel);
  border:1px solid var(--border); border-radius:9px; box-shadow:0 14px 36px -8px rgba(23,29,41,.24);
  animation:pop .12s cubic-bezier(.2,.8,.3,1); }
.ctx-item { display:flex; align-items:center; gap:8px; width:100%; height:32px; padding:0 10px; border:0;
  border-radius:6px; background:transparent; color:var(--text-2); font-size:var(--fs-md); font-family:var(--font-ui);
  text-align:left; cursor:pointer; white-space:nowrap; }
.ctx-item:hover { background:var(--gray-100); color:var(--text); }
.ctx-item svg { flex:none; color:var(--text-3); }
.ctx-item.danger { color:var(--red); }
.ctx-item.danger svg { color:var(--red); }
.ctx-item.danger:hover { background:var(--bg-danger); color:var(--red); }
.ctx-sep { height:1px; margin:4px 6px; background:var(--border-soft); }

@media (max-width:860px) {
  body { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  #topnav { padding:0 10px; }
  body.in-table .top-mobile-menu, body.in-analysis .top-mobile-menu { display:inline-flex; }
  .brand h1 { font-size:var(--fs-md); }
  #table-view, #analysis-view { padding:8px 8px 0; }

  /* 侧栏改抽屉 */
  body.in-table #sidebar, body.in-analysis #sidebar {
    display:flex !important; position:fixed; top:52px; left:0; bottom:0; z-index:121;
    width:min(282px,84vw); transform:translateX(-103%);
    transition:transform .22s cubic-bezier(.2,.8,.3,1);
    box-shadow:18px 0 48px rgba(29,33,41,.16);
    padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  body.mobile-sb-open #sidebar { transform:translateX(0); }
  body.mobile-sb-open #sidebar-mask { display:block; }
  .sb-item { height:40px; }
  .sb-add { width:32px; height:32px; }
  .cell-expand { width:28px; height:28px; opacity:1; pointer-events:auto; }

  /* 表格顶栏：次要操作收进「更多」 */
  .tb-head { margin-bottom:6px; }
  .tb-tools { gap:6px; flex-wrap:wrap; }
  .tb-tools > span[style*="flex:1"] { display:none; }
  .tb-tools #tv-name { flex:1 1 0; width:0; min-width:0; font-size:16px; font-weight:400;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tb-tools .search-box { order:10; flex:1 1 100%; }
  .search-box input { width:100%; height:36px; font-size:16px; }
  .tb-tools #btn-csv, .tb-tools #btn-import, .tb-tools #btn-hist,
  .tb-tools #btn-analysis, .tb-tools #btn-sync, .tb-tools #btn-apikey, .tb-tools #btn-new-table,
  .tb-tools #btn-reset { display:none !important; }
  .tb-tools .view-btn span, .tb-tools .view-btn .vw-caret { display:none; }
  .tb-tools .view-btn { padding:0 9px; }
  .tb-more { display:inline-flex; }
  .tb-tools .btn, .tb-tools .back-btn { height:34px; flex:none; }
  .tb-tools .back-btn { padding:0 8px; }
  #btn-add-row { padding:0 10px; }
  /* 字段管理只留图标，避免「字段」二字被截断 */
  .sheet-tab.field-mgr { font-size:0; gap:0; padding:0 9px; }
  .sheet-tab.field-mgr svg { width:14px; height:14px; }

  /* 表格与分页 */
  .tbl-wrap { border-radius:8px; -webkit-overflow-scrolling:touch; }
  table.tbl tbody td { height:42px; }
  .pager { flex-wrap:wrap; justify-content:space-between; gap:6px;
    padding:7px 2px calc(7px + env(safe-area-inset-bottom)); }
  .pg-btn { min-width:32px; height:32px; }
  .pg-size { height:32px; font-size:14px; }
  #pg-btns { flex-wrap:wrap; justify-content:flex-end; }

  /* 分析页 */
  .ana-head { gap:6px; margin-bottom:8px; }
  .ana-title { font-size:17px; font-weight:400; }
  .ana-sub { font-size:var(--fs-sm); max-width:76px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ana-head > span[style*="flex:1"] { display:none; }
  .ana-dash { order:5; flex:1 1 180px; min-width:0; gap:2px; }
  .ana-dash select { flex:1; min-width:0; max-width:none; height:34px; font-size:14px; }
  .ana-iconbtn { width:32px; height:32px; }
  #ana-save, #ana-refresh { height:32px; padding:0 9px; }
  #ana-add-chart { order:6; height:32px; padding:0 10px; flex:none; }
  .ana-grid { gap:10px; }
  .ana-card { min-height:250px; padding:12px 12px 8px; }
  .ana-kpi .v { font-size:34px; }
  .ana-pie-flex { flex-direction:column; align-items:stretch; }
  .ana-legend-col { flex:1 1 auto; max-height:120px; }

  /* 弹窗 & 导入 */
  .mask { padding:0; }
  .box { max-width:calc(100vw - 16px); max-height:calc(100dvh - 16px); }
  .box.imp-box, .box.ana-box, .box.xwide { width:100vw; max-width:100vw; height:100dvh;
    max-height:100dvh; border-radius:0; }
  .box.imp-box .box-head, .box.ana-box .box-head, .box.xwide .box-head {
    padding-top:calc(16px + env(safe-area-inset-top)); }
  .box.imp-box .box-foot, .box.ana-box .box-foot, .box.xwide .box-foot {
    padding-bottom:calc(12px + env(safe-area-inset-bottom)); }
  .box.imp-box .box-body, .box.ana-box .box-body { padding:6px 12px 4px; }
  .ana-editor { grid-template-columns:1fr; overflow-y:auto; }
  .ana-form { overflow:visible; padding-right:0; }
  .ana-preview { min-height:280px; }
  .imp-map { overflow-x:auto; }
  .imp-map-head { display:none; }
  .imp-map-row { grid-template-columns:minmax(0,1fr) auto; gap:3px 8px; padding:8px 10px; min-width:0; }
  .imp-map-row .imp-src { grid-column:1; }
  .imp-map-row .imp-sample { grid-column:2; max-width:44vw; text-align:right; }
  .imp-map-row .cs-select { grid-column:1 / -1; width:100%; height:32px; margin-top:2px; }
  .imp-top .imp-file { flex-basis:100%; min-width:0; }
  .imp-top .imp-head { flex:0 0 76px; }
  .box.sync-box { width:100vw; max-width:100vw; height:100dvh; max-height:100dvh; border-radius:0; }
  .box.sync-box .box-head { padding-top:calc(16px + env(safe-area-inset-top)); }
  .box.sync-box .box-body { overflow-y:auto; }
  .sync-form-head { flex-wrap:wrap; }
  .sync-form-head .cs-select { width:100%; flex:1; }
  .sync-rule-top { flex-wrap:wrap; }
  .sync-rule-acts { width:100%; justify-content:flex-end; flex-wrap:wrap; }
  .sync-map-row .tc { width:118px; }
  .sync-foot { position:sticky; bottom:0; background:var(--panel); padding:8px 0 calc(8px + env(safe-area-inset-bottom)); }

  /* 行详情全屏 */
  #row-panel { width:100vw; max-width:100vw; top:0; }
  .rp-head { padding:calc(14px + env(safe-area-inset-top)) 16px 8px; }
  .rp-title { font-size:20px; }
  .rp-close { width:34px; height:34px; }
  .rp-del { height:34px; padding:0 10px; }
  .rp-body { padding:4px 16px calc(28px + env(safe-area-inset-bottom)); }
  .rp-field { grid-template-columns:104px minmax(0,1fr); gap:8px; min-height:48px; }
  .rp-input { height:38px; font-size:16px; }
  .rp-pick, .rp-check { min-height:38px; }

  /* iOS 聚焦输入不放大 */
  input, select, textarea { font-size:16px; }
  .frm input, .frm select, .frm textarea { font-size:16px; }
  .imp-summary select, .imp-summary input, .imp-map-row select, .imp-cols select { font-size:14px; }
  /* 自定义下拉触控尺寸 */
  .cs-select { height:36px; }
  .cs-opt { min-height:42px; font-size:15px; }
  .frm > .cs-select { height:38px; font-size:16px; }
  .ana-form .frm .cs-select { height:34px; font-size:14px; }
  .ana-dash .cs-select { flex:1; min-width:0; max-width:none; height:34px; font-size:14px; }
  .fc .cs-select { flex:0 0 88px; width:88px; height:36px; font-size:15px; }
  .imp-summary .cs-select, .imp-map-row .cs-select, .imp-cols .cs-select { font-size:14px; }
  .ua-add .cs-select, .ua-row .cs-select { font-size:14px; }
  .opt-color.cs-select { height:32px; }
  .dp-pop { width:min(332px, calc(100vw - 16px)); padding:12px; }
  .dp-pday { height:40px; font-size:15px; }
  .dp-pnav { width:32px; height:32px; }
  .date-field .date-btn { width:32px; height:32px; }
  /* 用户管理：账号表与授权上下排列 */
  .ua-body { flex-direction:column; height:auto; }
  .ua-left { width:100%; flex:none; overflow-x:auto; }
  .ua-tbl { min-width:620px; }
  .ua-right { width:100%; flex:none; border-left:0; border-top:1px solid var(--border-soft);
    padding:12px 0 0; margin-top:10px; }

  /* 首页 / 项目页 */
  #home, #proj-view { padding:16px 12px; }
  .home-head { gap:8px; }
  .home-head h2 { font-size:18px; }
  .home-search { flex:1 1 100%; margin-left:0; order:5; }
  .home-search input { width:100%; height:36px; }
  .home-grid { grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin-top:12px; }
  .home-card { padding:12px; min-height:88px; }
  .home-card .hc-del { opacity:1; width:30px; height:30px; }
  .home-card .hc-ren { opacity:1; width:30px; height:30px; right:44px; }
}
@media (max-width:400px) { .brand h1 { display:none; } }
</style>
</head>
<body>
<div id="app">
  <nav id="topnav">
    <div class="top-left">
      <button class="top-mobile-menu" id="btn-mobile-menu" title="数据表" aria-label="数据表">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="brand"><div class="brand-logo">表</div><h1>牧马人线上多维表</h1></div>
      <button class="back-btn" id="btn-back">‹ 全部项目</button>
    </div>
    <div class="top-meta">
      <div id="user-box" class="user-box"></div>
    </div>
  </nav>
  <div id="layout">
    <aside id="sidebar">
      <div class="sb-head"><span class="sb-title">数据表</span><button class="sb-add" id="btn-new-table-sb" style="display:none" title="新建表" aria-label="新建表"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
      <div id="sb-list"></div>
      <div id="sb-pages"></div>
    </aside>
    <main id="main">
      <!-- 第一层：项目列表 -->
      <div id="home">
        <div class="home-head">
          <h2>项目</h2>
          <span class="hm-sub" id="home-count"></span>
          <span style="flex:1"></span>
          <div class="home-search search-box"><span class="s-ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></span><input id="home-kw" placeholder="搜索项目/表…"></div>
          <button class="btn btn-primary" id="btn-new-project" style="display:none">＋ 新建项目</button>
        </div>
        <div id="home-body"></div>
      </div>
      <!-- 第二层：项目内的表 -->
      <div id="proj-view" style="display:none">
        <div class="home-head">
          <button class="back-btn" id="btn-back-proj">‹ 全部项目</button>
          <h2 id="proj-name"></h2>
          <span class="hm-sub" id="proj-count"></span>
          <span style="flex:1"></span>
          <button class="btn btn-primary" id="btn-new-group" style="display:none">＋ 新建表</button>
        </div>
        <div id="proj-body"></div>
      </div>
      <!-- 第三层：表 / Sheet -->
      <div id="table-view" style="display:none">
      <div class="tb-head">
        <div class="tb-tools">
          <button class="top-sb-toggle" id="btn-sb-toggle" title="收起数据表" aria-label="收起数据表"></button>
          <span id="tv-name"></span>
          <span style="flex:1"></span>
          <div class="search-box"><span class="s-ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg></span><input id="kw" placeholder="搜索本表…"></div>
          <button class="btn view-btn" id="btn-view" title="常用视图：把当前的搜索/筛选/排序存下来一键切换（只存本机）">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
            <span>视图</span>
            <svg class="vw-caret" width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <button class="btn" id="btn-reset" style="display:none" title="清除本表的搜索、筛选和排序（只影响你自己的视图）" aria-label="重置视图">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v5h5"/></svg>
            <span>重置</span>
          </button>
          <button class="btn" id="btn-add-row" style="display:none">＋ 行</button>
          <button class="btn" id="btn-csv">导出</button>
          <button class="btn" id="btn-import">导入</button>
          <button class="btn" id="btn-hist">变动历史</button>
          <button class="btn" id="btn-analysis">分析</button>
          <button class="btn" id="btn-sync" style="display:none">汇总同步</button>
          <button class="btn" id="btn-apikey" style="display:none">写入密钥</button>
          <button class="btn btn-primary" id="btn-new-table" style="display:none">＋ 新建表格</button>
          <button class="btn tb-more" id="btn-more" title="更多操作" aria-label="更多操作">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
            <span>更多</span>
          </button>
        </div>
      </div>
      <div class="sheet-bar" id="sheet-bar"></div>
      <div class="tbl-wrap">
        <table class="tbl"><colgroup id="colgroup"></colgroup><thead id="thead"></thead><tbody id="tbody"></tbody></table>
        <div class="empty-box" id="empty" style="display:none">还没有数据</div>
      </div>
      <div class="pager">
        <select id="pg-size" class="pg-size" title="每页显示条数">
          <option value="50">50 条/页</option>
          <option value="100">100 条/页</option>
          <option value="300">300 条/页</option>
          <option value="0">全部</option>
        </select>
        <span class="pg-total" id="pg-total"></span>
        <span style="flex:1"></span>
        <div id="pg-btns" style="display:flex;gap:4px"></div>
      </div>
      </div>
      <!-- 数据分析 -->
      <div id="analysis-view">
        <div class="ana-head">
          <button class="back-btn" id="btn-ana-back">‹ 返回表格</button>
          <button class="top-sb-toggle" id="btn-sb-toggle-ana" title="收起数据表" aria-label="收起数据表"></button>
          <span class="ana-title" id="ana-title">数据分析</span>
          <span class="ana-sub" id="ana-sub"></span>
          <span style="flex:1"></span>
          <div class="ana-dash">
            <select id="ana-dash-sel" title="切换看板"></select>
            <button class="ana-iconbtn" id="ana-dash-rename" title="重命名看板" aria-label="重命名看板">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="ana-iconbtn danger" id="ana-dash-del" title="删除看板" aria-label="删除看板">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v6M14 11v6"/></svg>
            </button>
          </div>
          <button class="btn" id="ana-save">保存</button>
          <button class="btn" id="ana-refresh">刷新</button>
          <button class="btn btn-primary" id="ana-add-chart">＋ 新建图表</button>
        </div>
        <div class="ana-scroll"><div id="ana-body"></div></div>
      </div>
    </main>
  </div>
</div>
<div id="sidebar-mask"></div>
<div id="table-menu" role="menu" aria-label="更多操作"></div>
<div id="row-panel" role="dialog" aria-label="行编辑">
  <div class="rp-head">
    <div class="rp-head-main">
      <div class="rp-title" id="rp-title" title="双击关闭"></div>
      <div class="rp-sub"><span id="rp-sub"></span><span class="rp-status" id="rp-status"></span></div>
    </div>
    <button class="rp-del" id="rp-del" title="删除此行" aria-label="删除此行">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
      <span>删除</span>
    </button>
    <button class="rp-close" id="rp-close" title="关闭" aria-label="关闭">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="rp-body" id="rp-body"></div>
</div>
<div id="toast"></div>
<div class="ana-tip" id="ana-tip"></div>

<!-- 通用弹窗容器 -->
<div id="modal-root"></div>
<div id="confirm-root"></div>
<div id="busy-root"></div>

<script src="/static/js/core.js?v=__KBV__"></script>
<script src="/static/js/shell.js?v=__KBV__"></script>
<script src="/static/js/dialogs.js?v=__KBV__"></script>
<script src="/static/js/sync-fields.js?v=__KBV__"></script>
<script src="/static/js/grid-head.js?v=__KBV__"></script>
<script src="/static/js/rows-live.js?v=__KBV__"></script>
<script src="/static/js/cells.js?v=__KBV__"></script>
<script src="/static/js/paste-panel.js?v=__KBV__"></script>
<script src="/static/js/filters-tools.js?v=__KBV__"></script>
<script src="/static/js/auth-menu.js?v=__KBV__"></script>
<script src="/static/js/analysis.js?v=__KBV__"></script>
<script src="/static/js/import-select.js?v=__KBV__"></script>
</body>
