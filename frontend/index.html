  if (RP && !d.rows.some(function (r) { return r.id === RP.rid; })) closeRowPanel();
  var pages = state.size > 0 ? Math.max(1, Math.ceil(d.total / state.size)) : 1;
  var cols = curCols();

  pp.forEach(function (x) { btns += x === '...' ? '<span>…</span>' : '<button class="pg-btn' + (x === state.page ? ' on' : '') + '" data-p="' + x + '">' + x + '</button>'; });

    if (narrowed && allN) pgT.textContent = '筛选后 ' + d.total + ' 行（全部 ' + Math.max(allN, d.total) + ' 行）';

}

async function loadRows() {
  var t = curTable(); if (!t) return;
  ensureCommentSummary(t.id);            // 批注角标：每张表拉一次汇总，之后走缓存
  var my = ++rowsSeq;
  var key = curRowsKey(t.id);
  var hit = ROWS_CACHE[key];
  if (hit) renderRows(hit);                 // 先用缓存画，交互零等待
  var p = new URLSearchParams({ page: state.page, size: state.size, q: state.kw, sort: state.sort,
    dir: state.dir > 0 ? 'asc' : 'desc', filters: JSON.stringify(state.filters) });
  var d = await api('/api/tables/' + t.id + '/rows?' + p);
  if (my !== rowsSeq) return;               // 期间切走了，丢弃返回
  var pages = state.size > 0 ? Math.max(1, Math.ceil(d.total / state.size)) : 1;
  if (state.page > pages) { state.page = pages; return loadRows(); }
  var same = hit && JSON.stringify(hit) === JSON.stringify(d);
  rowsCachePut(key, d);                   // 只更新这一份，不再把别的 Sheet 预取好的数据一起清掉
  if (!same) renderRows(d);                 // 行数据没变就不二次重绘，避免闪烁
}

/* ============ 切回页面时静默刷新当前页 ============
   别人刚改的数据不用手动刷新/重启就能看到：标签页从后台切回来、窗口重新获得焦点时，
   静默重取当前页（数据没变就不重绘，滚动位置不动，也不显示加载动画）。
   正在编辑格子、行编辑侧栏开着、弹窗里在填表、或者正在跑「删除/导入」这类忙碌操作时一律跳过，
   免得把你手上没提交的输入冲掉。 */
var SOFT_REF_AT = 0, SOFT_REF_TIMER = null;
function softRefreshRows() {
  if (!state.tid || !curTable()) return;
  if (editing || BUSY_TIMER) return;
  if (document.querySelector('#modal-root .box') || document.querySelector('#row-panel.on')) return;
  if (!document.getElementById('table-view').classList.contains('on')) return;   // 不在表格页（分析页等）
  var now = Date.now();

function livePatchSomeRows(rows) {

  var fast = !!(ids && ids.length);

  req.then(function (d) {

      LIVE.lastSeq = msg.seq;

    if (evs.some(function (e) { return e.kind === 'reset'; })) reset = true;
    if (reset) { LIVE.updateIds = null; liveSchedule(); return; }
    if (!evs.length) return;              // 序号对齐了、但没有变化：什么都不用刷
    // 自己刚保存触发的提示不用再刷一次（数据就是自己刚写的）

/* 空闲时只预取当前分组里最近的 2~4 个 Sheet；17 张全预取会平白多传 1.6MB、拖慢首屏 */
function prefetchRows() {

  var todo = ((grp && grp.sheets) || []).filter(function (t) { return t.id !== state.tid; }).slice(0, maxN);
  var idle = window.requestIdleCallback || function (fn) { return setTimeout(fn, 300); };
  (function next() {
    var t = todo.shift(); if (!t) return;
    var key = rowsKey(t.id, 1, '', '', 1, {}, state.size);
    if (ROWS_CACHE[key] || (state.tid === t.id && state.page === 1 && !state.kw && !state.sort)) { idle(next, {timeout: 2000}); return; }

        .then(function (d) { rowsCachePut(key, d); })

/* ---------- 行号间悬浮 +：在指定位置插入一行 ---------- */
var ROW_INS_EL = null;
function hideRowInsert() {
  if (ROW_INS_EL) ROW_INS_EL.classList.remove('on');
  ROW_INS_EL && (ROW_INS_EL._target = null);
}
function initRowInsert() {
  var btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'row-ins'; btn.id = 'row-ins';
  btn.title = '在此处插入一行'; btn.setAttribute('aria-label', '在此处插入一行');
  btn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
  document.body.appendChild(btn);
  ROW_INS_EL = btn;
  btn.addEventListener('mousedown', function (e) { e.preventDefault(); });

  function canInsert() {
    return !!(state.tid && canEditRows() && !state.kw && !state.sort
      && (!state.filters || !Object.keys(state.filters).length)
      && window.matchMedia && window.matchMedia('(hover:hover)').matches);
  }

  document.addEventListener('mousemove', function (e) {
    if (e.target === btn || btn.contains(e.target)) return;   // 移到按钮上时不重新计算/隐藏
    if (!canInsert()) { hideRowInsert(); return; }
    var td = e.target.closest && e.target.closest('td.idx-col');
    if (!td) { hideRowInsert(); return; }
    var tr = td.closest('tr'); if (!tr) { hideRowInsert(); return; }
    var rect = tr.getBoundingClientRect();
    var dTop = Math.abs(e.clientY - rect.top), dBottom = Math.abs(e.clientY - rect.bottom);
    if (Math.min(dTop, dBottom) > 14) { hideRowInsert(); return; }   // 只在行号上下边界附近出现
    var rid = +tr.getAttribute('data-rid');
    var atTop = dTop <= dBottom;
    var y = atTop ? rect.top : rect.bottom;
    var ix = td.getBoundingClientRect();
    btn._target = { before_id: atTop ? rid : null, after_id: atTop ? null : rid };
    btn.style.left = Math.round(ix.left + 2) + 'px';
    btn.style.top = Math.round(y) + 'px';
    btn.classList.add('on');
  }, { passive: true });

  var wrap = document.querySelector('.tbl-wrap');
  if (wrap) wrap.addEventListener('scroll', hideRowInsert, { passive: true });
  window.addEventListener('resize', hideRowInsert);

  btn.onclick = async function (e) {
    e.preventDefault(); e.stopPropagation();
    var target = btn._target;
    if (!target || btn.disabled) return;
    btn.disabled = true;
    hideRowInsert();
    try {
      var res = await api('/api/tables/' + state.tid + '/rows', 'POST',
        { data: {}, before_id: target.before_id, after_id: target.after_id });
      if (state.size > 0 && res.pos) state.page = Math.max(1, Math.ceil(res.pos / state.size));
      await refreshMeta(state.tid);

      var tr = await waitRowEl(res.id, 1200);
      if (tr) focusRowEl(res.id);
      toast('已插入一行');
    } catch (err) {
      toast('插入失败：' + err.message);
    } finally { btn.disabled = false; }
  };
}

function openImageEditor(tr, c, td) {

    + '<input id="im-url" placeholder="https://... 或上传本地图片"></div>';

function openEdit(td, seed){
  if(td.querySelector('input')||document.querySelector('.cell-pop')) return;   // 已在编辑
  var c=colByKey(td.getAttribute('data-f'));
  if(!c||c.type==='formula') return;
  var et=curTable();
  if(et && et.my_role!=='editor'){ toast('只读权限，不能修改数据'); return; }
  if(c.type==='image'){ openImageEditor(td.closest('tr'),c,td); return; }
  if(c.type==='checkbox'){
    var tr0=td.closest('tr'), cur0=td.textContent.indexOf('是')!==-1;
    patchCell(tr0, c.key, !cur0); return;
  }
  if(c.type==='select'){ openSelectPop(td,c); return; }
  if(c.type==='multiselect'){ openMultiPop(td,c); return; }
  var raw=td.textContent.trim(); if(raw==='—')raw='';
  var orig=td.innerHTML;
  if(c.type==='date'){
    var rawD=raw.slice(0,10);
    td.innerHTML='<div class="mt-editor mt-date"><input class="mt-editor-ipt" readonly placeholder="选择日期" value="'+esc(rawD)+'"><span class="mt-date-ic">'+DATE_ICON_SVG+'</span></div>';
    var iptD=td.querySelector('input');
    var commitD=function(v){
      iptD.onblur=null;
      if(String(v||'')===String(rawD)){ td.innerHTML=orig; editing=false; return; }
      patchCell(td.closest('tr'), c.key, v);
    };
    iptD.focus();
    iptD.onclick=function(){ openDatePicker(iptD,{onPick:commitD}); };
    iptD.onkeydown=function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        if(DP && DP.sel) return;                 // 交给全局 Enter：选中的日期
        e.stopPropagation(); closeDatePicker(); commitD(iptD.value);
      } else if(e.key==='Escape'){
        e.stopPropagation(); closeDatePicker(); iptD.onblur=null; td.innerHTML=orig; editing=false;
      }
    };
    iptD.onblur=function(){ if(DP && DP.input===iptD) return; commitD(iptD.value); };
    editing=true;
    openDatePicker(iptD,{onPick:commitD});
    return;
  }
  // 数字列用文本框：库里允许「2万 / 1.8万 / 4.7万」这类带单位的值，
  // type=number 会把它们判为非法并清空，失焦保存就把原值覆盖没了
  var inputType = c.type==='number' ? ' type="text" inputmode="decimal" autocomplete="off"' : '';
  td.innerHTML='<div class="mt-editor"><input class="mt-editor-ipt"'+inputType+'></div>';
  var ipt=td.querySelector('input');
  ipt.value = (typeof seed==='string' && seed.length) ? seed : raw;   // 直接打字编辑：用新输入的字替换原值
  ipt.focus();
  var len = ipt.value.length;
  try { ipt.setSelectionRange(len, len); } catch(e) {}   // 光标放末尾，不全选，避免误覆盖
  var commit = function(){
    var v = ipt.value;
    ipt.onblur = null;
    if (v === raw) { td.innerHTML = orig; editing = false; return; }
    patchCell(td.closest('tr'), c.key, v);
  };
  ipt.onkeydown=function(e){
    if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); commit(); }
    else if(e.key==='Escape'){ e.stopPropagation(); ipt.onblur=null; td.innerHTML=orig; editing=false; }
    else if(e.key==='Tab'){
      // 表格习惯：Tab 提交并跳到右边一格，Shift+Tab 往左
      e.preventDefault(); e.stopPropagation();
      var nb=cellNeighbor(td, e.shiftKey?-1:1);
      commit();
      if(nb && nb.isConnected) selectCell(nb);
    }
  };
  ipt.onblur=commit;
  editing=true;
}
async function saveRowValue(rid,key,val){
  var tr=document.querySelector('#tbody tr[data-rid="'+rid+'"]');
  var g=null, gi=-1;
  if(GRID){ for(var i=0;i<GRID.d.rows.length;i++){ if(GRID.d.rows[i].id===rid){ g=GRID.d.rows[i]; gi=i; break; } } }
  if(!tr && !g) throw new Error('该行不在当前页');
  var td=tr ? tr.querySelector('td[data-f="'+CSS.escape(key)+'"]') : null;
  var ver=g ? (+g.ver||1) : (td ? (+td.getAttribute('data-ver')||1) : 1);
  var cc=colByKey(key), oldHtml=td ? td.innerHTML : null;
  var oldVal=(ROWDATA[rid]||{})[key];
  // 先就地显示新值，网络往返期间输入框已经消失，不让人等
  if(td && cc){ td.innerHTML=cellHtml(val,cc); td.setAttribute('data-ts',String(Date.now())); }
  var res;
  try { res=await api('/api/tables/'+state.tid+'/rows/'+rid,'PATCH',{data:{[key]:val},ver:ver}); }
  catch(e){ if(td && oldHtml!==null) td.innerHTML=oldHtml; throw e; }
  if (res && res.synced_back) toast('已同步回子表 ' + res.synced_back + ' 行');
  var row=res.row||{}; var nver=res.ver||ver+1;
  ROWDATA[rid]=row;
  if(g){ g.data=row; g.ver=nver; }
  // 记一笔撤销：把这一格的原值、新值存起来（Ctrl+Z 再把原值保存一次）
  if(!UNDO_SUPPRESS && !sameVal(oldVal,val)) undoPush({tid:state.tid,label:(cc&&cc.label)||key,cells:[{rid:rid,key:key,old:oldVal===undefined?null:oldVal,new:val}]});
  // 有筛选/排序/搜索时行可能移位，重新拉一次；否则只就地更新这一行（含公式列），不闪整表
  if(state.kw||state.sort||Object.keys(state.filters).length){ await loadRows(); return res; }
  invalidateRows(state.tid);              // 只有当前表的行变了
  if(tr && tr.isConnected){
    tr.querySelectorAll('td[data-f]').forEach(function(cell){
      var c2=colByKey(cell.getAttribute('data-f')); if(!c2)return;
      cell.innerHTML=cellHtml(row[c2.key],c2);
      cell.setAttribute('data-ver',nver);
    });
  }
  return res;
}
async function patchCell(tr,key,val){
  editing=false;
  try { await saveRowValue(+tr.getAttribute('data-rid'),key,val); }
  catch(e){ toast('保存失败：'+e.message); await loadRows(); }
}

/* ============ 撤销 / 重做（Ctrl+Z / Ctrl+Y） ============
   栈里存“一组单元格改动”：单格编辑是一条，批量粘贴是一条。撤销就是把旧值再保存一遍，
   仍然走乐观锁（期间别人改过这一行会失败并提示），并且只对当前这张表生效。 */
var UNDO_STACK = [], REDO_STACK = [], UNDO_MAX = 50;
var UNDO_SUPPRESS = false, UNDO_BUSY = false;
function sameVal(a, b) {
  return JSON.stringify(a === undefined ? null : a) === JSON.stringify(b === undefined ? null : b);
}
function undoPush(entry) {
  if (UNDO_SUPPRESS) return;
  UNDO_STACK.push(entry);
  if (UNDO_STACK.length > UNDO_MAX) UNDO_STACK.shift();
  REDO_STACK = [];
}
function rowVer(rid) {
  if (!GRID) return null;
  for (var i = 0; i < GRID.d.rows.length; i++) if (GRID.d.rows[i].id === rid) return +GRID.d.rows[i].ver || 1;
  return null;
}
async function applyUndoEntry(entry, redo) {
  if (UNDO_BUSY) return false;
  UNDO_BUSY = true; UNDO_SUPPRESS = true;
  var ok = 0, fail = 0, lastErr = '';
  try {
    var byRow = {};
    entry.cells.forEach(function (c) { (byRow[c.rid] = byRow[c.rid] || []).push(c); });
    var rids = Object.keys(byRow);
    for (var i = 0; i < rids.length; i++) {
      var rid = +rids[i], list = byRow[rids[i]];
      var ver = rowVer(rid);
      if (ver === null) { fail += list.length; continue; }     // 不在当前页，拿不到版本号
      var data = {};
      list.forEach(function (c) { data[c.key] = redo ? c.new : c.old; });
      try { await api('/api/tables/' + state.tid + '/rows/' + rid, 'PATCH', { data: data, ver: ver }); ok += list.length; }
      catch (e) { fail += list.length; lastErr = e.message; }
    }
  } finally { UNDO_SUPPRESS = false; UNDO_BUSY = false; }
  try { await loadRows(); } catch (e) {}
  if (ok) {
    toast((redo ? '已重做' : '已撤销') + '：' + entry.label + (fail ? ('（' + fail + ' 格没成功）') : ''));
  } else {
    toast((redo ? '重做失败' : '撤销失败') + '：' + (lastErr || '这几行不在当前页，没改动'));
  }
  return ok > 0;
}
async function doUndo() {
  var e = UNDO_STACK[UNDO_STACK.length - 1];
  if (!e) { toast('没有可撤销的修改'); return; }
  if (e.tid !== state.tid) { toast('最近一次修改在别的表，切回那张表再撤销'); return; }
  if (await applyUndoEntry(e, false)) { UNDO_STACK.pop(); REDO_STACK.push(e); }
}
async function doRedo() {
  var e = REDO_STACK[REDO_STACK.length - 1];
  if (!e) { toast('没有可重做的修改'); return; }
  if (e.tid !== state.tid) { toast('最近一次修改在别的表，切回那张表再重做'); return; }
  if (await applyUndoEntry(e, true)) { REDO_STACK.pop(); UNDO_STACK.push(e); }
}
document.addEventListener('keydown', function (e) {
  if (!(e.ctrlKey || e.metaKey)) return;
  var el = document.activeElement, tag = el && el.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (el && el.isContentEditable)) return;  // 输入框里的撤销交给浏览器
  if (!$('table-view') || !$('table-view').classList.contains('on')) return;
  if ($('mask') || openFilter) return;
  var k = (e.key || '').toLowerCase();
  if (k === 'z' && !e.shiftKey) { e.preventDefault(); doUndo(); }
  else if ((k === 'z' && e.shiftKey) || k === 'y') { e.preventDefault(); doRedo(); }
});

/* ============ 从 Excel 粘贴一片单元格 ============
   以当前选中的格子为左上角，按 Tab/换行拆开粘贴；只写“当前页已有的行”，不会悄悄插行。
   一行发一个 PATCH（带乐观锁），最后整体刷新并按格数汇报。整片粘贴在撤销栈里算一条。 */
function pasteMatrix(td, text) {
  if (!canEditRows()) { toast('只读权限，不能粘贴'); return; }
  var rows = String(text).replace(/\r\n?/g, '\n').replace(/\n$/, '').split('\n').map(function (l) { return l.split('\t'); });
  if (!rows.length || !GRID) { toast('没有可粘贴的内容'); return; }
  var cols = curCols().filter(function (c) { return c.type !== 'formula' && c.type !== 'image'; });
  var startKey = td.getAttribute('data-f'), startCol = -1;
  for (var i = 0; i < cols.length; i++) if (cols[i].key === startKey) { startCol = i; break; }
  if (startCol < 0) { toast('请先点一个可编辑的单元格（公式列不能粘贴）'); return; }
  var rid = +td.closest('tr').getAttribute('data-rid'), startRow = -1;
  for (var r = 0; r < GRID.d.rows.length; r++) if (GRID.d.rows[r].id === rid) { startRow = r; break; }
  if (startRow < 0) { toast('这一行不在当前页'); return; }
  var nCol = 0; rows.forEach(function (x) { nCol = Math.max(nCol, x.length); });
  var nRow = Math.min(rows.length, GRID.d.rows.length - startRow);
  nCol = Math.min(nCol, cols.length - startCol);
  if (nRow < 1 || nCol < 1) { toast('没有可粘贴的位置'); return; }
  var tasks = [], cells = [], skipped = 0;
  for (var y = 0; y < nRow; y++) {
    var row = GRID.d.rows[startRow + y], data = {}, n = 0;
    for (var x = 0; x < nCol; x++) {
      if (rows[y][x] === undefined) continue;
      var c = cols[startCol + x], v = String(rows[y][x]);
      var oldV = (row.data || {})[c.key];
      var nv = v === '' ? null : v;
      if (sameVal(oldV, nv)) { skipped++; continue; }
      data[c.key] = nv; n++;
      cells.push({ rid: row.id, key: c.key, old: oldV === undefined ? null : oldV, new: nv });
    }
    if (n) tasks.push({ rid: row.id, ver: row.ver, data: data, n: n });
  }
  var extra = rows.length - nRow;
  if (!tasks.length) { toast(skipped ? '粘贴的内容和现有数据一样，没有改动' : '没有可粘贴的内容'); return; }
  showBusy('正在粘贴 ' + tasks.length + ' 行…');
  (async function () {
    var ok = 0, fail = 0, lastErr = '', okCells = [];
    for (var t = 0; t < tasks.length; t++) {
      var task = tasks[t];
      try {
        await api('/api/tables/' + state.tid + '/rows/' + task.rid, 'PATCH', { data: task.data, ver: task.ver });
        ok += task.n;
        cells.forEach(function (c) { if (c.rid === task.rid) okCells.push(c); });
      } catch (e) { fail += task.n; lastErr = e.message; }
    }
    hideBusy();
    if (okCells.length) undoPush({ tid: state.tid, label: '粘贴 ' + okCells.length + ' 格', cells: okCells });
    try { await loadRows(); } catch (e) {}
    var msg = '已粘贴 ' + ok + ' 格';
    if (fail) msg += '，' + fail + ' 格没成功（' + lastErr + '）';
    if (extra > 0) msg += '；超出当前页的 ' + extra + ' 行没有粘贴';
    toast(msg);
  })();
}
document.addEventListener('paste', function (e) {
  var el = document.activeElement, tag = el && el.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || (el && el.isContentEditable)) return;   // 在输入框/编辑器里粘贴走浏览器默认
  if (!$('table-view') || !$('table-view').classList.contains('on')) return;
  if ($('mask') || openFilter) return;
  var td = document.querySelector('#tbody td.cell-sel');
  if (!td) return;
  var cd = e.clipboardData || window.clipboardData;
  var text = cd ? cd.getData('text/plain') : '';
  if (!text) return;
  e.preventDefault();
  pasteMatrix(td, text);
});

/* ============ 单元格批注（挂在格子上的备注，不改数据；只读账号也能写） ============
   表格打开时拉一次汇总（每格几条），有批注的格子右上角显示橙色角标；点角标或选中格子后点气泡按钮打开。 */
var CMT_SUM = {};                 // tid -> {'rowid|key': n}；undefined 表示还没拉过
var CMT_POP = null;
function cmtKey(rid, k) { return rid + '|' + k; }
function ensureCommentSummary(tid) {
  if (!tid) return Promise.resolve({});
  if (CMT_SUM[tid] !== undefined) return Promise.resolve(CMT_SUM[tid]);
  return fetch('/api/tables/' + tid + '/comments/summary', { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : { items: [] }; })
    .then(function (d) {
      var m = {};
      (d.items || []).forEach(function (x) { m[cmtKey(x.row_id, x.col_key)] = x.n; });
      CMT_SUM[tid] = m;
      if (state.tid === tid && GRID) drawGridWindow(true);
      return m;
    })
    .catch(function () { CMT_SUM[tid] = {}; return {}; });
}
function invalidateCommentSummary(tid) { delete CMT_SUM[tid]; }
function closeCellComments() { if (CMT_POP) { CMT_POP.remove(); CMT_POP = null; } }
function openCellComments(rid, key, anchor) {
  closeCellComments(); closeCtxMenu();
  var c = colByKey(key);
  var pop = document.createElement('div'); pop.className = 'cmt-pop';
  pop.innerHTML = '<div class="cmt-head"><b>' + esc(c ? c.label : key) + '</b> · 行 #' + rid
    + '<button class="cmt-x" type="button" title="关闭">×</button></div>'
    + '<div class="cmt-list" id="cmt-list"><div class="cmt-empty">加载中…</div></div>'
    + '<div class="cmt-input"><textarea id="cmt-text" placeholder="写一条批注…（Ctrl+Enter 发送）"></textarea>'
    + '<div class="cmt-foot"><span class="cmt-hint">批注不改数据，只读账号也能写</span><span style="flex:1"></span>'
    + '<button class="btn btn-primary" id="cmt-send" type="button" style="height:28px">发送</button></div></div>';
  document.body.appendChild(pop); CMT_POP = pop;
  var r = anchor.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  var left = Math.min(Math.max(8, r.left), window.innerWidth - pw - 8);
  var top = r.bottom + 6;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
  pop.style.left = Math.round(left) + 'px'; pop.style.top = Math.round(top) + 'px';
  pop.onclick = function (e) { e.stopPropagation(); };
  pop.querySelector('.cmt-x').onclick = closeCellComments;
  function send() {
    var ta = pop.querySelector('#cmt-text'), body = ta.value.trim();
    if (!body) { ta.focus(); return; }
    var btn = pop.querySelector('#cmt-send');
    btn.disabled = true;
    api('/api/tables/' + state.tid + '/comments', 'POST', { row_id: rid, col_key: key, body: body })
      .then(function () {
        ta.value = '';
        invalidateCommentSummary(state.tid);
        ensureCommentSummary(state.tid);
        renderCmList(pop, rid, key);
        toast('批注已添加');
      })
      .catch(function (e) { toast('批注失败：' + e.message); })
      .then(function () { btn.disabled = false; });
  }
  pop.querySelector('#cmt-send').onclick = send;
  pop.querySelector('#cmt-text').onkeydown = function (e) {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); }
    else if (e.key === 'Escape') { e.stopPropagation(); closeCellComments(); }
  };
  pop.querySelector('#cmt-text').focus();
  renderCmList(pop, rid, key);
}
async function renderCmList(pop, rid, key) {
  var listEl = pop.querySelector('#cmt-list');
  try {
    var d = await api('/api/tables/' + state.tid + '/comments?row_id=' + rid + '&col_key=' + encodeURIComponent(key));
    var cs = d.comments || [];
    listEl.innerHTML = cs.length ? cs.map(function (c) {
      return '<div class="cmt-item"><div class="cmt-meta"><span>' + esc(c.author) + '</span><span>' + esc(c.at) + '</span>'
        + ((c.mine || (ME && ME.role === 'admin')) ? '<button class="cmt-del" type="button" data-del="' + c.id + '" title="删除批注">×</button>' : '')
        + '</div><div class="cmt-body">' + esc(c.body) + '</div></div>';
    }).join('') : '<div class="cmt-empty">还没有批注</div>';
    listEl.querySelectorAll('[data-del]').forEach(function (b) {
      b.onclick = function (e) {
        e.stopPropagation();
        api('/api/comments/' + b.getAttribute('data-del'), 'DELETE').then(function () {
          invalidateCommentSummary(state.tid);
          ensureCommentSummary(state.tid);
          renderCmList(pop, rid, key);
        }).catch(function (err) { toast('删除失败：' + err.message); });
      };
    });
  } catch (e) { listEl.innerHTML = '<div class="cmt-empty">读取失败：' + esc(e.message) + '</div>'; }
}
document.addEventListener('click', function (e) {
  if (CMT_POP && !e.target.closest('.cmt-pop') && !e.target.closest('.cmt-dot') && !e.target.closest('.cell-cmt')) closeCellComments();
}, true);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCellComments(); });
window.addEventListener('scroll', closeCellComments, true);
window.addEventListener('resize', closeCellComments);

/* ============ 行编辑侧栏（双击行号） ============ */
var RP = null;

function rpDisplay(v) {
  if (v === null || v === undefined || v === '') return '';
  if (v === true) return '是';
  if (v === false) return '否';
  if (Array.isArray(v)) return v.join('、');
  return String(v);
}

function rpIcon(t) {
  var p = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  if (t === 'number') return '<svg width="14" height="14" ' + p + '><path d="M10 4L8 20M16 4l-2 16M4 9h16M4 15h16"/></svg>';
  if (t === 'date') return '<svg width="14" height="14" ' + p + '><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>';
  if (t === 'select') return '<svg width="14" height="14" ' + p + '><circle cx="12" cy="12" r="8"/><path d="M9 10l3 3 3-3"/></svg>';
  if (t === 'multiselect') return '<svg width="14" height="14" ' + p + '><path d="M20.6 13.4L12 22l-9-9V4h9z"/><circle cx="8" cy="8" r="1.4"/></svg>';
  if (t === 'checkbox') return '<svg width="14" height="14" ' + p + '><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg>';
  if (t === 'image') return '<svg width="14" height="14" ' + p + '><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>';
  if (t === 'formula') return '<svg width="14" height="14" ' + p + '><path d="M14 5h-2a3 3 0 0 0-3 3v11M7 11h6M13 13l5 7M18 13l-5 7"/></svg>';
  return '<svg width="14" height="14" ' + p + '><path d="M4 6h16M4 12h16M4 18h11"/></svg>';
}

function rpName(row, cols) {
  var c = cols.find(function (x) {
    return (x.type === 'text' || x.type === 'select') && rpDisplay(row[x.key]);
  });
  if (c) return rpDisplay(row[c.key]);
  c = cols.find(function (x) { return rpDisplay(row[x.key]); });
  return c ? rpDisplay(row[c.key]) : '';
}

function rpFieldHtml(c, v) {
  var key = esc(c.key);
  if (RP.readonly) {
    var txt = rpDisplay(displayFormat(c, c.type === 'text' ? readJsonCell(v) : v)) || '—';
    if (c.type === 'multiselect') {
      var ra = Array.isArray(v) ? v.map(String) : (v ? [String(v)] : []);
      return '<div class="rp-tags">' + ra.map(function (x) {
        return '<span class="tag ' + tagFor(x, c) + '">' + esc(x) + '</span>';
      }).join('') + (ra.length ? '' : '<span class="rp-empty">—</span>') + '</div>';
    }
    if (c.type === 'image' && /^(https?:\/\/|\/api\/tables\/)/i.test(txt)) {
      return '<img class="rp-img-preview" src="' + esc(txt) + '" alt="">';
    }
    return '<div class="rp-readonly' + (c.type === 'formula' ? ' rp-fx' : '') + '">' + esc(txt) + '</div>';
  }
  if (c.type === 'image') {
    var iu = rpDisplay(v);
    var has = /^(https?:\/\/|\/api\/tables\/)/i.test(iu);
    return '<div class="rp-image"><div class="rp-image-box">'
      + (has ? '<img src="' + esc(iu) + '" alt="">' : '<span class="rp-image-empty">未设置</span>')
      + '</div><div class="rp-image-side">'
      + '<button class="rp-upload" type="button" data-rp-upload="' + key + '">上传图片</button>'
      + '<input type="file" data-rp-file="' + key + '" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" style="display:none">'
      + '<input class="rp-input" data-rp-text="' + key + '" placeholder="或粘贴图片链接" value="' + esc(iu) + '">'
      + '</div></div>';
  }
  if (c.type === 'formula') {
    return '<div class="rp-readonly rp-fx" data-rp-formula="' + key + '" title="公式：' + esc(c.expr || '') + '">' + esc(rpDisplay(displayFormat(c, v)) || '—') + '</div>';
  }
  if (c.type === 'select') {
    var sval = v ? String(v) : '';
    return '<div class="rp-pick" data-rp-pick="' + key + '" tabindex="0" role="button">'
      + (sval ? '<span class="tag ' + tagFor(sval, c) + '">' + esc(sval) + '</span>'
              : '<span class="rp-pick-empty">从下拉菜单选择</span>')
      + '<svg class="rp-caret" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>'
      + '</div>';
  }
  if (c.type === 'multiselect') {
    var arr = Array.isArray(v) ? v.map(String) : (v ? [String(v)] : []);
    return '<div class="rp-tags" data-rp-tags="' + key + '">'
      + arr.map(function (x) {
        return '<span class="tag ' + tagFor(x, c) + '">' + esc(x)
          + '<button class="rp-tag-x" data-rp-rm="' + esc(x) + '" title="移除">×</button></span>';
      }).join('')
      + '<button class="rp-add" data-rp-add="' + key + '" type="button">＋ 添加</button></div>';
  }
  if (c.type === 'checkbox') {
    return '<label class="rp-check"><input type="checkbox" data-rp-chk="' + key + '"'
      + (v ? ' checked' : '') + '> 是</label>';
  }
  if (c.type === 'date') {
    return '<div class="date-field rp-date"><input class="rp-input" readonly data-rp-date="' + key + '" placeholder="选择日期" value="' + esc(String(v || '').slice(0, 10)) + '">'
      + (RP && RP.readonly ? '' : '<button type="button" class="date-btn" data-rp-date-btn="' + key + '">' + DATE_ICON_SVG + '</button>')
      + '</div>';
  }
  if (c.type === 'number') {
    return '<input class="rp-input" type="text" inputmode="decimal" autocomplete="off" data-rp-text="' + key + '" placeholder="请输入数字" value="'
      + esc(v === null || v === undefined ? '' : String(v)) + '">';
  }
  return '<input class="rp-input" data-rp-text="' + key + '" placeholder="请输入内容" value="'
    + esc(v === null || v === undefined ? '' : (c.type === 'text' ? readJsonCell(v) : String(v))) + '">';
}

function renderRowPanel() {
  if (!RP) return;
  var row = ROWDATA[RP.rid] || RP.row || {};
  var cols = curCols();
  $('rp-title').textContent = rpName(row, cols) || ('行 #' + RP.rid);
  $('rp-sub').textContent = '行 #' + RP.rid;
  $('rp-status').textContent = RP.readonly ? '只读' : '';
  var rpDel = $('rp-del'); if (rpDel) rpDel.style.display = RP.readonly ? 'none' : '';
  $('rp-body').innerHTML = cols.map(function (c) {
    return '<div class="rp-field" data-rp-field="' + esc(c.key) + '">'
      + '<div class="rp-label">' + rpIcon(c.type) + '<span title="' + esc(c.label) + '">' + esc(c.label) + '</span></div>'
      + '<div class="rp-val">' + rpFieldHtml(c, row[c.key]) + '</div></div>';
  }).join('');
  rpBindFields();
}

function rpRefresh(row) {
  if (!RP) return;
  row = row || ROWDATA[RP.rid] || RP.row || {};
  var cols = curCols();
  $('rp-title').textContent = rpName(row, cols) || ('行 #' + RP.rid);
  $('rp-sub').textContent = '行 #' + RP.rid;
  $('rp-body').querySelectorAll('[data-rp-formula]').forEach(function (el) {
    var k = el.getAttribute('data-rp-formula');
    el.textContent = rpDisplay(row[k]) || '—';
  });
}

async function rpSave(key, val, rerender) {
  if (!RP) return false;
  if (RP.readonly) { toast('只读权限，不能修改'); return false; }
  var col = colByKey(key);
  if (col && col.type === 'image') rerender = true;
  var rid = RP.rid;
  $('rp-status').textContent = '保存中…';
  try {
    var res = await saveRowValue(rid, key, val);
    RP.row = ROWDATA[rid] || res.row || {};
    if (!ROWDATA[rid]) { closeRowPanel(); return false; }
    $('rp-status').textContent = '已保存';
    if (rerender) {
      var sc = $('rp-body').scrollTop;
      renderRowPanel();
      $('rp-body').scrollTop = sc;
      $('rp-status').textContent = '已保存';
    } else {
      rpRefresh();
    }
    return true;
  } catch (e) {
    $('rp-status').textContent = '保存失败';
    toast('保存失败：' + e.message);
    // 乐观锁冲突：自动拉最新数据重绘面板，避免一直冲突
    if (String(e.message).indexOf('已被别人改过') !== -1) {
      invalidateRows(state.tid);
      loadRows().then(function () {
        if (RP && RP.rid === rid) {
          var sc = $('rp-body').scrollTop;
          renderRowPanel();
          $('rp-body').scrollTop = sc;
          $('rp-status').textContent = '内容已刷新，请重试';
        }
      });
    }
    return false;
  }
}

function closeRowPanel() {
  closeDatePicker();
  var p = $('row-panel');
  if (p) p.classList.remove('on');
  closeCellPop();
  RP = null;
}

function confirmDeleteRow(rid) {
  var t = curTable();
  if (!t) return;
  if (!canEditRows()) { toast('只读权限，不能删除'); return; }
  var nm = rpName(ROWDATA[rid] || {}, curCols()) || '';
  if (!nm || nm === '0') nm = 'ID ' + rid;   // 空行/纯数字 0 时显示行 ID
  var syncSub = (t.sync_sources && t.sync_sources.length)
    ? '<div class="del-row-sub del-row-sync">本表是汇总总表：如果这行是从子表汇总来的，子表里对应的那一行也会一起删除。</div>'
    : '';
  appConfirm('删除行',
    '确定删除「<b>' + esc(nm) + '</b>」？'
    + '<div class="del-row-sub">行 ID ' + rid + '，删除后从当前表移除。</div>' + syncSub,
    '删除', true).then(function (ok) {
    if (!ok) return;
    api('/api/tables/' + t.id + '/rows/' + rid, 'DELETE').then(function () {
      if (RP && RP.rid === rid) closeRowPanel();
      if (t.count > 0) t.count = t.count - 1;   // 分页里的「全部 N 行」跟着减，不用再拉一次元信息
      invalidateRows(state.tid);
      loadRows().then(function () { toast('已删除行 #' + rid); });
    }).catch(function (e) { toast('删除失败：' + e.message); });
  });
}

function toggleRowPanel(rid) {
  if (RP && RP.rid === rid && $('row-panel').classList.contains('on')) { closeRowPanel(); return; }
  openRowPanel(rid);
}
function openRowPanel(rid) {
  if (!ROWDATA[rid]) { toast('行数据还没加载'); return; }
  var t = curTable();
  RP = { rid: rid, row: ROWDATA[rid], readonly: !(t && t.my_role === 'editor') };
  $('row-panel').classList.add('on');
  renderRowPanel();
}

function rpOpenSelect(btn, c) {
  if (!RP || RP.readonly) return;
  closeCellPop();
  var cur = (ROWDATA[RP.rid] || {})[c.key];
  var curS = cur ? String(cur) : '';
  var opts = (c.options || []).map(String);
  if (curS && opts.indexOf(curS) === -1) opts.unshift(curS);
  var pop = document.createElement('div');
  pop.className = 'cell-pop';
  var r = btn.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 260)) + 'px';
  pop.style.top = Math.min(r.bottom + 4, window.innerHeight - 300) + 'px';
  pop.style.minWidth = Math.max(r.width, 190) + 'px';
  pop.innerHTML = opts.map(function (o) {
    return '<div class="cp-opt' + (curS === o ? ' on' : '') + '" data-v="' + esc(o) + '">'
      + '<span class="tag ' + tagFor(o, c) + '">' + esc(o) + '</span>'
      + (curS === o ? '<span class="cp-check">✓</span>' : '') + '</div>';
  }).join('') + '<div class="cp-opt cp-clear" data-v="">（空）</div>';
  document.body.appendChild(pop);
  cellPop = pop;
  pop.onclick = function (e) {
    e.stopPropagation();
    var it = e.target.closest('.cp-opt');
    if (!it) return;
    var v = it.getAttribute('data-v');
    closeCellPop();
    rpSave(c.key, v, true);
  };
  setTimeout(function () {
    document.addEventListener('click', function h(ev) {
      if (!ev.target.closest('.cell-pop')) { closeCellPop(); document.removeEventListener('click', h); }
    });
  }, 0);
}

function rpOpenMulti(btn, c) {
  if (!RP || RP.readonly) return;
  closeCellPop();
  var cur = ROWDATA[RP.rid] && ROWDATA[RP.rid][c.key];
  var arr = Array.isArray(cur) ? cur.map(String) : (cur ? [String(cur)] : []);
  var opts = (c.options || []).map(String);
  arr.forEach(function (x) { if (opts.indexOf(x) === -1) opts.unshift(x); });
  if (!opts.length) { toast('该字段还没有选项'); return; }
  var pop = document.createElement('div');
  pop.className = 'cell-pop cell-pop-multi';
  var r = btn.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 260)) + 'px';
  pop.style.top = Math.min(r.bottom + 4, window.innerHeight - 320) + 'px';
  pop.style.minWidth = '210px';
  pop.innerHTML = opts.map(function (o) {
    return '<label class="cp-opt cp-multi" data-v="' + esc(o) + '">'
      + '<input type="checkbox" value="' + esc(o) + '"' + (arr.indexOf(o) !== -1 ? ' checked' : '') + '>'
      + '<span class="tag ' + tagFor(o, c) + '">' + esc(o) + '</span></label>';
  }).join('')
    + '<div class="cp-foot"><button class="btn" type="button" data-act="cancel">取消</button>'
    + '<button class="btn btn-primary" type="button" data-act="ok">确定</button></div>';
  document.body.appendChild(pop);
  cellPop = pop;
  pop.onclick = function (e) { e.stopPropagation(); };
  pop.querySelector('[data-act="cancel"]').onclick = function () { closeCellPop(); };
  pop.querySelector('[data-act="ok"]').onclick = function () {
    var vals = Array.from(pop.querySelectorAll('input:checked')).map(function (x) { return x.value; });
    closeCellPop();
    rpSave(c.key, vals, true);
  };
  setTimeout(function () {
    document.addEventListener('click', function h(ev) {
      if (!ev.target.closest('.cell-pop')) { closeCellPop(); document.removeEventListener('click', h); }
    });
  }, 0);
}

function rpBindFields() {
  if (!RP || RP.readonly) return;
  var body = $('rp-body');
  body.querySelectorAll('[data-rp-text]').forEach(function (inp) {
    var key = inp.getAttribute('data-rp-text');
    var orig = inp.value;
    inp.onkeydown = function (e) {
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
      else if (e.key === 'Escape') {
        e.stopPropagation();
        inp.value = orig;
        inp._cancel = true;
        inp.blur();
      }
    };
    inp.onblur = function () {
      if (inp._cancel) { inp._cancel = false; return; }
      var v = inp.value;
      if (v === orig) return;
      orig = v;
      rpSave(key, v, false);
    };
  });
  body.querySelectorAll('[data-rp-date]').forEach(function (inp) {
    var key = inp.getAttribute('data-rp-date');
    inp.onchange = function () { rpSave(key, inp.value, false); };
    inp.onclick = function () { openDatePicker(inp); };
    var db = body.querySelector('[data-rp-date-btn="' + CSS.escape(key) + '"]');
    if (db) db.onclick = function (e) { e.preventDefault(); openDatePicker(inp); };
  });
  body.querySelectorAll('[data-rp-pick]').forEach(function (btn) {
    var key = btn.getAttribute('data-rp-pick');
    var c = colByKey(key);
    if (!c) return;
    btn.onclick = function (e) { e.stopPropagation(); rpOpenSelect(btn, c); };
    btn.onkeydown = function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); rpOpenSelect(btn, c); }
    };
  });
  body.querySelectorAll('[data-rp-chk]').forEach(function (chk) {
    chk.onchange = function () { rpSave(chk.getAttribute('data-rp-chk'), chk.checked, false); };
  });
  body.querySelectorAll('[data-rp-upload]').forEach(function (btn) {
    btn.onclick = function (e) {
      e.stopPropagation();
      var key = btn.getAttribute('data-rp-upload');
      var fi = body.querySelector('[data-rp-file="' + CSS.escape(key) + '"]');
      if (fi) fi.click();
    };
  });
  body.querySelectorAll('[data-rp-file]').forEach(function (inp) {
    inp.onchange = async function () {
      var f = this.files && this.files[0];
      var key = inp.getAttribute('data-rp-file');
      this.value = '';
      if (!f) return;
      if (f.size > 8 * 1024 * 1024) { toast('图片不能超过 8MB'); return; }
      $('rp-status').textContent = '上传中…';
      try {
        var d = await uploadImageFile(state.tid, f);
        await rpSave(key, d.url, true);
      } catch (e) {
        $('rp-status').textContent = '上传失败';
        toast('上传失败：' + e.message);
      }
    };
  });
  body.querySelectorAll('[data-rp-tags]').forEach(function (wrap) {
    var key = wrap.getAttribute('data-rp-tags');
    var c = colByKey(key);
    wrap.querySelectorAll('[data-rp-rm]').forEach(function (btn) {
      btn.onclick = function (e) {
        e.stopPropagation();
        var cur = (ROWDATA[RP.rid] || {})[key];
        var arr = Array.isArray(cur) ? cur.map(String) : (cur ? [String(cur)] : []);
        var v = btn.getAttribute('data-rp-rm');
        rpSave(key, arr.filter(function (x) { return x !== v; }), true);
      };
    });
    var add = wrap.querySelector('[data-rp-add]');
    if (add) add.onclick = function (e) { e.stopPropagation(); rpOpenMulti(add, c); };
  });
}

$('rp-close').onclick = closeRowPanel;
$('rp-del').onclick = function () { if (RP) confirmDeleteRow(RP.rid); };
$('rp-title').ondblclick = closeRowPanel;
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape' || !RP) return;
  if (e.target.closest('#row-panel input, #row-panel textarea, #row-panel select')) return;
  closeRowPanel();
});

/* ============ 筛选浮层（值多选 / 日期日历） ============ */

/* ============ 高级筛选：多列条件 + 且 / 或 ============
   存法：state.filters = { logic:'and'|'or', conds:[{key,op,value,value2}] }
   和单列筛选一样只是你自己的视图状态（能存进「视图 ▾」），不写数据库、不影响别人。
   只支持一层组合：条件之间统一“全部满足”或“任一满足”，不做 A 且 (B 或 C) 的嵌套。 */
function advOpsFor(type){
  if(type==='number'||type==='formula')
    return [['eq','等于'],['neq','不等于'],['gt','大于'],['gte','≥'],['lt','小于'],['lte','≤'],['between','区间'],['empty','为空'],['notempty','不为空']];
  if(type==='date') return [['daterange','区间'],['empty','为空'],['notempty','不为空']];
  if(type==='checkbox') return [['cb_yes','是'],['cb_no','否']];
  if(type==='multiselect') return [['contains','包含'],['notcontains','不包含'],['empty','为空'],['notempty','不为空']];
  return [['contains','包含'],['notcontains','不包含'],['eq','等于'],['neq','不等于'],['empty','为空'],['notempty','不为空']];
}
function advFilterCols(){ return (curTable().columns||[]).filter(function(c){ return c.type!=='image'; }); }
function openAdvancedFilter(seedKey){
  var cols=advFilterCols();
  if(!cols.length){ toast('这张表还没有可以筛选的列'); return; }
  var src=isAdvFilter(state.filters)?state.filters:null, init=[];
  if(src) init=src.conds.map(function(x){
    return {key:x.key, op:x.op||'contains', value:x.value==null?'':String(x.value), value2:x.value2==null?'':String(x.value2)};
  }).filter(function(x){ return cols.some(function(c){ return c.key===x.key; }); }).slice(0,20);
  var ADV={logic:(src&&src.logic==='or')?'or':'and', conds:init};
  function colOf(k){ return cols.filter(function(c){ return c.key===k; })[0]||cols[0]; }
  function seedCond(k0){
    var kk=(k0&&cols.some(function(c){return c.key===k0;}))?k0:cols[0].key;
    return {key:kk, op:advOpsFor(colOf(kk).type)[0][0], value:'', value2:''};
  }
  if(!ADV.conds.length) ADV.conds=[seedCond(seedKey)];
  modal('高级筛选', '<div id="adv-body"></div>',
    '<button class="btn" id="adv-clear">清除筛选</button><button class="btn" id="adv-cancel">取消</button>'
    + '<button class="btn btn-primary" id="adv-ok">应用</button>',
    function(root){
      root.querySelector('.box').classList.add('wide');
      var body=root.querySelector('#adv-body');
      body.innerHTML='<div class="adv-logic"><span>条件之间：</span>'
        + '<label><input type="radio" name="adv-logic" value="and">全部满足（且）</label>'
        + '<label><input type="radio" name="adv-logic" value="or">任一满足（或）</label></div>'
        + '<div id="adv-conds"></div>'
        + '<button type="button" class="adv-add" id="adv-add">＋ 添加条件</button>'
        + '<div class="adv-hint">· 条件之间只能统一“全部满足”或“任一满足”，不支持 (A 且 (B 或 C)) 这种嵌套。<br>'
        + '· 留空的条件会被忽略；一条都不填就相当于不筛选。<br>'
        + '· 和普通筛选一样只影响你自己的视图，别人看到的还是全部数据。</div>';
      var wrap=body.querySelector('#adv-conds');
      function syncRadios(){
        body.querySelectorAll('input[name="adv-logic"]').forEach(function(r){
          r.checked=(r.value===ADV.logic);
          r.onchange=function(){ ADV.logic=r.value; };
        });
      }
      function rowHtml(c){
        var col=colOf(c.key), ops=advOpsFor(col.type);
        var op=ops.some(function(o){ return o[0]===c.op; })?c.op:ops[0][0];
        var isNum=(col.type==='number'||col.type==='formula');
        var vt=col.type==='date'?' type="date"':(isNum?' inputmode="decimal"':'');
        return '<select class="adv-f" data-native="1">'+cols.map(function(x){
            return '<option value="'+esc(x.key)+'"'+(x.key===col.key?' selected':'')+'>'
              + esc(x.label)+(x.hidden?'（隐藏）':'')+'</option>';
          }).join('')+'</select>'
          + '<select class="adv-op" data-native="1">'+ops.map(function(o){
            return '<option value="'+o[0]+'"'+(o[0]===op?' selected':'')+'>'+o[1]+'</option>';
          }).join('')+'</select>'
          + '<div class="adv-vals"><input class="adv-v"'+vt+' placeholder="值"><input class="adv-v2"'+vt+' placeholder="到"></div>';
      }
      function syncRow(row){
        var op=row.querySelector('.adv-op').value;
        var vals=row.querySelector('.adv-vals'), v=row.querySelector('.adv-v'), v2=row.querySelector('.adv-v2');
        var needVals=(op!=='empty' && op!=='notempty' && op!=='cb_yes' && op!=='cb_no');
        vals.style.display=needVals?'':'none';
        v2.style.display=(op==='between'||op==='daterange')?'':'none';
        v.setAttribute('placeholder', op==='daterange'?'开始日期':(op==='between'?'最小值':'值'));
        v2.setAttribute('placeholder', op==='daterange'?'结束日期':'最大值');
      }
      function renderConds(){
        wrap.innerHTML=ADV.conds.map(function(c,i){
          return '<div class="adv-cond" data-i="'+i+'">'+rowHtml(c)
            + '<button type="button" class="adv-del" title="删除这条条件">✕</button></div>';
        }).join('');
        wrap.querySelectorAll('.adv-cond').forEach(function(row,i){
          var c=ADV.conds[i];
          var v=row.querySelector('.adv-v'), v2=row.querySelector('.adv-v2');
          v.value=c.value||''; v2.value=c.value2||'';
          /* 边输边回写：改别的行/删行会整组重绘，没回写的值会被清掉（真浏览器里踩到过） */
          v.oninput=function(){ ADV.conds[i].value=v.value; };
          v2.oninput=function(){ ADV.conds[i].value2=v2.value; };
          row.querySelector('.adv-f').onchange=function(){
            ADV.conds[i]={key:this.value, op:advOpsFor(colOf(this.value).type)[0][0], value:'', value2:''};
            renderConds();
          };
          row.querySelector('.adv-op').onchange=function(){
            ADV.conds[i].op=this.value; syncRow(row);
          };
          row.querySelector('.adv-del').onclick=function(){
            ADV.conds.splice(i,1); if(!ADV.conds.length) ADV.conds=[seedCond()];
            renderConds();
          };
          syncRow(row);
        });
      }
      function collect(){
        var out=[];
        wrap.querySelectorAll('.adv-cond').forEach(function(row){
          var key=row.querySelector('.adv-f').value, op=row.querySelector('.adv-op').value;
          var v=(row.querySelector('.adv-v').value||'').trim();
          var v2=(row.querySelector('.adv-v2').value||'').trim();
          if(op==='empty'||op==='notempty'){ out.push({key:key, op:op}); return; }
          if(op==='cb_yes'){ out.push({key:key, op:'eq', value:'是'}); return; }
          if(op==='cb_no'){ out.push({key:key, op:'eq', value:'否'}); return; }
          if(op==='daterange'){ if(v||v2) out.push({key:key, op:'daterange', value:v, value2:v2}); return; }
          if(op==='between'){
            if(v&&v2) out.push({key:key, op:'between', value:v, value2:v2});
            else if(v) out.push({key:key, op:'gte', value:v});
            else if(v2) out.push({key:key, op:'lte', value:v2});
            return;
          }
          if(v==='') return;
          out.push({key:key, op:op, value:v});
        });
        return out.slice(0,20);
      }
      body.querySelector('#adv-add').onclick=function(){
        if(ADV.conds.length>=20){ toast('最多 20 个条件'); return; }
        ADV.conds.push(seedCond()); renderConds();
      };
      root.querySelector('#adv-cancel').onclick=function(){ closeModal(); };
      root.querySelector('#adv-clear').onclick=function(){
        state.filters=Object.create(null); state.page=1; closeModal();
        renderHead(); loadRows(); updateViewChrome(); toast('已清除筛选');
      };
      root.querySelector('#adv-ok').onclick=function(){
        var list=collect();
        if(!list.length) state.filters=Object.create(null);
        else state.filters={ logic:ADV.logic==='or'?'or':'and', conds:list };
        state.page=1; closeModal(); renderHead(); loadRows(); updateViewChrome();
        toast(list.length ? ('高级筛选：'+list.length+' 个条件，'+(ADV.logic==='or'?'任一满足':'全部满足')+'（只影响你自己的视图）')
                          : '条件都是空的，已清除筛选');
      };
      syncRadios(); renderConds();
      var f0=wrap.querySelector('.adv-v'); if(f0 && f0.style.display!=='none') f0.focus();
    });
}
/* 文本/数字/公式：条件筛选（包含、等于、大于…、区间） */
function buildCondPop(pop,k,c,isNum,onBack){
  var cur=state.filters[k]||{};
  var ops = isNum
    ? [['eq','等于'],['gt','大于'],['lt','小于'],['gte','≥'],['lte','≤'],['between','区间']]
    : [['contains','包含'],['eq','等于'],['neq','不等于'],['notcontains','不包含']];
  if(!cur.op) cur={op:ops[0][0], value:'', value2:''};
  pop.innerHTML='<div class="fc">'
    + '<select class="fc-op">'+ops.map(function(o){return '<option value="'+o[0]+'">'+o[1]+'</option>';}).join('')+'</select>'
    + '<input class="fc-v" placeholder="值">'
    + '<input class="fc-v2" placeholder="到" style="display:none">'
    + '</div>'
    + '<div class="fp-foot">'
    + (onBack ? '<span data-act="back">← 按值选择</span>' : '<span></span>')
    + '<span class="fp-foot-r"><span data-act="clear">清除</span><span data-act="apply">应用</span></span>'
    + '</div>';
  enhanceSelects(pop);
  var back=pop.querySelector('[data-act="back"]');
  if(back && onBack) back.onclick=function(e){ e.stopPropagation(); onBack(); };
  var opSel=pop.querySelector('.fc-op'), v1=pop.querySelector('.fc-v'), v2=pop.querySelector('.fc-v2');
  opSel.value=cur.op||ops[0][0]; v1.value=cur.value||''; v2.value=cur.value2||'';
  function sync(){ v2.style.display = opSel.value==='between' ? '' : 'none'; }
  opSel.onchange=sync; sync();
  v1.onkeydown=function(e){ if(e.key==='Enter') apply(); };
  v2.onkeydown=function(e){ if(e.key==='Enter') apply(); };
  function apply(){
    var op=opSel.value, a=v1.value.trim(), b=v2.value.trim();
    if(op==='between'){ if(!a&&!b){ delete state.filters[k]; } else state.filters[k]={op:op,value:a,value2:b}; }
    else { if(a===''){ delete state.filters[k]; } else state.filters[k]={op:op,value:a}; }
    state.page=1; closeFilterPop(); loadRows(); updateFunnels();
  }
  pop.querySelector('[data-act="apply"]').onclick=apply;
  pop.querySelector('[data-act="clear"]').onclick=function(){
    delete state.filters[k]; state.page=1; closeFilterPop(); loadRows(); updateFunnels();
  };
  v1.focus();
}

function waitRowEl(rid, timeout) {
  return new Promise(function (resolve) {
    var t0 = Date.now();
    (function tick() {
      revealRow(rid);
      var tr = document.querySelector('#tbody tr[data-rid="' + rid + '"]');
      if (tr) return resolve(tr);
      if (Date.now() - t0 >= timeout) return resolve(null);
      setTimeout(tick, 50);
    })();
  });
}
function focusRowEl(rid) {
  revealRow(rid);
  var tr = document.querySelector('#tbody tr[data-rid="' + rid + '"]');
  if (!tr) return false;
  try { tr.scrollIntoView({ block: 'center', inline: 'nearest', behavior: 'smooth' }); }
  catch (e) { tr.scrollIntoView(); }
  tr.classList.remove('row-flash');
  void tr.offsetWidth;
  tr.classList.add('row-flash');
  setTimeout(function () { tr.classList.remove('row-flash'); }, 1800);
  return true;
}
$('btn-add-row').onclick = async function () {
  if (!state.tid) { toast('请先打开一张表'); return; }
  try {
    var res = await api('/api/tables/' + state.tid + '/rows', 'POST', { data: {} });
    var rid = res && res.id;
    var hadView = !!(state.kw || state.sort || Object.keys(state.filters).length);
    if (hadView) {
      state.kw = ''; $('kw').value = '';
      state.sort = ''; state.dir = 1; state.filters = Object.create(null);
      closeFilterPop();
    }
    var t = curTable();
    var cnt = ((t && t.count) || 0) + 1;
    state.page = state.size > 0 ? Math.max(1, Math.ceil(cnt / state.size)) : 1;
    await refreshMeta(state.tid);
    var tr = await waitRowEl(rid, 700);
    if (!tr) {
      var total = (curTable() && curTable().count) || cnt;
      var last = state.size > 0 ? Math.max(1, Math.ceil(total / state.size)) : 1;
      if (last !== state.page) { state.page = last; await loadRows(); }
      tr = await waitRowEl(rid, 1400);

      focusRowEl(rid);

$('btn-hist').onclick=async function(){
  var t=curTable();
  var d=await api('/api/tables/'+state.tid+'/audit?limit=200');
  var labelOf=Object.create(null);
  (t.columns||[]).forEach(function(c){ labelOf[c.key]=c.label; });
  function colName(k){ return labelOf[k]||k; }
  function fmtVal(v){
    if(v===null||v===undefined||v==='') return '<span class="hv-none">空</span>';
    if(typeof v==='object') v=JSON.stringify(v);
    var str=String(v);
    return '<span class="hv">'+esc(str.length>90?str.slice(0,90)+'…':str)+'</span>';
  }
  function diff(o,n){ return fmtVal(o)+'<span class="hv-arrow">→</span>'+fmtVal(n); }
  function describe(r){
    var det=r.detail||{};
    if(typeof det==='string'){ try{ det=JSON.parse(det); }catch(e){ det={}; } }
    var act=r.action, rowTag = r.row_id ? ('行 #'+r.row_id) : '';
    var head='', diffs=[];
    if(act==='update_row'){
      var ks=Object.keys(det||{});
      if(!ks.length){ head=(rowTag?rowTag+' · ':'')+'保存（无字段变化）'; }
      else {
        head=(rowTag?rowTag+' · ':'')+ks.map(function(k){return '列「'+colName(k)+'」';}).join('、');
        ks.forEach(function(k){ diffs.push(diff((det[k]||{}).old,(det[k]||{}).new)); });
      }
    } else if(act==='create_row'){
      head='新增'+(rowTag||'一行');
      var ck=Object.keys(det||{});
      if(ck.length) head+='（'+ck.map(colName).join('、')+'）';
    } else if(act==='delete_row'){
      head='删除'+(rowTag||'一行');
    } else if(act==='create_column'){
      head='新增列「'+(det.label||'')+'」'+(det.type?'（'+(TYPE_LABEL[det.type]||det.type)+'）':'');
    } else if(act==='delete_column'){
      head='删除列「'+(det.label||'')+'」';
    } else if(act==='update_column'){
      head='修改列「'+(det.col||det.label||'')+'」';
      if(det.label) diffs.push('名称 '+diff(det.label.old,det.label.new));
      if(det.type) diffs.push('类型 '+diff(TYPE_LABEL[det.type.old]||det.type.old, TYPE_LABEL[det.type.new]||det.type.new));
      if(det.expr) diffs.push('公式 '+diff(det.expr.old,det.expr.new));
    } else if(act==='rename_table'){
      head='重命名表'; diffs.push(diff(det.old,det.new));
    } else if(act==='create_table'){
      head='新建表「'+(det.name||'')+'」';
    } else if(act==='import_rows'){
      head='导入 Excel：新增 '+(det.rows||0)+' 行'+(det.mode==='replace'?'（覆盖）':'');
    } else if(act==='import_new_table'){
      head='导入 Excel 新建表「'+(det.name||'')+'」：'+(det.rows||0)+' 行';
    } else if(act==='delete_table'){
      head='删除表';
    } else if(act==='sort_columns'){
      head='调整列顺序 / 显隐';
    } else if(act==='fix_column_shift'){
      head='修正列错位（'+(det.rows||0)+' 行）';
    } else if(act==='api_insert'){
      head='接口写入 '+(det.count||det.rows||0)+' 行'+(det.key?('（密钥 '+det.key+'）'):'');
    } else if(act==='apikey_create'){
      head='生成写入密钥'+(det.key?(' '+det.key):'')+(det.note?('（'+det.note+'）'):'');
    } else if(act==='apikey_revoke'){
      head='作废写入密钥'+(det.note?('（'+det.note+'）'):'');
    } else if(act==='sync_insert'||act==='sync_update'||act==='sync_delete') {
      head=(act==='sync_insert'?'汇总同步：新增':(act==='sync_update'?'汇总同步：更新':'汇总同步：删除'))+(rowTag?' '+rowTag:'')+'（来自子表）';
    } else if(act==='sync_cleanup'){
      head='汇总同步：清理总表里已失效的复制行'+(det.rows?('（'+det.rows+' 行）'):'');
    } else if(act==='update_table'){
      head='修改表设置';
    } else {
      // 认不出的动作：动作名 + 截断的详情，不再整段甩原始 JSON
      head=esc(act||'其他操作');
      var detTxt=Object.keys(det||{}).length?JSON.stringify(det):'';
      if(detTxt) diffs.push('<span class="hv-none">'+esc(detTxt.length>120?detTxt.slice(0,120)+'…':detTxt)+'</span>');
    }
    return {head:head, diffs:diffs};
  }
  var rows=d.rows.length?d.rows.map(function(r){
    var info=describe(r);
    var actor=r.actor?('@'+r.actor):'系统';
    return '<div class="hist-row">'
      + '<div class="hist-time">'+esc(r.at)+'</div>'
      + '<div class="hist-main"><div class="hist-line">'
      +   '<span class="hist-actor">'+esc(actor)+'</span>'
      +   '<span class="hist-head">'+esc(info.head)+'</span></div>'
      +   (info.diffs.length?'<div class="hist-diff">'+info.diffs.join('<br>')+'</div>':'')
      + '</div></div>';
  }).join(''):'<div class="dr-empty">暂无变动记录</div>';
  modal('变动历史 · '+(t.name.split('·')[1]||t.name),
    '<div class="hist-tbl">表：'+esc(t.name)+'</div>'+rows,
    '<button class="btn" id="hx">关闭</button>',
    function(root){ root.querySelector('.box').classList.add('wide'); $('hx').onclick=closeModal;});
};

/* ============ 拖拽排序（长按 320ms 激活，手掌光标） ============ */
function enableDragSort(container, selector, axis, onDone, endBeforeEl) {
  var pressTimer = null, dragEl = null, sx = 0, sy = 0, active = false, pid = null, rafPending = false;

  function items() {
    return Array.from(container.querySelectorAll(selector)).filter(function (x) {
      return x !== dragEl && !x.classList.contains('sheet-add') && !x.classList.contains('field-mgr');
    });
  }
  function stop() {
    clearTimeout(pressTimer); pressTimer = null;
    if (active && dragEl) {
      dragEl.classList.remove('dragging');
      container.classList.remove('sorting');
      container.style.touchAction = '';
      suppressClick(container);
      onDone();
    }
    active = false; dragEl = null;
    try { container.releasePointerCapture(pid); } catch (e) {}
    pid = null;
  }
  function suppressClick(c) {
    var h = function (ev) { ev.stopPropagation(); ev.preventDefault(); c.removeEventListener('click', h, true); };
    c.addEventListener('click', h, true);
    setTimeout(function () { c.removeEventListener('click', h, true); }, 400);
  }
  container.addEventListener('pointerdown', function (e) {
    if (e.button !== 0) return;
    if (e.target.closest('button')) return;
    if (container.id === 'sb-list' && !(ME && ME.role === 'admin')) return;
    if (container.id === 'sheet-bar' && !canEditRows()) return;
    var el = e.target.closest(selector);
    if (!el || el.classList.contains('sheet-add') || el.classList.contains('field-mgr') || el.classList.contains('sheet-del')) return;
    dragEl = el; sx = e.clientX; sy = e.clientY; pid = e.pointerId; active = false;
    clearTimeout(pressTimer);
    pressTimer = setTimeout(function () {
      active = true;
      el.classList.add('dragging');
      container.classList.add('sorting');
      container.style.touchAction = 'none';
      try { container.setPointerCapture(pid); } catch (err) {}
    }, 320);
  });
  container.addEventListener('pointermove', function (e) {
    if (!dragEl || pid === null) return;
    var dx = Math.abs(e.clientX - sx), dy = Math.abs(e.clientY - sy);
    if (!active) {
      if (dx > 6 || dy > 6) { clearTimeout(pressTimer); pressTimer = null; dragEl = null; pid = null; }
      return;
    }
    e.preventDefault();
    var cx = e.clientX, cy = e.clientY;
    if (rafPending) return;
    rafPending = true;
    requestAnimationFrame(function () {
      rafPending = false;
      if (!dragEl) return;
      var list = items(), ref = null;
      for (var i = 0; i < list.length; i++) {
        var r = list[i].getBoundingClientRect();
        var mid = axis === 'y' ? r.top + r.height / 2 : r.left + r.width / 2;
        var pos = axis === 'y' ? cy : cx;
        if (pos < mid) { ref = list[i]; break; }
      }
      if (ref) container.insertBefore(dragEl, ref);
      else {
        var anchorEl = typeof endBeforeEl === 'function' ? endBeforeEl() : endBeforeEl;
        if (anchorEl) container.insertBefore(dragEl, anchorEl);
        else container.appendChild(dragEl);
      }
    });
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) {
    container.addEventListener(ev, function () { if (dragEl) stop(); });
  });
}

var ME = null, AUTH_ON = true;

async function loadMe() {
  try {
    var d = await api('/__auth/me');
    ME = d.user || null;
  } catch (e) {
    if (String(e.message).indexOf('404') !== -1) { AUTH_ON = false; }
    ME = null;
  }
  renderUserBox();
  applyRoleUI();
}
function renderUserBox() {
  var box = $('user-box');
  if (!box) return;
  if (!AUTH_ON) { box.style.display = 'none'; return; }
  box.style.display = '';
  if (!ME) {
    box.innerHTML = '<button class="top-tag" id="btn-login">登录</button>';
    $('btn-login').onclick = openLogin;
    return;
  }
  var name = ME.name || ME.username;
  box.innerHTML = '<button class="top-tag user-chip" id="btn-user">' + esc(name)
    + ' <span style="color:var(--text-3);font-size:10px">▾</span></button>'
    + '<div class="user-menu" id="user-menu">'
    + '<div data-act="pw">修改密码</div>'
    + ((ME.role === 'admin' || ME.can_users) ? '<div data-act="users">用户管理</div>' : '')
    + (ME.role === 'admin' ? '<div data-act="imgtrash">图片回收站</div>' : '')
    + '<div data-act="order" title="只恢复你自己拖出来的页签/侧栏顺序">恢复默认顺序</div>'
    + '<div class="um-sep"></div><div data-act="logout">退出登录</div></div>';
  $('btn-user').onclick = function (e) {
    e.stopPropagation();
    $('user-menu').classList.toggle('open');
  };
  $('user-menu').querySelectorAll('[data-act]').forEach(function (it) {
    it.onclick = function (e) {
      e.stopPropagation();
      $('user-menu').classList.remove('open');
      var a = it.getAttribute('data-act');
      if (a === 'users') openUserAdmin();
      else if (a === 'imgtrash') openImageTrash();
      else if (a === 'pw') openPassword();
      else if (a === 'order') resetUserOrder();
      else if (a === 'logout') doLogout();
    };
  });
}
function openLogin() {
  modal('登录',
    '<div class="frm"><label>账号</label><input id="lg-u" autocomplete="username" placeholder="用户名"></div>'
    + '<div class="frm"><label>密码</label><input id="lg-p" type="password" autocomplete="current-password" placeholder="密码"></div>'
    + '<div class="hint">账号由管理员开通；未登录无法查看任何数据。</div>',
    '<button class="btn" id="lg-ok">登录</button>',
    function () {
      $('lg-u').focus();
      async function go() {
        var u = $('lg-u').value.trim(), p = $('lg-p').value;
        if (!u || !p) { toast('请输入账号和密码'); return; }
        try {
          var d = await api('/__auth/login', 'POST', { username: u, password: p });
          ME = d.user || null;
          scopeLocalKeys();   // 换了账号，本地缓存跟着换
          closeModal(); renderUserBox();
          var npb = $('btn-new-project');
          if (npb) npb.style.display = ME ? '' : 'none';
          try { await refreshMeta(); } catch (e2) {}
          if (npb) npb.style.display = ME ? '' : 'none';
          toast('已登录：' + ((ME && (ME.name || ME.username)) || u));
        } catch (e) { toast('登录失败：' + e.message); }
      }
      $('lg-ok').onclick = go;
      $('lg-p').onkeydown = function (e) { if (e.key === 'Enter') go(); };
    });
}

/* 图片回收站（管理员）：清空单元格/删行/删列/删表后图片软删在此，可恢复或彻底删除 */
function openImageTrash() {
  if (!ME || ME.role !== 'admin') { toast('需要管理员权限'); return; }
  modal('图片回收站',
    '<div id="it-body" style="min-height:120px">加载中…</div>',
    '<button class="btn" id="it-empty">清空回收站</button><button class="btn" id="it-close">关闭</button>',
    function () {
      $('it-close').onclick = closeModal;
      function kb(n) { return n > 1024 ? (n / 1024).toFixed(0) + ' KB' : n + ' B'; }
      function load() {
        api('/api/images/trash').then(function (d) {
          var rows = d.rows || [];
          if (!rows.length) { $('it-body').innerHTML = '<div style="color:var(--text-3);font-size:var(--fs-md);padding:20px 0;text-align:center">回收站是空的</div>'; return; }
          $('it-body').innerHTML = '<table class="ua-tbl"><thead><tr><th>预览</th><th>来源表</th><th>类型</th><th>大小</th><th>删除时间</th><th style="width:130px">操作</th></tr></thead><tbody>'
            + rows.map(function (r) {
              return '<tr data-id="' + r.id + '">'
                + '<td><img src="/api/tables/' + r.table_id + '/images/' + r.id + '" style="width:44px;height:30px;object-fit:cover;border-radius:5px;background:var(--gray-50)" '
                + 'onerror="this.replaceWith(document.createTextNode(\'图片\'))"></td>'
                + '<td>' + esc(r.table_name) + '</td><td>' + esc((r.mime || '').replace('image/', '')) + '</td>'
                + '<td>' + kb(r.size) + '</td><td>' + esc(String(r.deleted_at || '').replace('T', ' ').slice(0, 16)) + '</td>'
                + '<td><button class="mini" data-restore="' + r.id + '">恢复</button>'
                + '<button class="mini danger" data-purge="' + r.id + '">彻底删除</button></td></tr>';
            }).join('') + '</tbody></table>';
          $('it-body').querySelectorAll('[data-restore]').forEach(function (b) {
            b.onclick = function () {
              api('/api/images/trash/act', 'POST', { ids: [+b.getAttribute('data-restore')], action: 'restore' })
                .then(function () { toast('已恢复'); load(); })
                .catch(function (e) { toast(e.message); });
            };
          });
          $('it-body').querySelectorAll('[data-purge]').forEach(function (b) {
            b.onclick = function () {
              appConfirm('彻底删除', '这张图片将被永久删除，不可恢复？', '删除', true).then(function (ok) {
                if (!ok) return;
                api('/api/images/trash/act', 'POST', { ids: [+b.getAttribute('data-purge')], action: 'purge' })
                  .then(function () { toast('已彻底删除'); load(); })
                  .catch(function (e) { toast(e.message); });
              });
            };
          });
        }).catch(function (e) { $('it-body').innerHTML = '加载失败：' + esc(e.message); });
      }
      load();
      $('it-empty').onclick = function () {
        appConfirm('清空回收站', '回收站里的所有图片将被永久删除，不可恢复？', '清空', true).then(function (ok) {
          if (!ok) return;
          api('/api/images/trash').then(function (d) {
            var ids = (d.rows || []).map(function (r) { return r.id; });
            if (!ids.length) { toast('回收站是空的'); return; }
            api('/api/images/trash/act', 'POST', { ids: ids, action: 'purge' })
              .then(function () { toast('回收站已清空'); load(); })
              .catch(function (e) { toast(e.message); });
          });
        });
      };
    });
}

    function roleLabel(r) { return r === 'viewer' ? '只读' : (r === 'editor' ? '可编辑' : '无'); }
    function selHtml(st, key, cur, projRole, maxRole) {
      maxRole = maxRole || 'editor';

      if (st === 'table') {

      } else {
        h += '<option value=""' + (cur === '' ? ' selected' : '') + '>无</option>';
      }
      h += '<option value="viewer"' + (cur === 'viewer' ? ' selected' : '') + '>只读</option>';
      if (maxRole === 'editor') {
        h += '<option value="editor"' + (cur === 'editor' ? ' selected' : '') + '>可编辑</option>';

    function bindSel(s) {
      s.onchange = function () {

            .then(function () { if (st === 'project') { UA_PRJ = key; paintGrants(); } })
            .catch(function (e) { toast('保存失败：' + e.message); });
        } else {
          GR[st + '|' + key] = role;
          api('/__auth/grants', 'POST', { uid: UID, scope_type: st, scope_key: key, role: role })
            .then(function () { if (st === 'project') { UA_PRJ = key; paintGrants(); } })
            .catch(function (e) { toast('保存失败：' + e.message); });
        }

    }
    function paintGrants() {
      var lim = CAT.limits || {}, pl = lim.projects || {}, tl = lim.tables || {};
      var projects = CAT.projects || [], tables = CAT.tables || [];
      // 默认选中第一个有表的项目；之后保持用户点选的项目
      if (!UA_PRJ || projects.indexOf(UA_PRJ) === -1) {
        UA_PRJ = '';
        for (var i = 0; i < projects.length; i++) {
          if (tables.some(function (t) { return (t.project || '') === projects[i]; })) {
            UA_PRJ = projects[i]; break;

      });
      $('ua-prj').innerHTML = gp || '<div class="hint">暂无项目</div>';
      $('ua-cur').textContent = UA_PRJ ? '· ' + UA_PRJ : '';
      var gt = '';
      tables.filter(function (t) { return (t.project || '') === UA_PRJ; }).forEach(function (t) {
        var projRole = GR['project|' + (t.project || '')] || '';
        var tv = GR['table|' + t.id];
        var cur = tv === 'none' ? 'none' : (tv || '');
        gt += '<div class="ua-row"><span class="n" title="' + esc(t.name) + '">' + esc(t.name) + '</span>'

      $('ua-tab').innerHTML = gt || '<div class="hint">该项目下还没有表</div>';
      $('ua-prj').querySelectorAll('.ua-row').forEach(function (row) {

      $('ua-tab').querySelectorAll('select').forEach(bindSel);

    function loadGrants(uid, name) {
      UID = uid; GR = {};
      $('ua-gname').textContent = name;
      api('/__auth/grants?uid=' + uid).then(function (g) {
        (g.grants || []).forEach(function (x) { GR[x.scope_type + '|' + x.scope_key] = x.role; });
        if (CAT) { paintGrants(); return; }
        return api('/__auth/catalog').then(function (c) { CAT = c; paintGrants(); });
      }).catch(function (e) { toast('读取授权失败：' + e.message); });
    }
    function loadUsers() {
      api('/__auth/users').then(function (d) {
        var h = '';
        (d.users || []).forEach(function (u) {
          var isSelf = ME && (ME.uid === u.id || ME.id === u.id || ME.username === u.username);
          var manage = isAdmin || u.manageable;
          function capCell(key, cls) {

                + '" data-on="' + (on ? 1 : 0) + '" title="点击' + (on ? '取消' : '下发') + '">'
                + (on ? '已授权' : '未授权') + '</button>';
            }

              + (u.role === 'admin' ? ' title="管理员默认拥有"' : '') + '>' + (on ? '已授权' : '未授权') + '</span>';
          }
          var ops = '';
          if (isAdmin) {
            if (!isSelf) {
              ops += '<button class="mini" data-act="grant" data-id="' + u.id + '" data-name="' + esc(u.username) + '">授权</button>'
                + '<button class="mini" data-act="role" data-id="' + u.id + '" data-role="' + u.role + '">'

            if (!isSelf) ops += '<button class="mini danger" data-act="del" data-id="' + u.id + '" data-name="' + esc(u.username) + '">删除</button>';
          } else if (isSelf) {

            + '<td><span class="tag ' + (u.role === 'admin' ? 'tag-blue' : 'tag-purple') + '">' + (u.role === 'admin' ? '管理员' : '可编辑') + '</span></td>'
            + '<td>' + capCell('can_fields', 'cf') + '</td><td>' + capCell('can_users', 'cu') + '</td>'
            + '<td><span class="tag ' + (u.status === 1 ? 'tag-green' : 'tag-red') + '">' + (u.status === 1 ? '启用' : '停用') + '</span></td>'
            + '<td>' + ops + '</td></tr>';

        $('ua-rows').innerHTML = h || '<tr><td colspan="8">暂无账号</td></tr>';
        var uaL = $('ua-rows').closest('.ua-left');
        if (uaL) uaL.scrollLeft = 0;
        $('ua-rows').querySelectorAll('[data-cap]').forEach(function (b) {
          b.onclick = function () {
            var key = b.getAttribute('data-cap'), id = +b.getAttribute('data-id');
            var body = {}; body[key] = +b.getAttribute('data-on') !== 1;
            api('/__auth/users/' + id, 'PATCH', body).then(function () {
              toast('已更新能力'); loadUsers();
            }).catch(function (e) { toast(e.message); });
          };
        });
        $('ua-rows').querySelectorAll('[data-act]').forEach(function (btn) {
          btn.onclick = function () {
            var act = btn.getAttribute('data-act'), id = +btn.getAttribute('data-id');
            if (act === 'grant') {
              loadGrants(id, btn.getAttribute('data-name'));
            }
            else if (act === 'role') {
              api('/__auth/users/' + id, 'PATCH', { role: btn.getAttribute('data-role') === 'admin' ? 'staff' : 'admin' })
                .then(loadUsers).catch(function (e) { toast(e.message); });
            } else if (act === 'toggle') {
              api('/__auth/users/' + id, 'PATCH', { status: +btn.getAttribute('data-status') === 1 ? 0 : 1 })
                .then(loadUsers).catch(function (e) { toast(e.message); });
            } else if (act === 'pw') {
              var un = btn.getAttribute('data-name');
              modal('重置密码 · ' + un,
                '<div class="frm"><label>新密码（至少 6 位）</label><input id="ua-pw" type="password" autocomplete="new-password"></div>',
                '<button class="btn" id="ua-pw-cancel">取消</button><button class="btn btn-primary" id="ua-pw-ok">保存</button>',
                function () {
                  $('ua-pw-cancel').onclick = closeModal;
                  var ipt = $('ua-pw'); ipt.focus();
                  function ok() {
                    var v = ipt.value || '';
                    if (v.length < 6) { toast('密码至少 6 位'); return; }
                    api('/__auth/users/' + id, 'PATCH', { password: v })
                      .then(function () { closeModal(); toast('密码已重置'); })
                      .catch(function (e) { toast(e.message); });
                  }
                  $('ua-pw-ok').onclick = ok;
                  ipt.onkeydown = function (e) {
                    if (e.key === 'Enter') ok();
                    if (e.key === 'Escape') closeModal();
                  };
                });
            } else if (act === 'del') {
              var un2 = btn.getAttribute('data-name');
              appConfirm('删除账号',
                '删除账号「<b>' + esc(un2) + '</b>」？<br><span style="color:var(--text-3)">该账号的项目/表授权会一并移除，登录立即失效。</span>',
                '删除', true).then(function (ok) {
                if (!ok) return;
                api('/__auth/users/' + id, 'DELETE').then(function () {
                  toast('已删除账号：' + un2); loadUsers();
                }).catch(function (e) { toast('删除失败：' + e.message); });
              });
            }
          };
        });
      }).catch(function (e) { toast('读取用户失败：' + e.message); });
    }
    $('ua-addbtn').onclick = function () {
      var u = $('ua-u').value.trim(), n = $('ua-n').value.trim(), p = $('ua-p').value;
      var r = isAdmin && $('ua-r') ? $('ua-r').value : 'staff';
      if (!u || p.length < 6) { toast('账号必填，密码至少 6 位'); return; }
      api('/__auth/users', 'POST', { username: u, real_name: n, password: p, role: r }).then(function () {
        toast('已添加：' + u + (isAdmin ? '' : '（点「授权」分配权限）'));
        $('ua-u').value = $('ua-n').value = $('ua-p').value = '';
        loadUsers();
      }).catch(function (e) { toast('添加失败：' + e.message); });
    };
    loadUsers();
  });
}
