/* ============ 右键菜单：行操作 / 表头列宽 ============ */
var CTX = null;
function closeCtxMenu() { if (CTX) { CTX.remove(); CTX = null; } }
function showCtxMenu(x, y, items) {
  closeCtxMenu();
  var m = document.createElement('div'); m.className = 'ctx-menu';
  m.innerHTML = items.map(function (it, i) {
    if (it.sep) return '<div class="ctx-sep"></div>';
    return '<button type="button" class="ctx-item' + (it.danger ? ' danger' : '') + '" data-i="' + i + '">'
      + '<span>' + esc(it.label) + '</span></button>';
  }).join('');
  document.body.appendChild(m);
  var r = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8)) + 'px';
  m.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
  m.querySelectorAll('[data-i]').forEach(function (b) {
    b.onclick = function (e) {
      e.stopPropagation();
      var it = items[+b.getAttribute('data-i')];
      closeCtxMenu();
      if (it && it.fn) it.fn();
    };
  });
  CTX = m;
}
async function insertRowAt(rid, where) {
  try {
    var body = { data: {} };
    body[where === 'before' ? 'before_id' : 'after_id'] = rid;
    var res = await api('/api/tables/' + state.tid + '/rows', 'POST', body);
    if (state.size > 0 && res.pos) state.page = Math.max(1, Math.ceil(res.pos / state.size));
    await refreshMeta(state.tid);
    await loadRows();
    var tr = await waitRowEl(res.id, 1200);
    if (tr) focusRowEl(res.id);
    toast(where === 'before' ? '已在上方插入一行' : '已在下方插入一行');
  } catch (e) { toast('插入失败：' + e.message); }
}
async function copyRow(rid) {
  if (!canEditRows()) return;
  var row = null;
  if (GRID) for (var i = 0; i < GRID.d.rows.length; i++) if (GRID.d.rows[i].id === rid) { row = GRID.d.rows[i]; break; }
  if (!row) { toast('这一行不在当前页'); return; }
  var data = {}, imgs = 0;
  curCols().forEach(function (c) {
    if (c.type === 'formula') return;
    if (c.type === 'image') { if (row.data[c.key]) imgs++; return; }   // 图片不复制（避免两行指向同一张图）
    if (row.data[c.key] !== undefined && row.data[c.key] !== null) data[c.key] = row.data[c.key];
  });
  try {
    var res = await api('/api/tables/' + state.tid + '/rows', 'POST', { data: data, after_id: rid });
    if (state.size > 0 && res.pos) state.page = Math.max(1, Math.ceil(res.pos / state.size));
    await refreshMeta(state.tid);
    await loadRows();
    var tr = await waitRowEl(res.id, 1200);
    if (tr) focusRowEl(res.id);
    toast('已复制这一行' + (imgs ? '（图片列不跟着复制）' : ''));
  } catch (e) { toast('复制失败：' + e.message); }
}
function autoFitCol(k) {
  var t = curTable(), c = colByKey(k); if (!t || !c) return;
  var cv = document.createElement('canvas').getContext('2d');
  var cell = document.querySelector('#tbody td[data-f]') || document.body;
  var cs = getComputedStyle(cell);
  cv.font = (cs.fontWeight || '400') + ' ' + (cs.fontSize || '13px') + ' ' + (cs.fontFamily || 'sans-serif');
  function tw(s) { return cv.measureText(String(s)).width; }
  var max = tw(c.label) + 12;
  if (GRID) GRID.d.rows.forEach(function (r) {
    var v = r.data[k], s;
    if (v === true) s = '是'; else if (v === false) s = '否';
    else if (Array.isArray(v)) s = v.join('、');
    else s = (v === null || v === undefined) ? '' : String(v);
    if (c.type === 'formula' && s) s = 'ƒ ' + s;
    var x = tw(s); if (x > max) max = x;
  });
  var width = Math.min(340, Math.max(96, Math.round(max + 24 + 38)));   // 单元格左右留白 + 表头筛选按钮
  var st = colWStore(); st[t.id + '|' + k] = width; localStorage.setItem('kb_colw', JSON.stringify(st));
  var col = $('colgroup').querySelector('col[data-c="' + CSS.escape(k) + '"]');
  if (col) col.style.width = width + 'px';
  toast('已按当前页内容把「' + c.label + '」调成 ' + width + 'px');
}
function resetColWidth(k) {
  var t = curTable(); if (!t) return;
  var st = colWStore(); delete st[t.id + '|' + k]; localStorage.setItem('kb_colw', JSON.stringify(st));
  var col = $('colgroup').querySelector('col[data-c="' + CSS.escape(k) + '"]');
  if (col) col.style.width = defW(colByKey(k)) + 'px';
}
function initCtxMenus() {
  var tb = $('tbody');
  if (tb) tb.addEventListener('contextmenu', function (e) {
    var tr = e.target.closest('tr[data-rid]'); if (!tr) return;
    e.preventDefault();
    var rid = +tr.getAttribute('data-rid'), canEdit = canEditRows();
    var items = [];
    if (canEdit) {
      items.push({ label: '上移一行', fn: function () { moveRowTo(rid, { offset: -1 }, '已上移一行'); } });
      items.push({ label: '下移一行', fn: function () { moveRowTo(rid, { offset: 1 }, '已下移一行'); } });
      items.push({ sep: true });
      items.push({ label: '在上方插入一行', fn: function () { insertRowAt(rid, 'before'); } });
      items.push({ label: '在下方插入一行', fn: function () { insertRowAt(rid, 'after'); } });
      items.push({ label: '复制这一行', fn: function () { copyRow(rid); } });
      items.push({ sep: true });
    }
    var cell = e.target.closest('td[data-f]');
    if (cell) items.push({ label: '添加 / 查看批注', fn: function () { openCellComments(rid, cell.getAttribute('data-f'), cell); } });
    items.push({ label: '打开行详情', fn: function () { toggleRowPanel(rid); } });
    if (canEdit) {
      items.push({ sep: true });
      items.push({ label: '删除这一行', danger: true, fn: function () { confirmDeleteRow(rid); } });
    }
    showCtxMenu(e.clientX, e.clientY, items);
  });
  var th = $('thead');
  if (th) th.addEventListener('contextmenu', function (e) {
    var cell = e.target.closest('th[data-c]'); if (!cell) return;
    e.preventDefault();
    var k = cell.getAttribute('data-c'), c = colByKey(k); if (!c) return;
    showCtxMenu(e.clientX, e.clientY, [
      { label: '按内容适应列宽（当前页）', fn: function () { autoFitCol(k); } },
      { label: '恢复默认列宽', fn: function () { resetColWidth(k); } },
      { sep: true },
      { label: '按此列升序', fn: function () { state.sort = k; state.dir = 1; state.page = 1; renderHead(); loadRows(); updateViewChrome(); } },
      { label: '按此列降序', fn: function () { state.sort = k; state.dir = -1; state.page = 1; renderHead(); loadRows(); updateViewChrome(); } }
    ]);
  });
  document.addEventListener('click', function (e) { if (CTX && !e.target.closest('.ctx-menu')) closeCtxMenu(); }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeCtxMenu(); });
  window.addEventListener('scroll', closeCtxMenu, true);
  window.addEventListener('resize', closeCtxMenu);
  if (tb) tb.addEventListener('scroll', closeCtxMenu, { passive: true });
}

/* ============ 拖动行调整顺序 ============
   行顺序是表数据的一部分（和表格软件一样，所有人可见）；正在按列排序时不能拖（显示顺序不由表决定）。
   拖的时候只在目标位置画一条蓝线，松手才发请求。 */
async function moveRowTo(rid, body, msg) {
  if (state.sort) { toast('正在按列排序，先点表头取消排序再调整顺序'); return; }
  try {
    var res = await api('/api/tables/' + state.tid + '/rows/' + rid + '/move', 'POST', body);
    if (state.size > 0 && res.pos) state.page = Math.max(1, Math.ceil(res.pos / state.size));
    await loadRows();
    var tr = await waitRowEl(rid, 1200);
    if (tr) focusRowEl(rid);
    toast(res.moved === false ? '位置没有变化' : (msg || ('已移动到第 ' + res.pos + ' 行（所有人可见）')));
  } catch (e) { toast('移动失败：' + e.message); }
}
function dropLineEl() {
  var el = document.getElementById('row-drop-line');
  if (!el) { el = document.createElement('div'); el.className = 'row-drop-line'; el.id = 'row-drop-line'; document.body.appendChild(el); }
  return el;
}
function hideDropLine() { var el = document.getElementById('row-drop-line'); if (el) el.style.display = 'none'; }
function rowDropTarget(y) {
  var trs = [].slice.call(document.querySelectorAll('#tbody tr[data-rid]'));
  if (!trs.length) return null;
  for (var i = 0; i < trs.length; i++) {
    var r = trs[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) return { where: 'before', tr: trs[i], y: r.top };
  }
  var last = trs[trs.length - 1], lr = last.getBoundingClientRect();
  return { where: 'after', tr: last, y: lr.bottom };
}
function initRowDrag() {
  var tb = $('tbody');
  if (!tb) return;
  var st = null;
  tb.addEventListener('pointerdown', function (e) {
    if (e.button !== 0 || e.pointerType !== 'mouse') return;   // 手机不拖：用右键菜单的上移/下移
    var td = e.target.closest('td.idx-col'); if (!td) return;
    var tr = td.closest('tr[data-rid]'); if (!tr) return;
    if (!canEditRows()) return;
    if (state.sort) { toast('正在按列排序，先点表头取消排序再拖动行'); return; }
    st = { rid: +tr.getAttribute('data-rid'), tr: tr, y: e.clientY, active: false, target: null };
  });
  tb.addEventListener('pointermove', function (e) {
    if (!st) return;
    if (!st.active) {
      if (Math.abs(e.clientY - st.y) < 6) return;
      st.active = true;
      st.tr.classList.add('row-drag');
      hideRowInsert(); closeCtxMenu();
    }
    e.preventDefault();
    var t = rowDropTarget(e.clientY);
    var line = dropLineEl();
    if (!t) { hideDropLine(); st.target = null; return; }
    st.target = t;
    var wrap = document.querySelector('.tbl-wrap').getBoundingClientRect();
    line.style.left = Math.round(wrap.left) + 'px';
    line.style.width = Math.round(wrap.width) + 'px';
    line.style.top = Math.round(t.y - 1) + 'px';
    line.style.display = 'block';
  });
  function finish(ok) {
    if (!st) return;
    var cur = st; st = null;
    hideDropLine();
    cur.tr.classList.remove('row-drag');
    if (!ok || !cur.active || !cur.target) return;
    var targetRid = +cur.target.tr.getAttribute('data-rid');
    if (cur.target.where === 'before') {
      if (targetRid !== cur.rid) moveRowTo(cur.rid, { before_id: targetRid });
    } else {
      moveRowTo(cur.rid, { after_id: targetRid });
    }
  }
  document.addEventListener('pointerup', function () { if (st) finish(true); });
  document.addEventListener('pointercancel', function () { if (st) finish(false); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && st) { finish(false); toast('已取消拖动'); }
  });
}

/* ---------- 取值、筛选与聚合 ---------- */
function anaNum(v) {
  if (typeof v === 'number') return isFinite(v) ? v : null;
  if (typeof v === 'boolean') return v ? 1 : 0;
  if (v === null || v === undefined) return null;
  var s = String(v).trim().replace(/,/g, '').replace(/，/g, '');
  if (!s) return null;
  var m = s.match(/^(-?\d+(?:\.\d+)?)\s*(亿|万|千|w|W|k|K)?%?$/);
  if (!m) return null;
  var n = parseFloat(m[1]);
  if (!isFinite(n)) return null;
  var u = m[2] || '';
  if (u === '亿') n *= 1e8;
  else if (u === '万' || u === 'w' || u === 'W') n *= 1e4;
  else if (u === '千' || u === 'k' || u === 'K') n *= 1e3;
  return n;
}
function anaTrimZero(s) {
  return String(s).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1');
}
function anaFmt(n, full) {
  if (n === null || n === undefined || typeof n !== 'number' || !isFinite(n)) return '—';
  if (full) return n.toLocaleString('zh-CN', { maximumFractionDigits: 2 });
  var sign = n < 0 ? '-' : '', a = Math.abs(n);
  if (a >= 1e8) return sign + anaTrimZero((a / 1e8).toFixed(2)) + '亿';
  if (a >= 1e4) return sign + anaTrimZero((a / 1e4).toFixed(1)) + '万';
  if (Math.abs(a - Math.round(a)) < 1e-9) return sign + Math.round(a).toLocaleString('zh-CN');
  return sign + anaTrimZero(a.toFixed(2));
}
function anaFmtChart(n, cfg) {
  if (n === null || n === undefined || typeof n !== 'number' || !isFinite(n)) return '—';
  var p = cfg && cfg.precision;
  if (p !== undefined && p !== null && isFinite(+p)) {
    return n.toLocaleString('zh-CN', { minimumFractionDigits: +p, maximumFractionDigits: +p });
  }
  return anaFmt(n, true);
}
function anaIsEmpty(v) {
  return v === null || v === undefined || v === ''
    || (Array.isArray(v) && !v.length)
    || (typeof v === 'string' && !v.trim());
}
function anaDimLabel(v) {
  return anaIsEmpty(v) ? '（空）' : String(v);
}
function anaDateBucket(v, gran) {
  var s = String(v == null ? '' : v).slice(0, 10);
  if (!/^\d{4}/.test(s)) return '（空）';
  if (gran === 'year') return s.slice(0, 4);
  if (gran === 'day') return s;
  return s.slice(0, 7);
}
function anaMatch(v, f, col) {
  var op = f.op || 'contains', a = f.value, b = f.value2;
  if (op === 'empty') return anaIsEmpty(v);
  if (op === 'notempty') return !anaIsEmpty(v);
  if (op === 'checked') return !!v;
  if (op === 'unchecked') return !v;
  var arr = Array.isArray(v) ? v : [v];
  if (col && (col.type === 'number' || col.type === 'formula')) {
    var n = anaNum(v);
    if (op === 'between') {
      var x1 = anaNum(a), x2 = anaNum(b);
      return n !== null && (x1 === null || n >= x1) && (x2 === null || n <= x2);
    }
    var x = anaNum(a);
    if (n === null || x === null) return false;
    if (op === 'gte') return n >= x;
    if (op === 'lte') return n <= x;
    if (op === 'gt') return n > x;
    if (op === 'lt') return n < x;
    if (op === 'eq') return n === x;
    if (op === 'neq') return n !== x;
    return true;
  }
  if (col && col.type === 'date') {
    var s = String(v == null ? '' : v).slice(0, 10);
    if (!s) return false;
    if (op === 'between') {
      return (!a || s >= String(a).slice(0, 10)) && (!b || s <= String(b).slice(0, 10));
    }
    if (op === 'eq') return s === String(a || '').slice(0, 10);
    if (op === 'neq') return s !== String(a || '').slice(0, 10);
    return true;
  }
  if (op === 'eq') return arr.some(function (x) { return String(x == null ? '' : x) === String(a == null ? '' : a); });
  if (op === 'neq') return arr.every(function (x) { return String(x == null ? '' : x) !== String(a == null ? '' : a); });
  if (op === 'contains') {
    var needle = String(a == null ? '' : a).toLowerCase();
    return arr.some(function (x) {
      return String(x == null ? '' : x).toLowerCase().indexOf(needle) !== -1;
    });
  }
  return true;
}
function anaMetric(rows, m, byKey) {
  if (m.agg === 'count') return rows.length;
  if (m.agg === 'distinct') {
    var set = Object.create(null);   // 单元格的值当键
    rows.forEach(function (r) {
      var v = r.data[m.field], arr = Array.isArray(v) ? v : [v];
      arr.forEach(function (x) {
        if (!anaIsEmpty(x)) set[String(x)] = 1;
      });
    });
    return Object.keys(set).length;
  }
  var ns = [];
  rows.forEach(function (r) {
    var n = anaNum(r.data[m.field]);
    if (n !== null) ns.push(n);
  });
  if (!ns.length) return null;
  if (m.agg === 'sum') return ns.reduce(function (a, b) { return a + b; }, 0);
  if (m.agg === 'avg') return ns.reduce(function (a, b) { return a + b; }, 0) / ns.length;
  if (m.agg === 'min') return Math.min.apply(null, ns);
  if (m.agg === 'max') return Math.max.apply(null, ns);
  return rows.length;
}
function anaMetricLabel(m, cols) {
  var c = m.field ? cols.find(function (x) { return x.key === m.field; }) : null;
  if (m.agg === 'count') return '记录数';
  if (!c) return '指标';
  var pre = { distinct: '去重 ', sum: '合计 ', avg: '平均 ', min: '最小 ', max: '最大 ' };
  return (pre[m.agg] || '') + c.label;
}
function anaOpsFor(col) {
  if (col.type === 'date') {
    return [['between', '日期区间'], ['eq', '等于'], ['empty', '为空'], ['notempty', '不为空']];
  }
  if (col.type === 'number' || col.type === 'formula') {
    return [['between', '区间'], ['gte', '≥'], ['lte', '≤'], ['eq', '='], ['neq', '≠'],
            ['empty', '为空'], ['notempty', '不为空']];
  }
  if (col.type === 'checkbox') return [['checked', '已勾选'], ['unchecked', '未勾选']];
  if (col.type === 'select' || col.type === 'multiselect') {
    return [['eq', '等于'], ['neq', '不等于'], ['empty', '为空'], ['notempty', '不为空']];
  }
  return [['contains', '包含'], ['eq', '等于'], ['neq', '不等于'], ['empty', '为空'], ['notempty', '不为空']];
}
function anaAgg(rows, cfg) {
  var cols = anaCols(cfg.table_id);
  var byKey = Object.create(null);   // 列名当键，同上
  cols.forEach(function (c) { byKey[c.key] = c; });
  var metrics = ((cfg.metrics && cfg.metrics.length) ? cfg.metrics : [{ agg: 'count', field: '' }])
    .map(function (m) {
      return { agg: m.agg || 'count', field: m.field || '', label: anaMetricLabel(m, cols) };
    });
  var fs = (cfg.filters || []).filter(function (f) { return f && f.field && byKey[f.field]; });
  var data = rows.filter(function (r) {
    return fs.every(function (f) { return anaMatch(r.data[f.field], f, byKey[f.field]); });
  });
  var dimCol = cfg.dimension ? byKey[cfg.dimension] : null;
  var map = Object.create(null), order = [];   // 分组的值来自单元格内容，什么都可能是键
  data.forEach(function (r) {
    var keys;
    if (!dimCol) {
      keys = ['全部'];
    } else {
      var v = r.data[dimCol.key];
      if (dimCol.type === 'date') keys = [anaDateBucket(v, cfg.date_gran)];
      else if (Array.isArray(v)) keys = v.length ? v.map(function (x) { return String(x); }) : ['（空）'];
      else keys = [anaDimLabel(v)];
    }
    var seen = Object.create(null);
    keys.forEach(function (k) {
      if (seen[k]) return;
      seen[k] = 1;
      if (!map[k]) { map[k] = { label: k, rows: [] }; order.push(k); }
      map[k].rows.push(r);
    });
  });
  var out = order.map(function (k) {
    var g = map[k];
    return {
      label: k,
      values: metrics.map(function (m) { return anaMetric(g.rows, m, byKey); }),
      n: g.rows.length
    };
  });
  if (!dimCol && !out.length) {
    out = [{ label: '全部', values: metrics.map(function (m) { return anaMetric([], m, byKey); }), n: 0 }];
  }
  var sort = cfg.sort || (cfg.type === 'line' ? 'dim_asc' : 'metric_desc');
  if (cfg.type === 'line' && sort !== 'dim_desc') sort = 'dim_asc';
  if (sort === 'dim_asc' || sort === 'dim_desc') {
    out.sort(function (a, b) {
      var c = String(a.label).localeCompare(String(b.label), 'zh-CN');
      return sort === 'dim_asc' ? c : -c;
    });
  } else {
    out.sort(function (a, b) {
      var av = a.values[0], bv = b.values[0];
      if (av === null || av === undefined) av = sort === 'metric_asc' ? Infinity : -Infinity;
      if (bv === null || bv === undefined) bv = sort === 'metric_asc' ? Infinity : -Infinity;
      return sort === 'metric_asc' ? av - bv : bv - av;
    });
  }
  var lim = parseInt(cfg.limit, 10);
  if (isNaN(lim)) lim = cfg.type === 'line' ? 0 : 10;
  if (lim > 0 && out.length > lim) out = out.slice(0, lim);
  return { groups: out, metrics: metrics, total: data.length, dimCol: dimCol };
}

/* ---------- SVG 图表 ---------- */
function anaCut(s, n) {
  s = String(s == null ? '' : s);
  return s.length > n ? s.slice(0, n) + '…' : s;
}
function anaMaxOf(groups) {
  var max = 0;
  groups.forEach(function (g) {
    g.values.forEach(function (v) {
      if (typeof v === 'number' && isFinite(v) && v > max) max = v;
    });
  });
  return max > 0 ? max : 1;
}
function anaScale(max) {
  max = max > 0 ? max : 1;
  var raw = max / 5;
  var p = Math.pow(10, Math.floor(Math.log10(raw)));
  var n = raw / p;
  var mult = n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10;
  var step = mult * p;
  var top = step * 5;
  if (top < max) top = Math.ceil(max / step) * step;
  return { top: top, step: step };
}
function anaChartLegend(metrics) {
  if (metrics.length <= 1) return '';
  return '<div class="ana-legend">' + metrics.map(function (m, i) {
    return '<span><i style="background:' + ANA_COLORS[i % ANA_COLORS.length] + '"></i>'
      + esc(m.label) + '</span>';
  }).join('') + '</div>';
}
function anaTipAttr(text) {
  return esc(text);
}
function anaBarChart(groups, metrics, horizontal) {
  if (horizontal) return anaHBarChart(groups, metrics);
  var W = 640, H = 258, ml = 50, mr = 14, mt = 12, mb = 58;
  var scale = anaScale(anaMaxOf(groups)), top = scale.top;
  var pw = W - ml - mr, ph = H - mt - mb;

function anaLineChart(groups, metrics) {

    s += '<text x="' + (ml - 8) + '" y="' + (gy + 4).toFixed(1) + '" text-anchor="end" font-size="10" fill="#86909C">' + esc(anaFmt(scale.step * i)) + '</text>';

    }
    pts.forEach(function (p) {
      s += '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.2" fill="#fff" stroke="' + color + '" stroke-width="2" data-tip="' + anaTipAttr(p.label + ' · ' + met.label + ': ' + anaFmt(p.v, true)) + '"/>';
    });

function anaPieChart(groups, metrics, cfg) {
  var items = groups.map(function (g) { return { label: g.label, v: g.values[0] }; })
    .filter(function (x) { return typeof x.v === 'number' && isFinite(x.v) && x.v > 0; });
  if (!items.length) return '<div class="ana-empty"><div class="ana-empty-t">没有可展示的数值</div></div>';
  var W = 640, H = 250, cx = 320, cy = 125, r1 = 92, r2 = 56;
  var total = items.reduce(function (a, b) { return a + b.v; }, 0);
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="height:' + H + 'px" aria-hidden="true">';
  function pt(r, a) { return (cx + r * Math.cos(a)).toFixed(2) + ' ' + (cy + r * Math.sin(a)).toFixed(2); }
  if (items.length === 1) {
    s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((r1 + r2) / 2) + '" fill="none" stroke="' + ANA_COLORS[0] + '" stroke-width="' + (r1 - r2) + '" data-tip="' + anaTipAttr(items[0].label + ': ' + anaFmt(items[0].v, true)) + '"/>';
  } else {
    var a0 = -Math.PI / 2;

      var d = 'M' + pt(r1, a0) + ' A' + r1 + ' ' + r1 + ' 0 ' + large + ' 1 ' + pt(r1, a1)
        + ' L' + pt(r2, a1) + ' A' + r2 + ' ' + r2 + ' 0 ' + large + ' 0 ' + pt(r2, a0) + ' Z';
      s += '<path d="' + d + '" fill="' + ANA_COLORS[i % ANA_COLORS.length] + '" data-tip="' + anaTipAttr(it.label + ': ' + anaFmt(it.v, true) + ' · ' + Math.round(it.v / total * 100) + '%') + '"/>';
      a0 = a1;

  }
  s += '</svg>';
  var legend = '<div class="ana-legend ana-legend-col">' + items.map(function (it, i) {
    var pct = total ? Math.round(it.v / total * 1000) / 10 : 0;
    return '<span title="' + esc(it.label) + '"><i style="background:' + ANA_COLORS[i % ANA_COLORS.length] + '"></i>'
      + esc(anaCut(it.label, 12)) + ' ' + esc(anaFmtChart(it.v, cfg)) + ' (' + pct + '%)</span>';
  }).join('') + '</div>';

function anaRenderChart(el, cfg, rows) {

  var type = cfg.type || 'bar';

function anaDimCols(tid) {
  return anaCols(tid).filter(function (c) {
    return ['text', 'select', 'multiselect', 'date', 'number', 'checkbox'].indexOf(c.type) !== -1;
  });
}
function anaDefaultDim(tid) {

    || cols.find(function (x) { return x.type === 'text'; })
    || cols[0] || null;
  return c ? c.key : null;
}
function anaDefaultChart() {
  var ts = anaTables();
  var t = ts[0];
  if (!t) return null;
  return {
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
    type: 'bar', table_id: t.id, dimension: anaDefaultDim(t.id), date_gran: 'month',

function anaFieldOptions(cols, selected, allowEmpty) {
  var html = allowEmpty ? '<option value="">（空）</option>' : '';
  html += cols.map(function (c) {
    return '<option value="' + esc(c.key) + '"' + (c.key === selected ? ' selected' : '') + '>'
      + esc(c.label) + '</option>';
  }).join('');
  return html;
}

function anaFilterValueHtml(f, col) {
  if (['empty', 'notempty', 'checked', 'unchecked'].indexOf(f.op) !== -1) return '<div></div>';
  if (col.type === 'select' || col.type === 'multiselect') {
    var opts = (col.options || []).map(function (x) { return String(x); });
    if (f.value === undefined || f.value === null) f.value = opts[0] || '';
    return '<select data-f="value">' + opts.map(function (x) {
      return '<option value="' + esc(x) + '"' + (String(f.value) === x ? ' selected' : '') + '>' + esc(x) + '</option>';
    }).join('') + '</select>';
  }
  if (col.type === 'date') {
    if (f.op === 'between') {
      return '<div class="ana-filter-val2"><input class="date-compact" readonly data-f="value" placeholder="开始" value="' + esc(f.value || '') + '">'
        + '<input class="date-compact" readonly data-f="value2" placeholder="结束" value="' + esc(f.value2 || '') + '"></div>';
    }
    return '<input class="date-compact" readonly data-f="value" placeholder="选择日期" value="' + esc(f.value || '') + '">';
  }
  if (col.type === 'number' || col.type === 'formula') {

            + '<div class="ana-filter-val">' + anaFilterValueHtml(f, col) + '</div>'
            + '<button class="ana-metric-del" type="button" data-fdel="' + i + '" title="删除筛选">'
            + '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>';
        }).join('');
        wrap.querySelectorAll('[data-ffield]').forEach(function (sel) {
          sel.onchange = function () {
            var i = +sel.getAttribute('data-ffield');
            st.filters[i] = { field: sel.value, op: '', value: '', value2: '' };
            rerenderFilters(); schedulePreview();
          };
        });
        wrap.querySelectorAll('[data-fop]').forEach(function (sel) {
          sel.onchange = function () {
            var i = +sel.getAttribute('data-fop');
            st.filters[i].op = sel.value;
            st.filters[i].value = ''; st.filters[i].value2 = '';
            rerenderFilters(); schedulePreview();
          };
        });
        wrap.querySelectorAll('[data-fdel]').forEach(function (btn) {
          btn.onclick = function () {
            st.filters.splice(+btn.getAttribute('data-fdel'), 1);
            rerenderFilters(); schedulePreview();
          };
        });
        wrap.querySelectorAll('[data-f="value"],[data-f="value2"]').forEach(function (inp) {
          inp.oninput = inp.onchange = function () {
            var row = inp.closest('.ana-filter-row');
            var fsel = row.querySelector('[data-ffield]');
            var i = +fsel.getAttribute('data-ffield');
            st.filters[i][inp.getAttribute('data-f')] = inp.value;
            schedulePreview();
          };
          if (inp.classList.contains('date-compact')) inp.onclick = function () { openDatePicker(inp); };
        });
      }

      var previewTimer = null;
      function schedulePreview() {
        var ti = $('ac-title');
        if (ti && !ti.value) ti.placeholder = anaAutoTitle(st);
        clearTimeout(previewTimer);
        previewTimer = setTimeout(renderPreview, 120);
      }
      function renderPreview() {
        var el = $('ac-preview');
        if (!el) return;
        var t = anaTable(st.table_id);
        if (!t) { anaEmpty(el, '请选择数据表'); return; }
        el.innerHTML = '<div class="ana-skel">计算中…</div>';
        var token = ++ANA.previewToken;
        anaGetRows(t.id).then(function (rows) {
          if (token !== ANA.previewToken || !$('ac-preview')) return;
          $('ac-src').textContent = t.name + ' · ' + rows.length + ' 行';
          anaRenderChart($('ac-preview'), st, rows);
        }).catch(function (e) {
          if (token === ANA.previewToken) anaEmpty($('ac-preview'), '读取失败', e.message);
        });
      }

      $('ac-title').oninput = function () { st.title = this.value; };
      $('ac-type').onchange = function () {
        st.type = this.value;
        if (st.type === 'kpi') { st.limit = 1; }
        else if (st.type === 'line') {
          if (st.limit === 10) st.limit = 0;
          if (st.sort === 'metric_desc' || st.sort === 'metric_asc') st.sort = 'dim_asc';
        } else if (st.limit === 1) { st.limit = 10; }
        $('ac-limit').value = st.limit;
        $('ac-sort').value = st.sort;
        rerenderDims(); schedulePreview();
      };
      $('ac-table').onchange = function () {
        st.table_id = +this.value;
        st.dimension = anaDefaultDim(st.table_id);
        st.metrics = [{ agg: 'count', field: '' }];
        st.filters = [];
        st.title = '';
        $('ac-title').value = '';
        $('ac-title').placeholder = anaAutoTitle(st);
        rerenderDims(); rerenderMetrics(); rerenderFilters(); schedulePreview();
      };
      $('ac-dim').onchange = function () {
        st.dimension = this.value || null;
        rerenderDims(); schedulePreview();
      };
      $('ac-gran').onchange = function () { st.date_gran = this.value; schedulePreview(); };
      $('ac-sort').onchange = function () { st.sort = this.value; schedulePreview(); };
      $('ac-limit').oninput = function () {
        var v = parseInt(this.value, 10);
        st.limit = isNaN(v) ? 10 : Math.max(0, Math.min(200, v));
        schedulePreview();
      };
      $('ac-add-metric').onclick = function () {
        if (st.metrics.length >= 4) { toast('最多 4 个指标'); return; }
        st.metrics.push({ agg: 'count', field: '' });
        rerenderMetrics(); schedulePreview();
      };
      $('ac-add-filter').onclick = function () {
        if (st.filters.length >= 8) { toast('最多 8 个筛选'); return; }
        st.filters.push({ field: anaCols(st.table_id)[0] ? anaCols(st.table_id)[0].key : '', op: '', value: '', value2: '' });
        rerenderFilters(); schedulePreview();
      };
      $('ac-sort').value = st.sort || 'metric_desc';
      rerenderDims(); rerenderMetrics(); rerenderFilters();
      renderPreview();
    });

  function saveChart() {
    if (!st.table_id) { toast('请选择数据表'); return; }
    if (st.type !== 'kpi' && !st.dimension) { toast('请选择维度'); return; }
    if (!st.metrics.length) { toast('请添加指标'); return; }
    for (var i = 0; i < st.metrics.length; i++) {
      var m = st.metrics[i];
      if (m.agg !== 'count' && !m.field) { toast('请选择指标字段'); return; }
    }
    var out = JSON.parse(JSON.stringify(st));
    out.title = ($('ac-title').value || '').trim() || anaAutoTitle(out);
    out.limit = Math.max(0, Math.min(200, parseInt(out.limit, 10) || 0));
    var cur = anaCurrentDash();
    var list = ((cur.config && cur.config.charts) || []).slice();
    if (editing) list[idx] = out; else list.push(out);
    anaSaveCharts(list).then(function () {
      closeModal(); renderAnaDash(); toast('图表已保存');
    }).catch(function (e) { toast('保存失败：' + e.message); });
  }
}

async function anaSaveCharts(charts) {
  var d = await api('/api/dashboards/' + ANA.currentId, 'PATCH', { config: { charts: charts } });
  var dash = anaCurrentDash();
  if (dash && d && d.dashboard) dash.config = d.dashboard.config;
  return d;
}

function saveAnalysisPage() {
  if (!ANA.canEdit) return;

async function anaSavePage(dash, name) {
  var d;
  try {
    d = await api('/api/dashboards/' + dash.id, 'PATCH',
      { name: name, is_page: true, config: dash.config });
  } catch (e) {
    toast('保存失败：' + e.message);
    return;
  }
  dash.name = d.dashboard.name;
  dash.is_page = true;
  dash.config = d.dashboard.config;
  closeModal();
  toast('已保存到「' + dash.name + '」');
  try { await refreshMeta(); } catch (e2) {}
  if (!(META.analysis_pages || []).some(function (p) { return p.id === dash.id; })) {
    META.analysis_pages = (META.analysis_pages || []).concat([{
      id: dash.id, project: dash.project, name: dash.name, sort: dash.sort || 0
    }]);
  }
  renderAnaChrome(); renderAnaDash(); renderSidebar();
}

document.addEventListener('mousemove', function (e) {
  var tip = $('ana-tip');
  if (!tip) return;
  var t = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
  if (!t) { tip.classList.remove('on'); return; }
  tip.textContent = t.getAttribute('data-tip');
  tip.classList.add('on');
  var x = e.clientX + 12, y = e.clientY + 14;
  var w = tip.offsetWidth, h = tip.offsetHeight;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - 12;
  if (y + h > window.innerHeight - 8) y = e.clientY - h - 14;
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
});
document.addEventListener('mouseleave', function () {
  var tip = $('ana-tip');
  if (tip) tip.classList.remove('on');
});

/* ==================== Excel / CSV 导入 ==================== */
var IMP = null;

function impVal(v) {
  if (v === null || v === undefined) return '';
  if (v === true) return '是';
  if (v === false) return '否';
  if (Array.isArray(v)) return v.join('、');
  return String(v);
}

function impTypeLabel(t) { return TYPE_LABEL[t] || t; }

function impFileStem() {
  return (IMP && IMP.filename ? IMP.filename : '导入表').replace(/\.[^.]+$/, '');
}

function impInitMapping() {
  var cols = anaCols(state.tid).filter(function (c) {
    return c.type !== 'formula' && c.type !== 'image';
  });
  var byLabel = Object.create(null);   // Excel 表头是什么都可能
  cols.forEach(function (c) { byLabel[c.label] = c.key; });
  IMP.mapping = IMP.preview.headers.map(function (h) {
    return byLabel[h.name] || (IMP.autoNew ? '__new__' : '');
  });
}

function impInitNew() {
  var stem = impFileStem();
  var sh = IMP.preview.sheet;
  IMP.name = (sh && sh !== 'CSV') ? stem + '·' + sh : stem;
  IMP.group = stem;
  IMP.columns = IMP.preview.headers.map(function (h) {
    var t = h.inferred_type === 'image' ? 'text' : h.inferred_type;
    return { label: h.name, type: t || 'text', include: true, options: h.options || null };
  });
}

function impPreviewHtml() {
  var hs = IMP.preview.headers || [], rs = IMP.preview.rows || [];
  return '<div class="imp-preview"><table><thead><tr><th>#</th>'
    + hs.map(function (h) { return '<th title="' + esc(h.name) + '">' + esc(h.name) + '</th>'; }).join('')
    + '</tr></thead><tbody>'
    + rs.map(function (r, i) {
      return '<tr><td>' + (i + 1) + '</td>'
        + r.map(function (v) { return '<td title="' + esc(impVal(v)) + '">' + esc(impVal(v)) + '</td>'; }).join('')
        + '</tr>';
    }).join('')
    + '</tbody></table></div>';
}

function impCanNewFields() { return !!(ME && (ME.role === 'admin' || ME.can_fields)); }

function impMapHtml() {
  if (!IMP.mapping || IMP.mapping.length !== IMP.preview.headers.length) impInitMapping();
  var canNew = impCanNewFields();
  if (!canNew) {
    // 没有字段管理权限的人不能靠导入“自动新建字段”（那等于改表结构）：不显示这个选项
    IMP.autoNew = false;
    IMP.mapping = IMP.mapping.map(function (m) { return m === '__new__' ? '' : m; });
  }
  var cols = anaCols(state.tid).filter(function (c) {
    return c.type !== 'formula' && c.type !== 'image';
  });
  var rows = IMP.preview.headers.map(function (h, i) {
    var opts = '<option value="">忽略</option>'
      + (canNew ? '<option value="__new__"' + (IMP.mapping[i] === '__new__' ? ' selected' : '') + '>新建字段</option>' : '')
      + cols.map(function (c) {
        return '<option value="' + esc(c.key) + '"' + (IMP.mapping[i] === c.key ? ' selected' : '') + '>'
          + esc(c.label) + '（' + esc(impTypeLabel(c.type)) + '）</option>';
      }).join('');
    return '<div class="imp-map-row"><div class="imp-src" title="' + esc(h.name) + '">'
      + esc(h.name) + '<em>' + esc(impTypeLabel(h.inferred_type)) + '</em></div>'
      + '<div class="imp-sample" title="' + esc((h.sample || []).join(' / ')) + '">'
      + esc((h.sample || []).slice(0, 2).join(' / ') || '—') + '</div>'
      + '<select data-map="' + i + '">' + opts + '</select></div>';
  }).join('');
  return '<div class="imp-map"><div class="imp-map-head"><span>Excel 列</span><span>示例</span><span>导入到</span></div>'
    + rows + '</div>'
    + (canNew ? '<label class="imp-auto"><input type="checkbox" id="imp-auto"' + (IMP.autoNew ? ' checked' : '')
    + '> 未匹配的列自动新建字段</label>' : '')
    + (IMP.target === 'replace'
      ? '<div class="imp-warn">覆盖会先清空当前表的现有行；导入过程中出错会回滚。</div>' : '');
}

function impNewHtml() {
  if (!IMP.columns || IMP.columns.length !== IMP.preview.headers.length) impInitNew();
  if (!IMP.name) IMP.name = impFileStem();
  var types = ['text', 'number', 'date', 'select', 'multiselect', 'checkbox'];
  var rows = IMP.preview.headers.map(function (h, i) {
    var c = IMP.columns[i];
    return '<tr><td><input type="checkbox" data-inc="' + i + '"' + (c.include ? ' checked' : '') + '></td>'
      + '<td><input type="text" data-label="' + i + '" value="' + esc(c.label) + '"></td>'
      + '<td><select data-type="' + i + '">' + types.map(function (t) {
        return '<option value="' + t + '"' + (c.type === t ? ' selected' : '') + '>' + impTypeLabel(t) + '</option>';
      }).join('') + '</select></td>'
      + '<td class="imp-sample" title="' + esc((h.sample || []).join(' / ')) + '">'
      + esc((h.sample || []).slice(0, 2).join(' / ') || '—') + '</td></tr>';
  }).join('');
  return '<div class="frm row2"><div><label>新表名</label><input id="imp-name" value="' + esc(IMP.name) + '"></div>'
    + '<div><label>组名（侧栏分组）</label><input id="imp-group" value="' + esc(IMP.group) + '"></div></div>'
    + '<div class="imp-cols-title">导入列（可改类型，取消勾选则不导入）</div>'
    + '<div class="imp-cols"><table><thead><tr><th></th><th>列名</th><th>类型</th><th>示例</th></tr></thead><tbody>'
    + rows + '</tbody></table></div>';
}

function renderImport() {
  if (!IMP) return;
  var body = '', foot = '', title = IMP.step === 1 ? '导入 Excel' : '导入 Excel · 映射';
  if (IMP.loading) {
    body = '<div class="imp-loading">正在处理文件…</div>';
    foot = '<button class="btn" id="imp-cancel">取消</button>';
  } else if (IMP.step === 1) {
    body = '<div class="imp-top"><div class="frm imp-file"><label>Excel / CSV 文件</label>'
      + '<input type="file" id="imp-file" class="imp-file-native" accept=".xlsx,.xls,.xlsm,.csv">'
      + '<label class="imp-pick" for="imp-file">选择文件</label>'
      + '<div class="imp-file-name" id="imp-file-name">' + esc(IMP.filename || '未选择文件') + '</div></div>'
      + '<div class="frm imp-head"><label>表头行</label><input type="number" id="imp-header" min="1" value="'
      + (IMP.headerRow || 1) + '"></div></div>';
    foot = '<button class="btn" id="imp-cancel">取消</button><button class="btn btn-primary" id="imp-next">下一步</button>';
  } else {
    var p = IMP.preview;
    body = '<div class="imp-summary"><span>文件 <b>' + esc(p.filename) + '</b></span>'
      + '<span>工作表 <select id="imp-sheet">' + p.sheets.map(function (s) {
        return '<option value="' + esc(s) + '"' + (s === IMP.sheet ? ' selected' : '') + '>' + esc(s) + '</option>';
      }).join('') + '</select></span>'
      + '<span>表头行 <input type="number" id="imp-header2" min="1" value="' + (IMP.headerRow || 1) + '"></span>'
      + '<button class="imp-reload" id="imp-reload">重新读取</button>'
      + '<span style="margin-left:auto">共 <b>' + p.total_rows + '</b> 行 × <b>' + p.total_cols + '</b> 列</span></div>'
      + (IMP.projectImport ? '' :
        '<div class="frm"><label>导入方式</label><div class="imp-target">'
        + '<label><input type="radio" name="imp-target" value="append"' + (IMP.target === 'append' ? ' checked' : '') + '>追加到当前表</label>'
        + '<label><input type="radio" name="imp-target" value="replace"' + (IMP.target === 'replace' ? ' checked' : '') + '>覆盖当前表</label>'
        + '<label><input type="radio" name="imp-target" value="new"' + (IMP.target === 'new' ? ' checked' : '') + '>新建一张表</label>'
        + '</div></div>')
      + (IMP.target === 'new' ? impNewHtml() : impMapHtml())
      + '<div class="imp-preview-title">数据预览（前 8 行）</div>' + impPreviewHtml();
    foot = '<button class="btn" id="imp-back">上一步</button><button class="btn btn-primary" id="imp-start">开始导入</button>';
  }
  modal(title, body, foot, function (root) {
    root.querySelector('.box').classList.add('imp-box');
    if (IMP.step === 1) root.querySelector('.box').classList.add('imp-step1');
    var cancel = $('imp-cancel'); if (cancel) cancel.onclick = function () { IMP = null; closeModal(); };
    if (IMP.loading) return;
    if (IMP.step === 1) {
      $('imp-file').onchange = function () {
        if (!this.files || !this.files[0]) return;
        IMP.file = this.files[0];
        IMP.filename = this.files[0].name;
        $('imp-file-name').textContent = IMP.filename;
      };
      $('imp-next').onclick = function () {
        var f = IMP.file || ($('imp-file').files && $('imp-file').files[0]);
        if (!f) { toast('请选择文件'); return; }
        IMP.file = f;
        IMP.filename = f.name;
        IMP.headerRow = Math.max(1, parseInt($('imp-header').value, 10) || 1);
        impParse(f, '', IMP.headerRow);
      };
      return;
    }
    $('imp-sheet').onchange = function () {
      IMP.sheet = this.value; IMP.mapping = null; IMP.columns = null;
      impParse(IMP.file, IMP.sheet, IMP.headerRow);
    };
    $('imp-reload').onclick = function () {
      IMP.sheet = $('imp-sheet').value;
      IMP.headerRow = Math.max(1, parseInt($('imp-header2').value, 10) || 1);
      IMP.mapping = null; IMP.columns = null;
      impParse(IMP.file, IMP.sheet, IMP.headerRow);
    };
    root.querySelectorAll('input[name="imp-target"]').forEach(function (r) {
      r.onchange = function () { if (r.checked) { IMP.target = r.value; renderImport(); } };
    });
    if (IMP.target === 'new') {
      $('imp-name').oninput = function () { IMP.name = this.value; };
      $('imp-group').oninput = function () { IMP.group = this.value; };
      root.querySelectorAll('[data-inc]').forEach(function (cb) {
        cb.onchange = function () { IMP.columns[+cb.getAttribute('data-inc')].include = cb.checked; };
      });
      root.querySelectorAll('[data-label]').forEach(function (inp) {
        inp.oninput = function () { IMP.columns[+inp.getAttribute('data-label')].label = inp.value; };
      });
      root.querySelectorAll('[data-type]').forEach(function (sel) {
        sel.onchange = function () { IMP.columns[+sel.getAttribute('data-type')].type = sel.value; };
      });
    } else {
      root.querySelectorAll('[data-map]').forEach(function (sel) {
        sel.onchange = function () { IMP.mapping[+sel.getAttribute('data-map')] = sel.value; };
      });
      var auto = $('imp-auto');
      if (auto) auto.onchange = function () {
        IMP.autoNew = auto.checked;
        root.querySelectorAll('[data-map]').forEach(function (sel) {
          var i = +sel.getAttribute('data-map');
          if (IMP.mapping[i] === '' || IMP.mapping[i] === '__new__') {
            IMP.mapping[i] = IMP.autoNew ? '__new__' : '';
            sel.value = IMP.mapping[i];
          }
        });
      };
    }
    $('imp-back').onclick = function () { IMP.step = 1; IMP.mapping = null; IMP.columns = null; renderImport(); };
    $('imp-start').onclick = impStart;
  });
}

async function impParse(file, sheet, headerRow) {
  var own = IMP;
  IMP.loading = true; renderImport();
  var fd = new FormData();
  fd.append('file', file);
  fd.append('sheet', sheet || '');
  fd.append('header_row', String(headerRow || 1));
  // 预览也带上导入目标：服务端据此校验权限（解析 Excel 是重活，不能只凭“已登录”就调用）
  if (IMP.projectImport || !state.tid) fd.append('project', (curProject && curProject.name) || '');
  else fd.append('table_id', String(state.tid));
  try {
    var d = await apiForm('/api/import/preview', fd);
    if (IMP !== own) return;
    IMP.preview = d;
    IMP.step = 2;
    IMP.sheet = d.sheet;
    IMP.headerRow = d.header_row;
    IMP.mapping = null;
    IMP.columns = null;
    IMP.loading = false;
    renderImport();
  } catch (e) {
    if (IMP !== own) return;
    IMP.loading = false;
    IMP.step = 1;
    renderImport();
    toast('读取失败：' + e.message);
  }
}

async function impStart() {
  if (!IMP || !IMP.preview) return;
  var cfg;
  if (IMP.target === 'new') {
    if (!IMP.name || !IMP.name.trim()) { toast('请填新表名'); return; }
    if (!IMP.columns.some(function (c) { return c.include; })) { toast('至少保留一列'); return; }
    cfg = {
      target: 'new', project: (curProject && curProject.name) || '',
      name: IMP.name.trim(), group_name: (IMP.group || '').trim(),
      sheet: IMP.sheet, header_row: IMP.headerRow,
      columns: IMP.columns.map(function (c, i) {
        return { source: i, label: c.label, type: c.type, include: c.include, options: c.options };
      })
    };
  } else {
    if (!IMP.mapping.some(Boolean)) { toast('至少映射一个字段'); return; }
    var mode = IMP.target === 'replace' ? 'replace' : 'append';
    if (mode === 'replace') {
      var t = anaTable(state.tid);
      var ok = await appConfirm('覆盖当前表',
        '覆盖会先清空「<b>' + esc(t ? t.name : '当前表') + '</b>」的现有行，确定导入？',
        '覆盖导入', true);
      if (!ok) return;
    }
    cfg = {
      target: 'table', table_id: state.tid, sheet: IMP.sheet,
      header_row: IMP.headerRow, mode: mode, mapping: IMP.mapping
    };
  }
  var own = IMP;
  IMP.loading = true; renderImport();
  var fd = new FormData();
  fd.append('file', IMP.file);
  fd.append('config', JSON.stringify(cfg));
  try {
    var res = await apiForm('/api/import/commit', fd);
    if (IMP !== own) return;
    IMP.loading = false;
    closeModal();
    IMP = null;
    toast('导入成功：' + res.inserted + ' 行');
    try { await refreshMeta(); } catch (e2) {}
    if (res.table_id) openSheet(res.table_id);
    else if ($('table-view').classList.contains('on')) loadRows();
  } catch (e) {
    if (IMP !== own) return;
    IMP.loading = false;
    renderImport();
    toast('导入失败：' + e.message);
  }
}

$('btn-import').onclick = function () { openImport(false); };

function openImport(startNew) {
  if (!ME) { openLogin(); return; }
  if (!startNew && !state.tid) { toast('请先打开一张表'); return; }
  IMP = {
    step: 1, file: null, filename: '', preview: null, sheet: '', headerRow: 1,
    target: startNew ? 'new' : 'append', projectImport: !!startNew,
    autoNew: true, mapping: null, columns: null, name: '', group: ''
  };
  renderImport();
}

/* ---------- 自定义下拉：替换所有原生 select ---------- */
var CS_OPEN = null;

function enhanceSelects(root) {
  var scope = root || document;
  if (scope.tagName === 'SELECT') { enhanceSelect(scope); return; }
  scope.querySelectorAll('select').forEach(function (sel) {
    if (!sel.__cs && !sel.closest('.cs-menu')) enhanceSelect(sel);
  });
}

function enhanceSelect(sel) {
  /* data-native：这一格要原生下拉（高级筛选的紧凑条件行，自己画的下拉放不进网格） */
  if (!sel || sel.__cs || sel.multiple || sel.hasAttribute('data-native')) return;
  sel.__cs = true;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'cs-select' + (sel.className ? ' ' + sel.className : '');
  btn.innerHTML = '<span class="cs-val"></span>'
    + '<svg class="cs-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  btn.setAttribute('role', 'combobox');
  btn.setAttribute('aria-haspopup', 'listbox');
  btn.setAttribute('aria-expanded', 'false');
  if (sel.id) btn.setAttribute('data-cs-id', sel.id);
  if (sel.title) btn.title = sel.title;
  if (sel.getAttribute('aria-label')) btn.setAttribute('aria-label', sel.getAttribute('aria-label'));
  sel.parentNode.insertBefore(btn, sel.nextSibling);
  sel.classList.add('cs-native');
  sel.setAttribute('tabindex', '-1');
  sel.__csBtn = btn;

  btn.onclick = function (e) {
    e.stopPropagation();
    if (sel.disabled) return;
    openCsMenu(sel);
  };
  btn.onkeydown = function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      openCsMenu(sel, e.key === 'ArrowUp' ? -1 : 1);
    }
  };

  try {
    var vd = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'value');
    Object.defineProperty(sel, 'value', {
      configurable: true,
      get: function () { return vd.get.call(sel); },
      set: function (v) { vd.set.call(sel, v); csSync(sel); }
    });
    var sd = Object.getOwnPropertyDescriptor(HTMLSelectElement.prototype, 'selectedIndex');
    if (sd) Object.defineProperty(sel, 'selectedIndex', {
      configurable: true,
      get: function () { return sd.get.call(sel); },
      set: function (v) { sd.set.call(sel, v); csSync(sel); }
    });
  } catch (e) {}

  var mo = new MutationObserver(function () { csSync(sel); });
  mo.observe(sel, { childList: true, subtree: true, attributes: true, attributeFilter: ['disabled', 'style', 'class'] });
  sel.__csMo = mo;
  csSync(sel);
}

function csSync(sel) {
  var btn = sel.__csBtn;
  if (!btn) return;
  var opt = sel.selectedIndex >= 0 ? sel.options[sel.selectedIndex] : null;
  var txt = opt ? String(opt.textContent || '').trim() : '';
  var val = btn.querySelector('.cs-val');
  if (val) val.textContent = txt || '—';
  btn.classList.toggle('cs-placeholder', !txt);
  btn.disabled = !!sel.disabled;
  btn.setAttribute('aria-disabled', sel.disabled ? 'true' : 'false');
  if (btn.classList.contains('opt-color')) {
    btn.style.background = sel.style.background || '';
    btn.style.color = sel.style.color || '';
  }
}

function closeCsMenu() {
  if (!CS_OPEN) return;
  CS_OPEN.btn.setAttribute('aria-expanded', 'false');
  CS_OPEN.btn.classList.remove('cs-open');
  CS_OPEN.menu.remove();
  CS_OPEN = null;
}

function csOpts() { return CS_OPEN ? Array.from(CS_OPEN.menu.querySelectorAll('.cs-opt')) : []; }

function setCsActive(i, scroll) {
  if (!CS_OPEN) return;
  var opts = csOpts();
  if (!opts.length) return;
  i = Math.max(0, Math.min(opts.length - 1, i));
  opts.forEach(function (o, k) { o.classList.toggle('active', k === i); });
  CS_OPEN.active = i;
  if (scroll) {
    var el = opts[i], menu = CS_OPEN.menu;
    if (el) menu.scrollTop = Math.max(0, el.offsetTop - (menu.clientHeight - el.offsetHeight) / 2);
  }
}

function moveCsActive(delta) {
  if (!CS_OPEN) return;
  var opts = csOpts();
  var i = CS_OPEN.active;
  do { i += delta; } while (i >= 0 && i < opts.length && opts[i].classList.contains('disabled'));
  if (i >= 0 && i < opts.length) setCsActive(i, true);
}

function chooseCs(i) {
  if (!CS_OPEN) return;
  var sel = CS_OPEN.sel;
  var opt = sel.options[i];
  if (!opt || opt.disabled) return;
  sel.selectedIndex = i;
  csSync(sel);
  closeCsMenu();
  sel.dispatchEvent(new Event('change', { bubbles: true }));
}

function openCsMenu(sel, dir) {
  closeCsMenu();
  var btn = sel.__csBtn;
  var opts = Array.from(sel.options);
  if (!btn || !opts.length) return;
  var menu = document.createElement('div');
  menu.className = 'cs-menu';
  menu.setAttribute('role', 'listbox');
  menu.innerHTML = opts.map(function (o, i) {
    var on = i === sel.selectedIndex;
    return '<div class="cs-opt' + (on ? ' on' : '') + (o.disabled ? ' disabled' : '') + '"'
      + ' role="option" aria-selected="' + (on ? 'true' : 'false') + '" data-i="' + i + '">'
      + '<span class="cs-opt-t">' + esc(String(o.textContent || '').trim() || '—') + '</span>'
      + (on ? '<svg class="cs-check" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>' : '')
      + '</div>';
  }).join('');
  menu.addEventListener('click', function (e) {
    e.stopPropagation();
    var row = e.target.closest('.cs-opt');
    if (row) chooseCs(+row.getAttribute('data-i'));
  });
  document.body.appendChild(menu);

  var r = btn.getBoundingClientRect();
  var mw = Math.min(Math.max(r.width, 160), Math.min(360, window.innerWidth - 16));
  menu.style.width = mw + 'px';
  menu.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 8 - mw)) + 'px';
  menu.style.top = '0px';
  var mh = menu.offsetHeight;
  var below = window.innerHeight - r.bottom - 8;
  var above = r.top - 8;
  var top = (below >= mh || below >= above) ? r.bottom + 4 : r.top - 4 - mh;
  menu.style.top = Math.max(8, Math.min(top, window.innerHeight - 8 - mh)) + 'px';

  CS_OPEN = { sel: sel, btn: btn, menu: menu, active: sel.selectedIndex };
  btn.classList.add('cs-open');
  btn.setAttribute('aria-expanded', 'true');
  try { btn.focus({ preventScroll: true }); } catch (e) { btn.focus(); }
  setCsActive(dir < 0 ? Math.max(0, sel.selectedIndex) : (sel.selectedIndex >= 0 ? sel.selectedIndex : 0), true);
  if (dir) moveCsActive(dir < 0 ? -1 : 1);
}

document.addEventListener('click', function (e) {
  if (!CS_OPEN) return;
  var t = e.target;
  if (t.closest('.cs-menu') || t.closest('.cs-select')) return;
  closeCsMenu();
});
document.addEventListener('keydown', function (e) {
  if (!CS_OPEN) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeCsMenu(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); e.stopImmediatePropagation(); moveCsActive(1); return; }
  if (e.key === 'ArrowUp') { e.preventDefault(); e.stopImmediatePropagation(); moveCsActive(-1); return; }
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); e.stopImmediatePropagation(); chooseCs(CS_OPEN.active); return; }
  if (e.key === 'Tab') closeCsMenu();
});
document.addEventListener('scroll', function (e) {
  if (!CS_OPEN) return;
  if (CS_OPEN.menu.contains(e.target)) return;
  closeCsMenu();
}, true);
window.addEventListener('resize', closeCsMenu);

var csObserver = new MutationObserver(function (muts) {
  muts.forEach(function (m) {
    if (m.type !== 'childList') return;
    m.addedNodes.forEach(function (n) {
      if (n.nodeType !== 1) return;
      if (n.tagName === 'SELECT') enhanceSelect(n);
      else if (n.querySelectorAll) enhanceSelects(n);
    });
  });
});
csObserver.observe(document.body, { childList: true, subtree: true });
enhanceSelects(document);

/* ---------- 自定义日期选择器 ---------- */
var DATE_ICON_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>';
var DP = null;
function dpPad(n) { return (n < 10 ? '0' : '') + n; }
function dpFmt(y, m, d) { return y + '-' + dpPad(m + 1) + '-' + dpPad(d); }
function dpParse(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || ''));
  return m ? { y: +m[1], m: +m[2] - 1, d: +m[3] } : null;
}
function dpToday() { var n = new Date(); return { y: n.getFullYear(), m: n.getMonth(), d: n.getDate() }; }
function closeDatePicker() { if (!DP) return; var p = DP.pop; DP = null; if (p && p.parentNode) p.remove(); }
function openDatePicker(input, opts) {
  opts = opts || {};
  if (DP && DP.input === input) { closeDatePicker(); return; }
  closeDatePicker();
  var sel = dpParse(input.value);
  var base = sel || dpToday();
  var pop = document.createElement('div');
  pop.className = 'dp-pop';
  pop.setAttribute('role', 'dialog');
  pop.innerHTML = '<div class="dp-phead">'
    + '<button type="button" class="dp-pnav" data-nav="py" title="上一年"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6l-6 6 6 6M11 6l-6 6 6 6"/></svg></button>'
    + '<button type="button" class="dp-pnav" data-nav="pm" title="上个月"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>'
    + '<span class="dp-pym"></span>'
    + '<button type="button" class="dp-pnav" data-nav="nm" title="下个月"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>'
    + '<button type="button" class="dp-pnav" data-nav="ny" title="下一年"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg></button>'
    + '</div>'
    + '<div class="dp-pweek">' + ['一', '二', '三', '四', '五', '六', '日'].map(function (x) { return '<span>' + x + '</span>'; }).join('') + '</div>'
    + '<div class="dp-pdays"></div>'
    + '<div class="dp-pfoot"><button type="button" class="dp-pclear">清除</button><button type="button" class="dp-ptoday">今天</button></div>';
  document.body.appendChild(pop);
  DP = { input: input, pop: pop, y: base.y, m: base.m, sel: sel, opts: opts };

  function draw() {
    if (!DP) return;
    DP.pop.querySelector('.dp-pym').textContent = DP.y + '年' + (DP.m + 1) + '月';
    var first = new Date(DP.y, DP.m, 1);
    var off = (first.getDay() + 6) % 7;          // 周一为第一列
    var start = new Date(DP.y, DP.m, 1 - off);
    var t = dpToday(), html = '';
    for (var i = 0; i < 42; i++) {
      var dt = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      var y = dt.getFullYear(), m = dt.getMonth(), d = dt.getDate();
      var cl = 'dp-pday';
      if (m !== DP.m) cl += ' other';
      if (y === t.y && m === t.m && d === t.d) cl += ' today';
      if (DP.sel && y === DP.sel.y && m === DP.sel.m && d === DP.sel.d) cl += ' sel';
      html += '<button type="button" class="' + cl + '" data-d="' + dpFmt(y, m, d) + '">' + d + '</button>';
    }
    DP.pop.querySelector('.dp-pdays').innerHTML = html;
  }
  DP.draw = draw;

  function pick(v) {
    if (!DP) return;
    var inp = DP.input, cb = DP.opts && DP.opts.onPick;
    closeDatePicker();
    inp.value = v;
    try { inp.dispatchEvent(new Event('input', { bubbles: true })); } catch (e) {}
    inp.dispatchEvent(new Event('change', { bubbles: true }));
    if (cb) cb(v);
  }
  DP.pick = pick;

  draw();
  pop.addEventListener('mousedown', function (e) { e.preventDefault(); });
  pop.querySelectorAll('[data-nav]').forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute('data-nav');
      if (k === 'py') DP.y--;
      else if (k === 'ny') DP.y++;
      else if (k === 'pm') { DP.m--; if (DP.m < 0) { DP.m = 11; DP.y--; } }
      else if (k === 'nm') { DP.m++; if (DP.m > 11) { DP.m = 0; DP.y++; } }
      draw();
    };
  });
  pop.querySelector('.dp-pclear').onclick = function () { pick(''); };
  pop.querySelector('.dp-ptoday').onclick = function () { var t = dpToday(); pick(dpFmt(t.y, t.m, t.d)); };
  pop.querySelector('.dp-pdays').onclick = function (e) {
    var b = e.target.closest('.dp-pday');
    if (b) pick(b.getAttribute('data-d'));

  var r = input.getBoundingClientRect();
  var w = pop.offsetWidth, h = pop.offsetHeight;
  var left = Math.min(Math.max(8, r.left), window.innerWidth - 8 - w);
  var below = window.innerHeight - r.bottom - 8, above = r.top - 8;
  var top = (below >= h || below >= above) ? r.bottom + 6 : r.top - 6 - h;
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(Math.max(8, Math.min(top, window.innerHeight - 8 - h))) + 'px';
}
function positionDatePicker() {
  if (!DP) return;
  var inp = DP.input, pop = DP.pop;
  if (!inp.isConnected) { closeDatePicker(); return; }
  var r = inp.getBoundingClientRect();
  if (r.bottom < 0 || r.top > window.innerHeight || r.right < 0 || r.left > window.innerWidth) {
    closeDatePicker(); return;
  }
  var w = pop.offsetWidth, h = pop.offsetHeight;
  var left = Math.min(Math.max(8, r.left), window.innerWidth - 8 - w);
  var below = window.innerHeight - r.bottom - 8, above = r.top - 8;
  var top = (below >= h || below >= above) ? r.bottom + 6 : r.top - 6 - h;
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(Math.max(8, Math.min(top, window.innerHeight - 8 - h))) + 'px';
}
document.addEventListener('click', function (e) {
  if (!DP) return;
  if (e.target.closest('.dp-pop') || e.target === DP.input || e.target.closest('.date-btn')) return;
  closeDatePicker();
}, true);
document.addEventListener('keydown', function (e) {
  if (!DP) return;
  if (e.key === 'Escape') { e.preventDefault(); e.stopImmediatePropagation(); closeDatePicker(); return; }
  if (e.key === 'Enter') {
    if (DP.sel) { e.preventDefault(); e.stopImmediatePropagation(); DP.pick(dpFmt(DP.sel.y, DP.sel.m, DP.sel.d)); }
    return;
  }
  var delta = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : e.key === 'ArrowUp' ? -7 : e.key === 'ArrowDown' ? 7 : 0;
  if (delta) {
    e.preventDefault(); e.stopImmediatePropagation();
    var cur = DP.sel ? new Date(DP.sel.y, DP.sel.m, DP.sel.d) : new Date(DP.y, DP.m, 1);
    cur.setDate(cur.getDate() + delta);
    DP.sel = { y: cur.getFullYear(), m: cur.getMonth(), d: cur.getDate() };
    DP.y = DP.sel.y; DP.m = DP.sel.m;
    DP.draw();
  }
});
document.addEventListener('scroll', function (e) {
  if (!DP) return;
  if (DP.pop.contains(e.target)) return;
  positionDatePicker();
}, true);
window.addEventListener('resize', positionDatePicker);

  var items = [];
  function add(label, icon, fn) { items.push({ label: label, icon: icon, fn: fn }); }
  add('导出 CSV',
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>',
    function () { $('btn-csv').click(); });
  if (t && t.my_role === 'editor') add('导入 Excel / CSV',
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9M7 14l5-5 5 5M5 3h14"/></svg>',
    function () { $('btn-import').click(); });
  add('变动历史',
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    function () { $('btn-hist').click(); });
  if (curProject && curProject.analysis_role) add('数据分析',
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>',
    function () { $('btn-analysis').click(); });
  if (ME && ME.role === 'admin') add('汇总同步',
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h6v6H4zM4 13h6v6H4zM14 12h6M17 9l3 3-3 3"/></svg>',
    function () { $('btn-sync').click(); });
  if (ME && ME.role === 'admin') add('写入密钥',
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 7a4 4 0 1 0-4 4l-6 6v3h3l6-6a4 4 0 0 0 1-.9"/><circle cx="16.5" cy="7.5" r=".8"/></svg>',
    function () { $('btn-apikey').click(); });
  if (ME && ME.role === 'admin') add('新建表格',
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    function () { $('btn-new-table').click(); });
  add('重置视图（清除搜索/筛选/排序）',
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v5h5"/></svg>',
    function () { resetView(); });
  add('恢复默认顺序（页签/侧栏）',
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M4 12h16M4 17h7"/></svg>',
    function () { resetUserOrder(); });
  menu.innerHTML = items.map(function (it, i) {
    return '<button class="tm-item" type="button" data-i="' + i + '">' + it.icon + '<span>' + it.label + '</span></button>';
  }).join('');
  var btn = $('btn-more');
  var r = btn.getBoundingClientRect();
  menu.style.top = Math.round(r.bottom + 6) + 'px';
  menu.style.left = 'auto';
  menu.style.right = Math.max(8, Math.round(window.innerWidth - r.right)) + 'px';
  menu.classList.add('on');
  menu.querySelectorAll('.tm-item').forEach(function (b) {
    b.onclick = function () {
      closeTableMenu();
      items[+b.getAttribute('data-i')].fn();
    };
  });
}
$('btn-more').onclick = function (e) { e.stopPropagation(); openTableMenu(); };
document.addEventListener('click', function (e) {
  if (!e.target.closest('#table-menu') && !e.target.closest('#btn-more')) closeTableMenu();
});
document.addEventListener('scroll', closeTableMenu, true);
window.addEventListener('resize', closeTableMenu);

/* 启动：失败自动重试，仍失败给提示（避免首屏空白） */
function startApp() {
  boot().catch(function (e) {
    console.error('boot failed', e);
    setTimeout(function () {
      boot().catch(function (e2) {
        console.error('boot retry failed', e2);
        var b = document.getElementById('home-body');
        if (b) b.innerHTML = '<div class="home-empty">加载失败：' + esc(e2.message) + '<br>请刷新页面重试</div>';
      });
    }, 600);
  });
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startApp);else startApp();
</script>
</body>
