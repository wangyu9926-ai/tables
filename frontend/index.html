<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牧马人线上多维表</title>
<style>
:root {
  --bg:#F7F8FA; --panel:#FFFFFF; --border:#E5E6EB; --border-soft:#F0F1F4;
  --text:#1D2129; --text-2:#4E5969; --text-3:#86909C;
  --primary:#3370FF; --primary-2:#2E62E6; --primary-light:#E8F0FF;
  --red:#F54A45; --green:#00B42A; --orange:#FF7D00; --purple:#7B61FF;
  --shadow:0 1px 2px rgba(29,33,41,.04); --shadow-lg:0 12px 32px -8px rgba(29,33,41,.14);
  --radius:10px; --radius-sm:8px;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-num:"SF Mono",ui-monospace,Consolas,monospace;
  --fs-xs:11px; --fs-sm:12px; --fs-md:13px; --fs-lg:14px; --fs-xl:20px;
  --white:#FFFFFF; --gray-50:#FAFBFC; --gray-100:#F7F8FA; --gray-300:#C9CDD4;
  --bg-danger:#FFECE8; --bg-green:#E8FFEA; --bg-orange:#FFF3E8; --bg-purple:#F5F0FF;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; }
body { font-family:var(--font-ui); background:var(--bg); color:var(--text); font-size:var(--fs-lg);
  line-height:1.5; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
::selection { background:rgba(51,112,255,.16); }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-thumb { background:#D5D8DE; border-radius:6px; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-thumb:hover { background:#BFC4CC; border:3px solid transparent; background-clip:content-box; }
::-webkit-scrollbar-track { background:transparent; }
a { color:var(--primary); text-decoration:none; }
button { font-family:var(--font-ui); }

/* ---------- 顶栏 ---------- */
#topnav { height:52px; flex-shrink:0; background:var(--panel); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; padding:0 16px; position:relative; z-index:30; }
.top-left { display:flex; align-items:center; gap:10px; min-width:0; }
.top-sb-toggle { display:none; align-items:center; gap:5px; height:30px; padding:0 9px;
  border:1px solid var(--border); border-radius:8px; background:var(--panel); color:var(--text-2);
  font-size:var(--fs-sm); cursor:pointer; transition:.15s; flex:none; white-space:nowrap; }
.top-sb-toggle:hover { background:var(--gray-100); color:var(--text); border-color:#D5D8DE; }
body.in-table .top-sb-toggle, body.in-analysis .top-sb-toggle { display:inline-flex; }
#topnav #btn-back { display:none; }
body.in-table #topnav #btn-back { display:inline-flex; }
body.sb-collapsed #sidebar { display:none !important; }
@media (max-width:860px) { .top-sb-toggle { display:none !important; } }
.brand { display:flex; align-items:center; gap:9px; color:var(--text); }
.brand-logo { width:26px; height:26px; border-radius:7px; display:flex; align-items:center; justify-content:center;
  font-weight:600; font-size:13px; color:#fff;
  background:linear-gradient(135deg,#4D8DFF 0%,#2E62E6 100%); box-shadow:0 2px 6px rgba(51,112,255,.28); }
.brand h1 { font-size:var(--fs-lg); font-weight:600; letter-spacing:.1px; }
.top-meta { display:flex; align-items:center; gap:8px; }
.top-tag { display:inline-flex; align-items:center; justify-content:center; gap:4px;
  height:30px; padding:0 12px; border-radius:var(--radius-sm); background:var(--panel);
  border:1px solid var(--border); font-size:var(--fs-md); line-height:1; white-space:nowrap;
  color:var(--text-2); cursor:pointer; transition:.15s; }
.top-tag:hover { background:var(--gray-100); color:var(--text); border-color:#D5D8DE; }
.top-tag.primary { background:var(--primary); color:#fff; border-color:var(--primary); font-weight:400;
  box-shadow:0 2px 6px rgba(51,112,255,.24); }
.top-tag.primary:hover { background:var(--primary-2); border-color:var(--primary-2); }
.user-box { display:flex; align-items:center; gap:8px; position:relative; }
.user-chip { display:inline-flex; align-items:center; gap:6px; }
.user-menu { position:absolute; top:38px; right:0; min-width:150px; padding:6px; background:var(--panel);
  border:1px solid var(--border); border-radius:9px; box-shadow:0 12px 32px rgba(29,33,41,.14);
  display:none; z-index:80; }
.user-menu.open { display:block; }
.user-menu div { padding:8px 10px; border-radius:6px; font-size:var(--fs-md); color:var(--text-2); cursor:pointer; }
.user-menu div:hover { background:var(--gray-100); color:var(--text); }
.user-menu .um-sep { height:1px; padding:0; margin:4px 2px; background:var(--border-soft); cursor:default; }
.user-menu .um-sep:hover { background:var(--border-soft); }

#app { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
#layout { flex:1; display:flex; min-height:0; }

/* ---------- 侧栏 ---------- */
#sidebar { width:236px; flex-shrink:0; background:var(--panel); border-right:1px solid var(--border);
  display:flex; flex-direction:column; overflow-y:auto; padding:10px 8px; }
.sb-head { display:flex; align-items:center; justify-content:space-between; padding:4px 8px 10px; }
.sb-title { font-size:var(--fs-sm); color:var(--text-3); font-weight:400; letter-spacing:.2px; }
.sb-add { margin-left:auto; width:26px; height:26px; padding:0; border:0; border-radius:6px;
  background:transparent; color:var(--text-3); cursor:pointer; transition:.15s;
  display:inline-flex; align-items:center; justify-content:center; }
.sb-add:hover { background:var(--primary-light); color:var(--primary); }
.sb-item { display:flex; align-items:center; gap:6px; height:34px; padding:0 10px; border-radius:var(--radius-sm);
  cursor:pointer; color:var(--text-2); font-size:var(--fs-lg); margin-bottom:1px; transition:background .12s,color .12s; }
.sb-item:hover { background:var(--gray-100); color:var(--text); }
.sb-item.active { background:var(--primary-light); color:var(--primary); font-weight:400; }
.sb-item.editing { padding:0 6px; cursor:text; }
.sb-rename-ipt { flex:1; min-width:0; width:100%; height:26px; padding:0 6px; border:1px solid var(--primary);
  border-radius:5px; font:inherit; font-size:var(--fs-lg); color:var(--text); background:var(--panel);
  outline:none; box-shadow:none; }
.sb-item .sb-ic { flex-shrink:0; font-size:14px; width:18px; text-align:center; }
.sb-item .sb-name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sb-del { flex:none; width:24px; height:24px; border:0; border-radius:6px; background:transparent;
  color:var(--text-3); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  opacity:.35; transition:opacity .12s; }
.sb-item:hover .sb-del { opacity:1; }
.sb-del:hover { background:var(--bg-danger); color:var(--red); }
.sb-item.editing .sb-del { display:none; }
.sheet-del { color:var(--text-3); }
.sheet-del:hover { background:var(--bg-danger); color:var(--red); }
.sb-item, .sheet-tab { cursor:pointer; }
.sb-item.dragging, .sheet-tab.dragging { opacity:.9; background:var(--panel);
  box-shadow:0 8px 22px rgba(29,33,41,.18); }
#sb-list.sorting .sb-item, .sheet-bar.sorting .sheet-tab { cursor:grabbing; }

/* ---------- 主区 ---------- */
#main { flex:1; min-width:0; display:flex; flex-direction:column; overflow:hidden; }
#table-view { flex:1; min-height:0; flex-direction:column; padding:10px 14px 0; }
#table-view.on { display:flex !important; }
.tb-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
.tb-tools { display:flex; align-items:center; gap:8px; width:100%; flex-wrap:wrap; row-gap:6px; }
.tb-tools .btn, .tb-tools .back-btn { white-space:nowrap; flex:none; }
.tb-tools .search-box { flex:0 1 220px; min-width:150px; }
.tb-tools .search-box input { width:100%; }
.tb-tools #tv-name { font-size:var(--fs-xl); font-weight:400; letter-spacing:-.1px;
  flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.search-box { position:relative; }
.search-box input { height:32px; width:220px; padding:0 12px 0 30px; border:1px solid var(--border);
  border-radius:var(--radius-sm); font-size:var(--fs-md); outline:none; background:var(--panel);
  color:var(--text); transition:.15s; }
.search-box input::placeholder { color:var(--text-3); }
.search-box input:hover { border-color:#C9CDD4; }
.search-box input:focus { background:var(--panel); border-color:var(--primary); box-shadow:0 0 0 3px rgba(51,112,255,.12); }
.search-box .s-ic { position:absolute; left:10px; top:50%; transform:translateY(-50%);
  display:inline-flex; align-items:center; color:var(--text-3); pointer-events:none; }
.btn { height:32px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:0 12px;
  font-size:var(--fs-md); cursor:pointer; background:var(--panel); color:var(--text-2);
  font-weight:400; transition:.15s; }
.btn:hover { background:var(--gray-100); color:var(--text); border-color:#D5D8DE; }
.btn-primary { background:var(--primary); border-color:var(--primary); color:#fff;
  box-shadow:0 2px 6px rgba(51,112,255,.22); }
.btn-primary:hover { background:var(--primary-2); border-color:var(--primary-2); color:#fff; }
.btn-danger { background:var(--red); border-color:var(--red); color:#fff; }.btn-danger:hover { background:#E33B36; border-color:#E33B36; color:#fff; }
.btn-danger:disabled { opacity:.6; cursor:default; }
/* 键盘可达性：所有能聚焦的控件都给一圈清晰但不刺眼的焦点环 */
.btn:focus-visible, .top-tag:focus-visible, .back-btn:focus-visible, .sheet-tab:focus-visible,
.sb-item:focus-visible, .pg-btn:focus-visible, .row-del:focus-visible, .th-f:focus-visible,
input:focus-visible, select:focus-visible, textarea:focus-visible,
[role="button"]:focus-visible { outline:2px solid rgba(51,112,255,.55); outline-offset:1px; }
/* 「重置」：只在视图被搜索/筛选/排序改动过时出现 */
#btn-reset { padding:0 10px; gap:5px; display:inline-flex; align-items:center; color:var(--primary); border-color:#C9D6F2; background:var(--primary-light); }
#btn-reset:hover { background:#DDE8FF; border-color:#B7CBF5; color:var(--primary-2); }
#btn-reset svg { flex:none; }
/* 常用视图：把搜索+筛选+排序存成命名视图，一键切换（只存本机） */
.view-btn { display:inline-flex; align-items:center; gap:5px; padding:0 9px; }
.view-btn.on { border-color:#C9D6F2; background:var(--primary-light); color:var(--primary); }
.view-btn .vw-caret { color:var(--text-3); }
.view-btn.on .vw-caret { color:var(--primary); }
.view-menu .ctx-item { justify-content:space-between; }
.view-menu .vw-del { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px;
  margin-left:8px; border-radius:4px; color:var(--text-3); font-size:14px; opacity:0; }
.view-menu .ctx-item:hover .vw-del { opacity:1; }
.view-menu .vw-del:hover { background:var(--bg-danger); color:var(--red); }
.view-menu .vw-check { margin-left:8px; color:var(--primary); font-size:12px; }
.back-btn { display:inline-flex; align-items:center; gap:5px; border:1px solid var(--border);
  background:var(--panel); color:var(--text-2); border-radius:var(--radius-sm); height:30px; padding:0 10px;
  font-size:var(--fs-md); cursor:pointer; transition:.15s; }
.back-btn:hover { background:var(--gray-100); color:var(--text); border-color:#D5D8DE; }

/* ---------- Sheet 页签 ---------- */
.sheet-bar { display:flex; align-items:center; gap:4px; margin-bottom:8px; overflow-x:auto; flex-shrink:0; }
.sheet-tab { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 12px; font-size:var(--fs-md);
  color:var(--text-2); cursor:pointer; white-space:nowrap; border-radius:7px; transition:background .12s,color .12s; }
.sheet-tab:hover { background:var(--gray-100); color:var(--text); }
.sync-chip { margin-left:6px; padding:1px 7px; border-radius:999px; font-size:11px; line-height:16px;
  color:#8a5a00; background:#fff4d6; border:1px solid #f0dba6; vertical-align:2px; }
.fm-hint { margin:0 0 10px; padding:8px 10px; font-size:12px; line-height:1.6; color:var(--text-3);
  background:var(--gray-50); border-radius:6px; }
.del-row-sync { color:#8a5a00; }
.sheet-tab.on { background:var(--primary-light); color:var(--primary); font-weight:400; }
.sheet-tab.editing { padding:0 6px; }
.tab-ipt { width:100%; height:24px; padding:0 6px; border:1px solid var(--primary); border-radius:5px;
  font:inherit; font-size:var(--fs-md); color:var(--text); outline:none; background:var(--panel);
  box-shadow:none; }
.sheet-add { color:var(--text-3); padding:0 10px; display:inline-flex; align-items:center; justify-content:center; }
.sheet-add:hover { color:var(--primary); }
.field-mgr { margin-left:auto; color:var(--text-3); }

/* ---------- 表格 ---------- */
.tbl-wrap { flex:1; min-height:0; overflow:auto; background:var(--panel); scrollbar-gutter:stable;
  border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); }
table.tbl { border-collapse:separate; border-spacing:0; width:100%; font-size:var(--fs-md); table-layout:fixed; }
.tbl thead th { position:sticky; top:0; z-index:10; background:var(--gray-100); color:var(--text-2);
  font-weight:400; height:38px; padding:0 12px; text-align:left; white-space:nowrap;
  border-bottom:1px solid var(--border); cursor:pointer; overflow:hidden; text-overflow:ellipsis;
  font-size:var(--fs-md); }
.th-inner { display:flex; align-items:center; gap:5px; min-width:0; width:100%; overflow:hidden; }
.th-label { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.th-sort { flex:none; color:var(--primary); }
.tbl thead th.num .th-label { text-align:right; }
.tbl thead th:hover { background:#F2F3F5; }
/* 正在按这一列排序：整列头换个底色，一眼看出当前排序（只影响你自己的视图） */
.tbl thead th.sorted { background:#EDF3FF; }
.tbl thead th.sorted:hover { background:#E4EDFF; }
/* 表头吸顶时给一点阴影，滚动后能看出表头浮在内容上方 */
.tbl-wrap.scrolled .tbl thead th { box-shadow:0 6px 10px -8px rgba(29,33,41,.3); }
.tbl thead th.num, .tbl td.num { text-align:right; }
.tbl td.num { font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }
.tbl tbody td { height:40px; padding:0 12px; border-bottom:1px solid var(--border-soft); vertical-align:middle;
  overflow:hidden; white-space:nowrap; text-overflow:ellipsis; position:relative; font-size:var(--fs-md);
  color:var(--text); }
.tbl tbody tr:last-child td { border-bottom:0; }
.tbl tbody tr:hover { background:#F7F9FC; }
.tbl tbody tr.row-flash td { animation:rowFlash 1.8s ease-out; }
@keyframes rowFlash { 0%,35% { background:#E8F0FF; } 100% { background:transparent; } }
.tbl tbody tr { transition:none; }
.tbl tbody tr.vsp td, .tbl tbody tr.vsp td:first-child { height:0; padding:0; border:0; background:transparent;
  position:static; z-index:auto; }
.tbl tbody tr.vsp:hover td { background:transparent; }
td.editable { cursor:text; }
td.formula { background:#FAF7FF; color:#6C50B5; font-variant-numeric:tabular-nums; cursor:default; }
.tbl tbody td.formula { padding-left:18px; }
td.formula::before { content:"ƒ"; position:absolute; left:5px; top:50%; transform:translateY(-50%);
  font-size:10px; opacity:.45; }
table.tbl td { position:relative; }
.mt-editor { position:absolute; inset:0; z-index:30; display:flex; align-items:center; padding:0 12px;
  background:var(--panel); border-radius:6px; outline:none; overflow:hidden; }
.mt-editor::before { content:""; position:absolute; inset:0; border-radius:6px; pointer-events:none;
  box-shadow:inset 0 0 0 2px rgba(51,112,255,.58); }
.mt-editor-ipt { flex:1; min-width:0; height:100%; border:0; outline:none; background:transparent; font:inherit;
  color:inherit; text-align:inherit; padding:0; }
.idx-col { color:#A9AEB8; font-size:var(--fs-sm); font-variant-numeric:tabular-nums;
  cursor:pointer; user-select:none; white-space:nowrap; }
@media (hover:hover) { .tbl tbody td.idx-col { cursor:grab; } }
.tbl tbody tr.row-drag td { opacity:.55; }
.tbl tbody tr.row-drag td.idx-col { cursor:grabbing; }
.row-drop-line { position:fixed; z-index:130; height:2px; background:var(--primary); border-radius:2px;
  pointer-events:none; display:none; box-shadow:0 0 0 3px rgba(51,112,255,.14); }
.idx-col:hover { color:var(--primary); }
@media (hover:hover) { #tbody td.idx-col, .tbl thead th:first-child { padding-left:32px; } }   /* 给左侧行间「＋」留位置，行号不跳；手机端不加 */
/* 行号之间悬浮出现的「插入一行」按钮（fixed，避免被 td 的 overflow 裁掉） */
.row-ins { position:fixed; z-index:120; width:20px; height:20px; padding:0; display:none;
  align-items:center; justify-content:center; border:1px solid var(--primary); border-radius:50%;
  background:var(--panel); color:var(--primary); box-shadow:0 2px 6px rgba(51,112,255,.25);
  cursor:pointer; transform:translateY(-50%); }
.row-ins.on { display:inline-flex; }
.row-ins:hover { background:var(--primary); color:#fff; }
.row-ins:disabled { opacity:.45; cursor:default; }
.tbl thead th:first-child { position:sticky; left:0; top:0; z-index:12; background:var(--gray-100); }
.tbl tbody td:first-child { position:sticky; left:0; z-index:5; background:var(--panel); }
.tbl tbody tr:hover td:first-child { background:#F7F9FC; }
.cell-empty { color:#C9CDD4; }
.cell-img { height:28px; max-width:100%; border-radius:4px; object-fit:cover; display:inline-block;
  vertical-align:middle; -webkit-user-drag:none; }
.cell-link { display:inline-block; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--primary); }
#tbody td.cell-sel { outline:2px solid rgba(51,112,255,.30); outline-offset:-2px; border-radius:6px; background:#fff; z-index:4; }
.cell-expand { position:absolute; right:3px; top:50%; transform:translateY(-50%); width:20px; height:20px; padding:0;
  display:inline-flex; align-items:center; justify-content:center; border:1px solid transparent; border-radius:5px;
  background:var(--panel); color:var(--text-3); cursor:pointer; opacity:0; pointer-events:none; z-index:5;
  transition:opacity .12s, border-color .15s, color .15s; }
#tbody td.cell-sel:hover .cell-expand, .cell-expand:focus-visible { opacity:1; pointer-events:auto; }
.cell-expand:hover { border-color:var(--primary); color:var(--primary); }
/* 单元格批注：有批注的格子右上角一个小角标，点开看/写；没批注的从选中后的气泡按钮进 */
.cmt-dot { position:absolute; top:2px; right:2px; min-width:14px; height:14px; padding:0 4px; border-radius:8px;
  background:#FF9F1C; color:#fff; font-size:10px; line-height:14px; text-align:center; cursor:pointer; z-index:3;
  box-shadow:0 1px 3px rgba(255,159,28,.45); }
.cmt-dot:hover { background:#F08C00; }
.cell-cmt { position:absolute; right:26px; top:50%; transform:translateY(-50%); width:20px; height:20px; padding:0;
  display:inline-flex; align-items:center; justify-content:center; border:1px solid transparent; border-radius:5px;
  background:var(--panel); color:var(--text-3); cursor:pointer; opacity:0; pointer-events:none; z-index:5;
  transition:opacity .12s, border-color .15s, color .15s; }
#tbody td.cell-sel:hover .cell-cmt, .cell-cmt:focus-visible { opacity:1; pointer-events:auto; }
.cell-cmt:hover { border-color:var(--primary); color:var(--primary); }
.cmt-pop { position:fixed; z-index:150; width:320px; max-width:calc(100vw - 16px); background:var(--panel);
  border:1px solid var(--border); border-radius:10px; box-shadow:0 14px 36px -8px rgba(23,29,41,.24); }
.cmt-head { display:flex; align-items:center; gap:6px; padding:10px 12px 6px; font-size:12px; color:var(--text-3); }
.cmt-head b { color:var(--text); font-weight:400; font-size:13px; }
.cmt-x { margin-left:auto; border:0; background:transparent; color:var(--text-3); cursor:pointer; width:22px; height:22px; border-radius:5px; font-size:14px; }
.cmt-x:hover { background:var(--gray-100); color:var(--text); }
.cmt-list { max-height:210px; overflow:auto; padding:2px 12px; }
.cmt-item { padding:7px 0; border-bottom:1px solid var(--border-soft); }
.cmt-item:last-child { border-bottom:0; }
.cmt-meta { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--text-3); margin-bottom:2px; }
.cmt-del { margin-left:auto; border:0; background:transparent; color:var(--text-3); cursor:pointer; font-size:14px; padding:0 3px; }
.cmt-del:hover { color:var(--red); }
.cmt-body { white-space:pre-wrap; word-break:break-word; font-size:13px; line-height:1.6; color:var(--text); }
.cmt-empty { padding:14px 0; color:var(--text-3); font-size:12px; text-align:center; }
.cmt-input { border-top:1px solid var(--border-soft); padding:8px 12px 10px; }
.cmt-input textarea { width:100%; box-sizing:border-box; min-height:54px; max-height:120px; resize:vertical;
  border:1px solid var(--border); border-radius:7px; padding:7px 9px; font:inherit; font-size:13px; color:var(--text);

<script>
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(msg) { var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._h); t._h=setTimeout(function(){t.classList.remove('show');},1900); }

var BUSY_TIMER = null, BUSY_START = 0, DELETING_PROJECTS = Object.create(null);
function showBusy(title) {
  var r = $('busy-root'); if (!r) return;
  r.innerHTML = '<div class="busy-mask"><div class="busy-box" role="status" aria-live="polite">'
    + '<div class="busy-title">' + esc(title) + '<span class="busy-cursor"></span></div>'
    + '<div class="busy-sub" id="busy-sub">已等待 0 秒</div></div></div>';
  r.classList.add('on');
  BUSY_START = Date.now();
  clearInterval(BUSY_TIMER);
  BUSY_TIMER = setInterval(function () {
    var e = $('busy-sub'); if (!e) return;
    var s = Math.floor((Date.now() - BUSY_START) / 1000);
    e.textContent = '已等待 ' + s + ' 秒' + (s >= 10 ? '，数据较多，仍在处理，请稍候…' : '');
  }, 500);
}
function hideBusy() {
  clearInterval(BUSY_TIMER); BUSY_TIMER = null;
  var r = $('busy-root'); if (r) { r.classList.remove('on'); r.innerHTML = ''; }
}
/* 离开页面前把已经画出来的数据清掉。
   浏览器会把离开的页面整页留在“后退缓存”里，之后按“后退”能原样恢复 —— 不发请求、不查登录态。
   共用一台电脑时，下一位按一下后退就可能看到上一位的表。所以：跳登录页之前先清空；
   万一还是被恢复出来（见下面 pageshow），就强制重新加载，由网关按当前登录态决定。 */
function wipeScreen() {
  ROWS_CACHE = {}; ROWDATA = {};
  ['sb-list', 'home-body', 'proj-body', 'thead', 'tbody', 'sheet-bar', 'ana-body', 'rp-body'].forEach(function (id) {
    var el = $(id); if (el) el.innerHTML = '';
  });
  var kw = $('kw'); if (kw) kw.value = '';
}
function gotoLogin() {
  try { wipeScreen(); } catch (e) {}
  location.href = '/login';
}
window.addEventListener('pageshow', function (e) { if (e.persisted) location.reload(); });

async function api(path, method, body) {
  var opt = { method: method || 'GET', headers: {'Content-Type':'application/json'}, cache: 'no-store' };
  if (body !== undefined) opt.body = JSON.stringify(body);
  var r = await fetch(path, opt);
  if (r.status === 401) { gotoLogin(); throw new Error('登录已失效'); }
  if (!r.ok) { var e = await r.json().catch(function(){return {};}); throw new Error(e.detail || ('HTTP '+r.status)); }
  return r.json();
}
async function apiForm(path, fd) {
  var r = await fetch(path, { method:'POST', body:fd, cache:'no-store' });
  if (r.status === 401) { gotoLogin(); throw new Error('登录已失效'); }
  if (!r.ok) { var e = await r.json().catch(function(){return {};}); throw new Error(e.detail || ('HTTP '+r.status)); }
  return r.json();
}
async function uploadImageFile(tid, file) {
  var fd = new FormData();
  fd.append('file', file);
  fd.append('tid', String(tid));
  return await apiForm('/api/upload/image', fd);
}

var TAG_N = 11;
function tagClass(s) {
  // 语义色优先（都取自 11 色盘）
  if (/已合作|已发布|已完成|完成/.test(s)) return 'tag-c4';   // 薄荷浅绿
  if (/已建联/.test(s)) return 'tag-c0';                      // 浅天青蓝
  if (/建联中|待发布|进行中|处理中/.test(s)) return 'tag-c1';  // 浅杏奶橘黄
  if (/待定|待处理/.test(s)) return 'tag-c7';                 // 浅鹅黄
  if (/拒绝|取消|失败/.test(s)) return 'tag-c9';               // 豆沙浅红
  var h = 0;
  for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
  return 'tag-c' + (h % TAG_N);
}
var COLOR_NAMES = ['浅天青蓝','浅杏奶橘黄','淡薰衣草紫','浅桃粉','薄荷浅绿','浅焦糖棕',
                   '浅灰蓝','浅鹅黄','灰调青灰','豆沙浅红','浅灰紫'];
function tagColorIndex(v, c){
  var s=String(v), oc=(c&&c.option_colors)||{};
  if(oc[s]!==undefined && oc[s]!==null && oc[s]!=='') return +oc[s];
  return null;
}
function tagFor(v, c) {
  var s = String(v);
  var fixed = tagColorIndex(s, c);
  if (fixed !== null && fixed >= 0 && fixed < TAG_N) return 'tag-c' + fixed;
  var opts = (c && c.options) || [];
  var i = opts.indexOf(s);
  if (i !== -1 && !/已合作|已发布|已完成|完成|已建联|建联中|待发布|进行中|处理中|待定|待处理|拒绝|取消|失败/.test(s)) {
    // 每列一个起始色，列内按选项顺序轮流用 11 色盘；跳过已被手动指定的颜色
    var base = 0, ck = String((c && (c.key || c.label)) || '');
    for (var j = 0; j < ck.length; j++) base = (base * 31 + ck.charCodeAt(j)) >>> 0;
    var used = {}, oc2 = (c && c.option_colors) || {};
    Object.keys(oc2).forEach(function (k) { if (oc2[k] !== '') used[+oc2[k]] = 1; });
    var idx = (base + i) % TAG_N, tries = 0;
    while (used[idx] && tries < TAG_N) { idx = (idx + 1) % TAG_N; tries++; }
    return 'tag-c' + idx;
  }
  return tagClass(s);
}

var PROJECTS = [];   // [{name, groups:[{name,icon,sheets:[]}], tableCount}]

/* 元信息走 localStorage 缓存：刷新页面先用上次的结构秒开，再后台对齐最新。
   缓存按账号分开（见 scopeLocalKeys）：共用一台电脑时，后登录的人不能先看到上一位能看的项目、表和字段。 */
var META_KEY = 'kb_meta_v1';
function readMetaCache() {
  try { var m = JSON.parse(localStorage.getItem(META_KEY) || 'null'); return (m && m.tables) ? m : null; }
  catch (e) { return null; }
}
function writeMetaCache(m) {
  try { localStorage.setItem(META_KEY, JSON.stringify(m)); } catch (e) {}
}

/* 记住离开时的位置：刷新/重开浏览器回到原来的表、筛选和分析页（筛选条件是业务数据，同样按账号分开） */
var VIEW_KEY = 'kb_view_v1';
/* 自己拖出来的侧栏/页签顺序，也只存在本机（按账号）：团队共用一张表，别人的顺序不该被我改掉 */
var ORDER_KEY = 'kb_order_v1';
function readOrder() {
  try { var o = JSON.parse(localStorage.getItem(ORDER_KEY) || '{}'); return (o && typeof o === 'object' && !Array.isArray(o)) ? o : {}; }
  catch (e) { return {}; }
}
function writeOrder(o) { try { localStorage.setItem(ORDER_KEY, JSON.stringify(o)); } catch (e) {} }
/* 把本机保存的顺序套到分组/页签上；没拖过的保持原来的表结构顺序 */
function applyUserOrder(groups) {
  var o = readOrder();
  if (!groups || !groups.length) return groups;
  if (o.g && o.g.length) {
    groups.sort(function (a, b) {
      var ia = o.g.indexOf(a.name), ib = o.g.indexOf(b.name);
      if (ia < 0 && ib < 0) return 0;
      if (ia < 0) return 1;
      if (ib < 0) return -1;
      return ia - ib;
    });
  }
  groups.forEach(function (g) {
    var ord = (o.s || {})[g.name];
    if (ord && ord.length) {
      g.sheets.sort(function (a, b) {
        var ia = ord.indexOf(a.id), ib = ord.indexOf(b.id);
        if (ia < 0 && ib < 0) return 0;
        if (ia < 0) return 1;
        if (ib < 0) return -1;
        return ia - ib;
      });
    }
  });
  return groups;
}
function resetUserOrder() {
  try { localStorage.removeItem(ORDER_KEY); } catch (e) {}
  refreshMeta();
  toast('已恢复默认顺序');
}
/* 登录态拿到后调用：缓存键带上账号 ID。旧版本不分账号，存在这两个不带后缀的键里，顺手清掉。 */
function scopeLocalKeys() {
  var uid = (ME && ME.uid) ? '_u' + ME.uid : '';
  META_KEY = 'kb_meta_v1' + uid; VIEW_KEY = 'kb_view_v1' + uid; ORDER_KEY = 'kb_order_v1' + uid;
  VIEWS_KEY = 'kb_views_v1' + uid;
  if (uid) {
    ['kb_meta_v1', 'kb_view_v1', 'kb_order_v1', 'kb_views_v1'].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
    // 共用电脑：别的账号留下的缓存也清掉（只留自己的）。有人没点退出就关浏览器时，下一位不会继承
    try {
      Object.keys(localStorage).forEach(function (k) {
        if (/^kb_(meta|view|views|order)_v1_u\d+$/.test(k) && k.slice(-uid.length) !== uid) localStorage.removeItem(k);
      });
    } catch (e) {}
  }
}
/* 退出登录时清掉这个账号在本机留下的缓存（结构 + 上次看到的位置和筛选条件 + 自己拖的顺序 + 常用视图） */
function clearLocalCaches() {
  [META_KEY, VIEW_KEY, ORDER_KEY, VIEWS_KEY].forEach(function (k) { try { localStorage.removeItem(k); } catch (e) {} });
}
function saveView(v) {
  try {
    if (!v) {
      if ($('analysis-view').classList.contains('on')) v = { v: 'analysis', id: ANA.currentId, project: ANA.project };
      else if ($('table-view').classList.contains('on') && state.tid)
        v = { v: 'table', tid: state.tid, kw: state.kw, page: state.page, sort: state.sort, dir: state.dir, filters: state.filters };
      else if ($('proj-view').style.display === 'block' && curProject) v = { v: 'proj', project: curProject.name };
      else v = { v: 'home' };
    }
    localStorage.setItem(VIEW_KEY, JSON.stringify(v));
  } catch (e) {}
}
function restoreView() {
  var v = null;
  try { v = JSON.parse(localStorage.getItem(VIEW_KEY) || 'null'); } catch (e) {}
  if (!v) return false;
  if (v.v === 'table' && v.tid && META.tables.some(function (t) { return t.id === v.tid; })) {
    var t0 = META.tables.find(function (t) { return t.id === v.tid; });
    state.kw = v.kw || '';
    state.page = v.page || 1;
    state.sort = v.sort || '';
    state.dir = v.dir || 1;
    state.filters = v.filters || {};
    // 恢复时丢掉已不存在的列的筛选，避免把整表筛没
    if (t0 && typeof state.filters === 'object') {
      var ks = Object.create(null);
      (t0.columns || []).forEach(function (c) { ks[c.key] = 1; });
      Object.keys(state.filters).forEach(function (k) { if (!ks[k]) delete state.filters[k]; });
    }
    openSheet(v.tid, true);
    var kwEl = $('kw'); if (kwEl) kwEl.value = state.kw;
    return true;
  }
  if (v.v === 'analysis' && v.id) {
    if (v.project) curProject = PROJECTS.find(function (p) { return p.name === v.project; }) || curProject;
    if (curProject) { openAnalysisPage(v.id); return true; }
  }
  if (v.v === 'proj' && v.project && PROJECTS.some(function (p) { return p.name === v.project; })) {
    openProject(v.project);
    return true;
  }
  return false;
}

async function boot() {
  await loadMe();   // 先拿登录态：恢复分析页/按钮显隐都需要 ME
  scopeLocalKeys(); // 本地缓存按账号分开，要在读缓存之前定好键
  var cached = readMetaCache();
  if (cached) {                       // 有缓存：先渲染，不等网络
    META = cached; rebuildGroups(); rebuildProjects();
    if (!restoreView()) goHomeProjects();
  }
  var fresh = await api('/api/meta');
  var sameMeta = cached && JSON.stringify(cached) === JSON.stringify(fresh);
  META = fresh; writeMetaCache(fresh);
  if (sameMeta) { setTimeout(prefetchRows, 600); return; }   // 数据没变就不重绘，避免刷新闪一下
  rebuildGroups(); rebuildProjects();
  if (!cached) { goHomeProjects(); setTimeout(prefetchRows, 600); return; }
  // 已有缓存时按当前层级原地刷新，不把用户踢回首页
  if (document.body.classList.contains('in-table') && state.tid) {
    if (META.tables.some(function (x) { return x.id === state.tid; })) {
      $('btn-analysis').style.display = (curProject && curProject.analysis_role) ? '' : 'none';
      renderSidebar(); renderSheetBar(); renderHead(); loadRows();
    } else { goHomeProjects(); }
  } else if ($('analysis-view').classList.contains('on')) {
    renderSidebar(); renderAnaChrome(); renderAnaDash();
  } else if ($('proj-view').style.display !== 'none' && curProject) {
    openProject(curProject.name);
  } else {
    goHomeProjects();
  }
  setTimeout(prefetchRows, 600);
}
function rebuildGroups() {
  /* 名字当键的字典一律不带原型：项目名 / 分组名 / 表名是用户随便起的，叫 __proto__、constructor、toString
     这类名字时，普通对象取到的是对象自带的成员，整个首页会渲染失败（谁都进不来） */
  var map = Object.create(null);
  META.tables.forEach(function (t) {
    var g = t.group_name || t.name;
    if (!map[g]) map[g] = {name:g, icon:t.icon||'📄', sort:t.sort, sheets:[]};
    map[g].sheets.push(t);
  });
  GROUPS = Object.keys(map).map(function (k) {
    var g = map[k];
    g.sheets.sort(function (a, b) { return (a.sort - b.sort) || (a.id - b.id); });
    g.sort = g.sheets.length ? g.sheets[0].sort : g.sort;
    return g;
  }).sort(function(a,b){return a.sort-b.sort;});
  applyUserOrder(GROUPS);
}
function rebuildProjects() {
  var map = Object.create(null);
  (META.projects || []).forEach(function (p) {
    map[p.name] = {name:p.name, icon:p.icon || '📁', groups:[], sort:p.sort || 0,
                   analysis_role:p.analysis_role || null};
  });
  META.tables.forEach(function (t) {
    var p = t.project || '未归类';
    if (!map[p]) map[p] = {name:p, icon:'📁', groups:[], sort:999, analysis_role:null};
    map[p].groups.push(t);
  });
  // 每个项目内再按 group_name 聚合
  PROJECTS = Object.keys(map).map(function (k) {
    var prj = map[k], gmap = Object.create(null);
    prj.groups.forEach(function (t) {
      var g = t.group_name || t.name;
      if (!gmap[g]) gmap[g] = {name:g, icon:t.icon||'📄', sheets:[]};
      gmap[g].sheets.push(t);
    });
    var groups = Object.keys(gmap).map(function (g) {
      var grp = gmap[g];
      grp.sheets.sort(function (a, b) { return (a.sort - b.sort) || (a.id - b.id); });
      grp.sort = grp.sheets.length ? grp.sheets[0].sort : 999999;
      return grp;
    }).sort(function (a, b) { return a.sort - b.sort; });
    return {name: prj.name, icon: prj.icon, tableCount: prj.groups.length,
            analysis_role: prj.analysis_role || null, groups: groups};
  });
  // 同步当前项目引用，避免排序后侧栏仍读旧 PROJECTS 对象
  if (curProject) curProject = PROJECTS.find(function (p) { return p.name === curProject.name; }) || curProject;
  PROJECTS.forEach(function (p) { applyUserOrder(p.groups); });
}

  });

    b.onclick = function (e) { e.stopPropagation(); renameProject(b.getAttribute('data-ren-p')); };

function confirmDeleteProject(name) {
  if (!ME || ME.role !== 'admin') { toast('只有管理员可以删除项目'); return; }
  var p = null;
  for (var i = 0; i < PROJECTS.length; i++) if (PROJECTS[i].name === name) { p = PROJECTS[i]; break; }
  var n = 0;
  if (p && p.groups) p.groups.forEach(function (g) { n += (g.sheets || []).length; });
  appConfirm('删除项目',
    '删除项目「<b>' + esc(name) + '</b>」？'
    + (n ? '<br><span style="color:var(--text-3)">项目下 ' + n + ' 张表和全部行数据会一并删除。</span>'
         : '<br><span style="color:var(--text-3)">该项目暂无数据表。</span>'),
    '删除', true).then(function (ok) {
    if (!ok) return;
    if (DELETING_PROJECTS[name]) { toast('正在删除，请稍候…'); return; }
    DELETING_PROJECTS[name] = true;
    var busyTimer = setTimeout(function () {
      showBusy('正在删除项目「' + name + '」');
    }, 500);
    var finish = function () {
      clearTimeout(busyTimer);
      hideBusy();
      delete DELETING_PROJECTS[name];
    };
    api('/api/projects/' + encodeURIComponent(name), 'DELETE').then(function (res) {
      if (curProject && curProject.name === name) curProject = null;
      return refreshMeta().then(function () {
        goHomeProjects();
        toast('已删除项目：' + name + (res.deleted ? '（' + res.deleted + ' 张表）' : ''));
      });
    }).catch(function (e) {
      toast('删除失败：' + e.message);
    }).then(finish, finish);
  });
}

function renameProject(name) {
  if (!ME || ME.role !== 'admin') { toast('只有管理员可以重命名项目'); return; }
  modal('重命名项目',
    '<div class="frm"><label>项目名</label><input id="pj-new" value="' + esc(name) + '"></div>',
    '<button class="btn" id="pj-cancel">取消</button><button class="btn btn-primary" id="pj-ok">保存</button>',
    function () {
      $('pj-cancel').onclick = closeModal;
      var ipt = $('pj-new');
      ipt.focus(); ipt.select();
      function ok() {
        var v = ipt.value.trim();
        if (!v || v === name) { closeModal(); return; }
        api('/api/projects/' + encodeURIComponent(name), 'PATCH', { name: v }).then(function () {
          closeModal();
          toast('已重命名为 ' + v);
          refreshMeta().then(goHomeProjects);
        }).catch(function (e) { toast('重命名失败：' + e.message); });
      }
      $('pj-ok').onclick = ok;
      ipt.onkeydown = function (e) {
        if (e.key === 'Enter') ok();
        if (e.key === 'Escape') closeModal();
      };
    });
}

/* ---------- 第二层：项目内的表列表 ---------- */
var curProject = null;
/* 点项目 → 直接进第一张表；项目为空才显示「新建表」页 */
function enterProject(name) {
  var p = PROJECTS.find(function (x) { return x.name === name; });
  if (!p) return;
  curProject = p;
  var g = p.groups.find(function (x) { return x.sheets && x.sheets.length; });

function startRenameGroup(el, oldName) {
  if (el.querySelector('input')) return;
  var grp = (curProject ? curProject.groups : GROUPS).find(function (x) { return x.name === oldName; });
  if (!grp) return;
  if (!grp.sheets.every(function (s) { return s.my_role === 'editor'; })) {
    toast('只读权限，不能重命名分组');
    return;
  }
  el.classList.add('editing');
  el.innerHTML = '<input class="sb-rename-ipt">';
  var ipt = el.querySelector('input');
  ipt.value = oldName;
  ipt.focus();
  ipt.select();
  var done = false;
  async function save(ok) {
    if (done) return;
    done = true;
    var val = ipt.value.trim();
    if (ok && val && val !== oldName) {
      try {
        await api('/api/groups/rename', 'PATCH',
          { project: (curProject ? curProject.name : ''), old_name: oldName, new_name: val });
        grp.sheets.forEach(function (s) {
          var short = '';
          if (s.name.indexOf(oldName + '·') === 0) short = s.name.slice(oldName.length + 1);
          else if (s.name.indexOf('·') !== -1) short = s.name.split('·')[1];
          else if (s.name !== oldName) short = s.name;
          s.group_name = val;
          s.name = short ? val + '·' + short : val;
        });
        writeMetaCache(META);
        rebuildGroups(); rebuildProjects();
        if (curProject) curProject = PROJECTS.find(function (p) { return p.name === curProject.name; }) || curProject;
        renderSidebar(); renderSheetBar();
        var t = META.tables.find(function (x) { return x.id === state.tid; });
        if (t && $('tv-name')) setTvName(t, curGroupName(t) + ' · ' + (t.name.split('·')[1] || t.name));
        toast('已重命名为 ' + val);
        return;
      } catch (e) {
        toast('重命名失败：' + e.message);
      }
    }
    renderSidebar();
  }
  ipt.onkeydown = function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); save(true); }
    else if (e.key === 'Escape') { save(false); }
  };
  ipt.onblur = function () { if (!done) save(true); };
}

/* Sheet 页签「＋」：在当前分组里新建一个空 Sheet（复制当前列结构，不弹新建表框） */
var addSheetBusy = false;
async function addSheetToGroup() {
  var t = curTable(), g = curGroup();
  if (!t || !g || !g.name || addSheetBusy) return;
  addSheetBusy = true;
  var btn = $('sheet-add'); if (btn) btn.classList.add('busy');
  try {
    // 组内已有 SheetN 取最大编号 +1；全库重名再顺延
    var used = Object.create(null);
    META.tables.forEach(function (x) { used[x.name] = 1; });
    var maxN = 0;
    META.tables.forEach(function (x) {
      if ((x.group_name || x.name) !== g.name) return;
      var short = x.name.indexOf('·') >= 0 ? x.name.slice(x.name.indexOf('·') + 1) : x.name;
      var m = /^Sheet\s*(\d+)$/i.exec(short);
      if (m) maxN = Math.max(maxN, parseInt(m[1], 10));
    });
    var n = maxN + 1, short, full, guard = 0;
    do { short = 'Sheet' + n; full = g.name + '·' + short; n++; guard++; }
    while (used[full] && guard < 10000);

    // 复制当前 Sheet 的列（含选项/选项色/公式/宽度/必填/隐藏），不复制行
    var cols = (t.columns || []).map(function (c) {
      return { key: c.key, label: c.label, type: c.type, options: c.options,
               option_colors: c.option_colors, expr: c.expr, width: c.width,
               required: c.required, hidden: c.hidden };
    });
    var d = await api('/api/tables', 'POST', {
      name: full, project: t.project || (curProject && curProject.name) || '',
      group_name: g.name, icon: t.icon || '📄', columns: cols.length ? cols : null
    });
    if (!d || !d.id) throw new Error('未返回新表 ID');

    // 只拉元信息，不先重绘旧 Sheet，避免闪一下
    META = await api('/api/meta');
    writeMetaCache(META);
    invalidateRows();
    rebuildGroups(); rebuildProjects();
    openSheet(d.id);
    toast('已新增 Sheet：' + short);
  } catch (e) {
    toast('新增 Sheet 失败：' + e.message);
  } finally {
    addSheetBusy = false;
    var b = $('sheet-add'); if (b) b.classList.remove('busy');
  }
}

/* 删除当前 Sheet（页签右侧垃圾桶，admin） */
function confirmDeleteSheet() {
  if (!ME || ME.role !== 'admin') { toast('只有管理员可以删除 Sheet'); return; }
  var t = curTable();
  if (!t) return;
  appConfirm('删除 Sheet',
    '删除「<b>' + esc(t.name) + '</b>」？<br><span style="color:var(--text-3)">表内所有行会一并删除。</span>',
    '删除', true).then(function (ok) {
    if (!ok) return;
    api('/api/tables/' + t.id, 'DELETE').then(function () {
      var gname = (t.group_name || t.name);
      META.tables = META.tables.filter(function (x) { return x.id !== t.id; });
      writeMetaCache(META);
      invalidateRows();
      rebuildGroups(); rebuildProjects();
      if (curProject) curProject = PROJECTS.find(function (p) { return p.name === curProject.name; }) || curProject;
      toast('已删除 Sheet');
      // 组里还有别的 Sheet 就留在当前组，别把人踢回项目页
      var g = GROUPS.find(function (x) { return x.name === gname && x.sheets.length; });
      if (g) openSheet(g.sheets[0].id); else goProject();
    }).catch(function (e) { toast('删除失败：' + e.message); });
  });
}

/* 删除整个分组（侧栏分组右侧垃圾桶，admin）：组内所有 Sheet 一并删除 */
function confirmDeleteGroup(gname) {
  if (!ME || ME.role !== 'admin') { toast('只有管理员可以删除分组'); return; }
  var g = null;
  var scope = curProject ? curProject.groups : GROUPS;
  for (var i = 0; i < scope.length; i++) if (scope[i].name === gname) { g = scope[i]; break; }
  if (!g || !g.sheets || !g.sheets.length) return;
  var sheets = g.sheets.slice();
  appConfirm('删除分组',
    '删除分组「<b>' + esc(gname) + '</b>」？<br><span style="color:var(--text-3)">组内 '
    + sheets.length + ' 个 Sheet 和全部行数据会一并删除。</span>',
    '删除', true).then(function (ok) {
    if (!ok) return;
    (async function () {
      for (var j = 0; j < sheets.length; j++) {
        await api('/api/tables/' + sheets[j].id, 'DELETE');
      }
      var ids = sheets.map(function (s) { return s.id; });
      META.tables = META.tables.filter(function (x) { return ids.indexOf(x.id) === -1; });
      writeMetaCache(META);
      invalidateRows();
      rebuildGroups(); rebuildProjects();
      if (curProject) curProject = PROJECTS.find(function (p) { return p.name === curProject.name; }) || curProject;
      toast('已删除分组：' + gname);
      goProject();
    })().catch(function (e) { toast('删除失败：' + e.message); refreshMeta(); });
  });
}

/* 双击 Sheet 页签重命名：就地输入框，回车/失焦保存，Esc 取消 */
function startRenameTab(el) {
  if (el.querySelector('input')) return;
  var id = +el.getAttribute('data-id');
  var t = META.tables.find(function (x) { return x.id === id; });
  if (!t || t.my_role !== 'editor') { toast('只读权限，不能重命名'); return; }
  var old = t.name.split('·')[1] || t.name;
  var w = Math.round(el.getBoundingClientRect().width);
  el.classList.add('editing');
  el.style.width = Math.max(56, w) + 'px';
  el.innerHTML = '<input class="tab-ipt">';
  var ipt = el.querySelector('input');
  ipt.value = old; ipt.focus(); ipt.select();
  var done = false;
  async function save(ok) {
    if (done) return; done = true;
    var val = ipt.value.trim();
    if (ok && val && val !== old) {
      try {
        var res = await api('/api/tables/' + id + '/rename', 'PATCH', { short_name: val });
        var rec = META.tables.find(function (x) { return x.id === id; });
        if (rec) rec.name = res.name || rec.name;
        writeMetaCache(META);
        rebuildGroups(); rebuildProjects();
        if ($('tv-name') && state.tid === id) setTvName(rec, curGroupName(rec) + ' · ' + val);
        renderSidebar(); renderSheetBar();
        toast('已重命名为 ' + val);
        return;
      } catch (e) { toast('重命名失败：' + e.message); }
    }
    renderSheetBar();
  }
  ipt.onkeydown = function (e) {
    e.stopPropagation();
    if (e.key === 'Enter') { e.preventDefault(); save(true); }
    else if (e.key === 'Escape') save(false);
  };
  ipt.onblur = function () { if (!done) save(true); };
}

function openApiKeys() {
  var t = curTable();
  if (!t) return;
  var tid = t.id;
  var shortName = t.name.split('·').pop();
  var cols = (t.columns || []).filter(function (c) { return c.type !== 'formula'; });
  var sampleKey = cols.length ? cols[0].label : '列名';
  var sampleVal = '示例';
  if (cols.length) {
    var c0 = cols[0], o0 = c0.options && c0.options[0];
    if (o0 && typeof o0 === 'object') o0 = o0.label || o0.value || '';
    if (c0.type === 'number') sampleVal = 100;
    else if (c0.type === 'date') sampleVal = '2026-11-23';
    else if (c0.type === 'checkbox') sampleVal = true;
    else if (c0.type === 'select' && o0) sampleVal = o0;
    else if (c0.type === 'multiselect') sampleVal = o0 ? [o0] : [];
  }
  var sampleData = Object.create(null);
  sampleData[sampleKey] = sampleVal;
  var bodyText = '{"data":' + JSON.stringify(sampleData) + '}';

  modal('写入密钥 · ' + shortName,
    '<div class="ak-list" id="ak-list"><div class="ak-empty">加载中…</div></div>'
    + '<div class="ak-new"><input id="ak-note" maxlength="120" placeholder="备注（如：影刀到货机器人）">'
    + '<button class="btn btn-primary" id="ak-gen">生成密钥</button></div>'
    + '<div id="ak-secret"></div>',
    '<button class="btn" id="ak-close">关闭</button>',
    function () {
      $('ak-close').onclick = closeModal;
      $('ak-gen').onclick = gen;
      $('ak-note').onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); gen(); } };
      load();

      async function load() {
        try {
          var d = await api('/api/tables/' + tid + '/apikeys');
          renderList(d.rows || []);
        } catch (e) {
          $('ak-list').innerHTML = '<div class="ak-empty">加载失败：' + esc(e.message) + '</div>';
        }
      }

      function renderList(rows) {
        var box = $('ak-list');
        if (!rows.length) { box.innerHTML = '<div class="ak-empty">还没有密钥</div>'; return; }
        box.innerHTML = rows.map(function (k) {
          return '<div class="ak-item">'
            + '<code class="ak-prefix">' + esc(k.key_prefix) + '…</code>'
            + '<span class="ak-note">' + esc(k.note || '未备注') + '</span>'
            + '<span class="ak-meta">' + esc(k.created_by || '') + ' · ' + esc(k.created_at || '') + '</span>'
            + (k.revoked ? '<span class="ak-revoked">已作废</span>'
                         : '<button class="mini danger" data-kid="' + k.id + '">作废</button>')
            + '</div>';
        }).join('');
        box.querySelectorAll('[data-kid]').forEach(function (b) {
          b.onclick = async function () {
            var ok = await appConfirm('作废密钥', '作废后，使用该密钥的脚本将立即无法写入这张表。', '作废', true);
            if (!ok) return;
            try {
              await api('/api/tables/' + tid + '/apikeys/' + b.getAttribute('data-kid'), 'DELETE');
              toast('已作废'); load();
            } catch (e) { toast('作废失败：' + e.message); }
          };
        });
      }

      async function gen() {
        var btn = $('ak-gen');
        btn.disabled = true;
        try {
          var res = await api('/api/tables/' + tid + '/apikeys', 'POST', { note: $('ak-note').value.trim() });
          $('ak-note').value = '';
          showSecret(res.key);
          load();
        } catch (e) { toast('生成失败：' + e.message); }
        finally { btn.disabled = false; }
      }

      function showSecret(key) {
        var url = location.origin + '/api/in/' + tid;
        var curl = 'curl -X POST ' + url + ' \\\n'
          + '  -H "X-KB-Token: ' + key + '" \\\n'
          + '  -H "Content-Type: application/json" \\\n'
          + "  -d '" + bodyText + "'";
        $('ak-secret').innerHTML = '<div class="ak-secret">'
          + '<div class="ak-secret-head">新密钥只显示这一次，请立即复制</div>'
          + '<div class="ak-keyrow"><code>' + esc(key) + '</code>'
          + '<button class="btn" id="ak-copy-key">复制密钥</button></div>'
          + '<pre>' + esc(curl) + '</pre>'
          + '<div style="margin-top:8px"><button class="btn" id="ak-copy-curl">复制命令</button></div>'
          + '</div>';
        $('ak-copy-key').onclick = function () { copyText(key); };
        $('ak-copy-curl').onclick = function () { copyText(curl); };
      }
    });
}

function copyText(txt) {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制'); }
    catch (e) { toast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast('已复制'); }, fallback);
  } else fallback();
}

/* 站内确认框（替代原生 confirm）：可叠加在已有弹窗上，返回 Promise<boolean> */
function appConfirm(title, messageHtml, okText, danger) {
  return new Promise(function (resolve) {
    var root = $('confirm-root');
    root.innerHTML = '<div class="mask" id="cf-mask"><div class="box cf-box">'
      + '<div class="box-head"><h3>' + esc(title) + '</h3></div>'
      + '<div class="box-body"><div class="cf-msg">' + messageHtml + '</div></div>'
      + '<div class="box-foot"><button class="btn" id="cf-cancel">取消</button>'
      + '<button class="btn ' + (danger ? 'btn-danger' : 'btn-primary') + '" id="cf-ok">'
      + esc(okText || '确定') + '</button></div></div></div>';
    function done(v) {
      document.removeEventListener('keydown', onKey);
      root.innerHTML = '';
      resolve(v);
    }
    function onKey(e) { if (e.key === 'Escape') done(false); }
    document.addEventListener('keydown', onKey);
    $('cf-cancel').onclick = function () { done(false); };
    $('cf-ok').onclick = function () { done(true); };
    $('cf-mask').onclick = function (e) { if (e.target === $('cf-mask')) done(false); };
  });
}

/* ============ 汇总同步（子表 → 总表 单向复制） ============ */
var SYNC_TTYPES = ['text', 'number', 'date', 'select', 'multiselect', 'checkbox'];

function openSyncMgr() {
  var t = curTable();
  if (!t) return;
  if (!(ME && ME.role === 'admin')) { toast('需要管理员权限'); return; }
  var timer = null;
  var short = t.name.split('·')[1] || t.name;
  var body = '<div class="sync-sec" style="margin-top:0">已配置的汇总规则</div>'
    + '<div id="sync-rules"><div class="sync-empty">加载中…</div></div>'
    + '<div class="sync-sec">新增 / 修改汇总规则</div>'
    + '<div class="sync-form">'
    + '<div class="sync-form-head"><span style="font-size:13px;color:var(--text-2);flex:none">子表</span><select id="sync-src"></select></div>'
    + '<div class="sync-map" id="sync-map"><div class="sync-empty">先选择子表</div></div>'
    + '<div class="sync-foot"><button class="btn" id="sync-cancel">关闭</button>'
    + '<button class="btn btn-primary" id="sync-save">保存并同步</button></div></div>';
  modal('汇总同步 · ' + short, body, '', function (root) {
    var boxEl = root.querySelector('.box'); if (boxEl) boxEl.classList.add('sync-box');
    function sourceTables() {
      return META.tables.filter(function (x) {
        return x.id !== t.id && (x.project || '') === (t.project || '');
      });
    }
    function srcTable(id) {
      return META.tables.find(function (x) { return x.id === +id; });
    }
    function buildMap(srcTid, preset) {
      var src = srcTable(srcTid);
      var mapEl = $('sync-map');
      if (!src) { mapEl.innerHTML = '<div class="sync-empty">先选择子表</div>'; return; }
      var tcols = t.columns.filter(function (c) {
        return !c.hidden && SYNC_TTYPES.indexOf(c.type) !== -1;
      });
      var scols = src.columns.filter(function (c) {
        return c.type !== 'formula' && c.type !== 'image';
      });
      preset = preset || {};
      var h = '';
      tcols.forEach(function (c) {
        var opts = '<option value="">忽略</option><option value="$source_table">来源表名（自动）</option>'
          + scols.map(function (s) {
              return '<option value="' + esc(s.key) + '">' + esc(s.label) + '</option>';
            }).join('');
        h += '<div class="sync-map-row"><span class="tc" title="' + esc(c.label) + '">' + esc(c.label)
          + '<span class="tt">' + esc(TYPE_LABEL[c.type] || c.type) + '</span></span>'
          + '<select data-tk="' + esc(c.key) + '">' + opts + '</select></div>';
      });
      mapEl.innerHTML = h || '<div class="sync-empty">总表还没有可汇总的字段（文本/数字/日期/单选/多选/勾选）</div>';
      // 自动按同名字段匹配，已有规则按保存的映射回填
      mapEl.querySelectorAll('select[data-tk]').forEach(function (sel) {
        var tk = sel.getAttribute('data-tk');
        var want = preset[tk];
        if (!want) {
          var tc = tcols.find(function (x) { return x.key === tk; });
          var hit = scols.find(function (x) { return x.label === tc.label || x.key === tc.key; });
          if (hit) want = hit.key;
          else if (tc.type === 'text' && /来源|子表/.test(tc.label)) want = '$source_table';
        }
        sel.value = want || '';
      });
      enhanceSelects(mapEl);
    }
    function collect() {
      var out = Object.create(null);
      $('sync-map').querySelectorAll('select[data-tk]').forEach(function (s) {
        if (s.value) out[s.getAttribute('data-tk')] = s.value;
      });
      return out;
    }
    function selectSource(id, preset) {
      var sel = $('sync-src');
      var v = String(id || '');
      if (![...sel.options].some(function (o) { return o.value === v; })) return;
      sel.value = v;
      buildMap(v, preset);
    }
    function paintRules() {
      var el = $('sync-rules'); if (!el) return;
      if (!RULES.length) { el.innerHTML = '<div class="sync-empty">还没有汇总规则</div>'; return; }
      el.innerHTML = RULES.map(function (r) {
        var job = r.job || {};
        var status;
        if (job.status === 'queued') {
          status = '排队中…';
        } else if (job.status === 'running') {
          status = '同步中 ' + (job.done || 0) + ' / ' + (job.total || 0);
        } else if (job.status === 'error' || r.last_error) {
          status = '<span class="err">' + esc(job.error || r.last_error) + '</span>';
        } else if (r.last_sync_at) {
          status = '上次同步 ' + esc(r.last_sync_at) + ' · 已复制 ' + r.copied_count + ' 行';
        } else {
          status = '未同步';
        }
        return '<div class="sync-rule"><div class="sync-rule-top">'
          + '<span class="sync-rule-name" title="' + esc(r.source_name) + '">' + esc(r.source_name) + '</span>'
          + '<span class="sync-rule-acts">'
          + '<button class="mini" data-act="edit" data-id="' + r.id + '">映射</button>'
          + '<button class="mini" data-act="run" data-id="' + r.id + '">立即同步</button>'
          + '<button class="mini" data-act="toggle" data-id="' + r.id + '">' + (r.enabled ? '停用' : '启用') + '</button>'
          + '<button class="mini danger" data-act="del" data-id="' + r.id + '">删除</button>'
          + '</span></div>'
          + '<div class="sync-rule-meta">子表 ' + r.source_count + ' 行 · ' + status + '</div></div>';
      }).join('');
      el.querySelectorAll('[data-act]').forEach(function (b) {
        b.onclick = function () {
          var id = +b.getAttribute('data-id');
          var r = RULES.find(function (x) { return x.id === id; });
          if (!r) return;
          if (b.getAttribute('data-act') === 'edit') {
            selectSource(r.source_tid, r.mapping);
          } else if (b.getAttribute('data-act') === 'run') {
            api('/api/sync/' + id + '/run', 'POST', {}).then(function () { loadRules(); })
              .catch(function (e) { toast('同步失败：' + e.message); });
          } else if (b.getAttribute('data-act') === 'toggle') {
            api('/api/sync/' + id, 'PATCH', { enabled: !r.enabled }).then(function () { loadRules(); })
              .catch(function (e) { toast('保存失败：' + e.message); });
          } else if (b.getAttribute('data-act') === 'del') {
            appConfirm('删除汇总规则？', '会停止后续同步，并删除已经从「' + esc(r.source_name) + '」复制到总表的行。', '删除', true)
              .then(function (ok) {
                if (!ok) return;
                api('/api/sync/' + id, 'DELETE').then(function () { toast('已删除汇总规则'); loadRules(); })
                  .catch(function (e) { toast('删除失败：' + e.message); });
              });
          }
        };
      });
    }
    var RULES = [];
    function loadRules() {
      if (!$('sync-rules')) return;
      api('/api/sync?target_tid=' + t.id).then(function (d) {
        if (!$('sync-rules')) return;
        RULES = d.rules || [];
        paintRules();
        var running = RULES.some(function (r) { return r.job && (r.job.status === 'running' || r.job.status === 'queued'); });
        clearTimeout(timer);
        if (running) timer = setTimeout(loadRules, 900);
      }).catch(function (e) {
        if ($('sync-rules')) $('sync-rules').innerHTML = '<div class="sync-empty">读取失败：' + esc(e.message) + '</div>';
      });
    }
    var srcs = sourceTables();
    var srcSel = $('sync-src');
    if (!srcs.length) {
      srcSel.innerHTML = '<option value="">（同项目还没有其他表）</option>';
      srcSel.disabled = true;
      $('sync-save').disabled = true;
    } else {
      srcSel.innerHTML = srcs.map(function (s) {
        return '<option value="' + s.id + '">' + esc(s.name) + '</option>';
      }).join('');
      srcSel.onchange = function () { buildMap(+this.value); };
      selectSource(srcs[0].id);
    }
    $('sync-cancel').onclick = closeModal;
    $('sync-save').onclick = function () {
      var srcTid = +srcSel.value;
      if (!srcTid) { toast('先选择子表'); return; }
      var mapping = collect();
      if (!Object.keys(mapping).length) { toast('至少映射一个字段'); return; }
      var btn = this; btn.disabled = true;
      api('/api/sync', 'POST', { target_tid: t.id, source_tid: srcTid, mapping: mapping })
        .then(function () { toast('已开始汇总，总表会自动更新'); btn.disabled = false; loadRules(); })
        .catch(function (e) { toast('保存失败：' + e.message); btn.disabled = false; });
    };
    loadRules();
  });
}

function openFieldMgr() {

    + '<div id="fm-list">'+rows+'</div>'
    + '<div style="margin-top:10px"><button class="btn btn-primary" id="fm-add">＋ 新增字段</button></div>',
    '<span style="flex:1;font-size:var(--fs-xs);color:var(--text-3)" id="fm-sum"></span>'
    + '<button class="btn" id="fm-cancel">关闭</button><button class="btn btn-primary" id="fm-ok">保存</button>',
    function(root){
      var boxEl=document.querySelector('#modal-root .box'); if(boxEl) boxEl.classList.add('wide');
      function sum(){ $('fm-sum').textContent='显示 '+$('fm-list').querySelectorAll('.fm-row input:checked').length+' / '+$('fm-list').querySelectorAll('.fm-row').length+' 列'; }
      function syncUd(){
        var all=[...$('fm-list').querySelectorAll('.fm-row')];
        all.forEach(function(r,k){
          r.setAttribute('data-i',k);
          r.querySelector('[data-ud="-1"]').disabled = (k===0);
          r.querySelector('[data-ud="1"]').disabled = (k===all.length-1);
        });
      }
      function bindRow(row){
        row.querySelector('input').onchange=function(){ row.classList.toggle('off',!this.checked); sum(); };
        row.querySelectorAll('[data-ud]').forEach(function(b){ b.onclick=function(){
          var all=[...$('fm-list').querySelectorAll('.fm-row')], i=+row.getAttribute('data-i'), j=i+ +b.getAttribute('data-ud');
          if(j<0||j>=all.length) return;
          var body=$('fm-list');
          if(+b.getAttribute('data-ud')===-1) body.insertBefore(row,all[j]); else body.insertBefore(all[j],row);
          syncUd();
        };});
        row.querySelector('[data-edit]').onclick=function(){ openColumnEdit(+row.getAttribute('data-id')); };
        row.querySelector('[data-del]').onclick=async function(){
          var cid=+row.getAttribute('data-id');
          var c=t.columns.find(function(x){return x.id===cid;});
          // 警告：有公式列引用了这一列
          var refs=t.columns.filter(function(x){
            return x.type==='formula' && x.expr &&
              (x.expr.indexOf('{'+c.key+'}')!==-1 || x.expr.indexOf('{'+c.label+'}')!==-1);
          });
          var refHtml=refs.length
            ? '<br><div style="margin-top:8px;padding:8px 10px;background:var(--bg-orange);border-radius:7px;font-size:12px;color:var(--text-2)">'
              + '<b style="font-weight:400;color:var(--orange)">注意</b>：'+refs.length+' 个公式列引用了这一列（'
              + esc(refs.map(function(x){return x.label;}).join('、'))
              + '），删除后这些公式将取不到值。</div>'
            : '';
          var ok=await appConfirm('删除列',
            '删除列「<b>'+esc(c.label)+'</b>」？<br><span style="color:var(--text-3)">该列所有数据会一并清除，不可恢复。</span>'+refHtml,
            '删除', true);
          if(!ok) return;
          try {
            await api('/api/tables/'+t.id+'/columns/'+cid,'DELETE');
            // 本地直接摘掉这一列：不关字段管理弹窗、不整表重拉，避免删一个字段闪一下
            var hadFilter = !!state.filters[c.key];
            var hadSort = state.sort === c.key;
            t.columns = t.columns.filter(function(x){return x.id!==cid;});
            delete state.filters[c.key];
            if(state.sort===c.key){ state.sort=''; state.dir=1; }
            writeMetaCache(META);
            invalidateRows();
            renderHead();
            document.querySelectorAll('#tbody td[data-f="'+CSS.escape(c.key)+'"]').forEach(function(td){ td.remove(); });
            row.remove();
            syncUd(); sum();
            closeFilterPop();
            if (refs.length || hadFilter || hadSort) {
              state.page = 1;
              await loadRows();          // 只有公式引用/筛选/排序受影响时才重拉当前页
            }
            toast('已删除列：'+c.label);
          }
          catch(e){ toast('删除失败：'+e.message); }
        };
      }
      $('fm-list').querySelectorAll('.fm-row').forEach(bindRow); syncUd(); sum();
      $('fm-cancel').onclick=closeModal;
      $('fm-add').onclick=function(){ openColumnEdit(null); };
      $('fm-ok').onclick=async function(){
        var order=[], hidden=[];
        $('fm-list').querySelectorAll('.fm-row').forEach(function(row){
          var cid=+row.getAttribute('data-id'); order.push(cid);
          if(!row.querySelector('input').checked) hidden.push(cid);
        });
        try { await api('/api/tables/'+t.id+'/columns/sort','POST',{order:order,hidden:hidden});
              closeModal(); closeFilterPop(); state.page=1; await refreshMeta(t.id); toast('字段已保存'); }
        catch(e){ toast('保存失败：'+e.message); }
      };
    });
}

    + '<select id="xt-local" title="本表的匹配字段"></select>'
    + '<select id="xt-take" title="对方表的取值字段"></select>'
    + '<select id="xt-fn"><option value="LOOKUP">第一项</option><option value="SUMIF">求和</option>'
    + '<option value="COUNTIF">计数</option><option value="AVGIF">平均</option>'
    + '<option value="MAXIF">最大</option><option value="MINIF">最小</option></select>'

    + '<div class="frm" id="ce-opts-wrap" style="display:none"><label>选项</label>'
    + '<div id="ce-opt-rows"></div>'

    '<button class="btn" id="ce-cancel">取消</button><button class="btn btn-primary" id="ce-ok">保存</button>',
    function(){
      var optBox = $('ce-opt-rows');
      function paintColor(sel){

          sel.style.color = cs.color;

      function addOptRow(label, color) {
        var row = document.createElement('div');

        row.innerHTML = '<input class="opt-name" placeholder="选项名" value="' + esc(label || '') + '">'

      }
      var initOpts = (c && Array.isArray(c.options)) ? c.options : [];
      var initColors = (c && c.option_colors) || {};
      initOpts.forEach(function (o) { addOptRow(o, initColors[o]); });
      if (!initOpts.length) addOptRow('', null);
      $('ce-opt-add').onclick = function () { addOptRow('', null); };

      function sync(){
        var ty = $('ce-type').value;

      $('ce-type').onchange=sync; sync();
      $('ce-expr').oninput=preview;
      $('ce-expr-wrap').querySelectorAll('.chip-ins').forEach(function(ch){ ch.onclick=function(){
        var ta=$('ce-expr'); var p=ta.selectionStart, v=ch.getAttribute('data-ins');
        ta.value=ta.value.slice(0,p)+v+ta.value.slice(p); ta.focus(); ta.selectionStart=p+v.length; preview();
      };});
      var timer=null;
      function preview(){
        clearTimeout(timer);
        timer=setTimeout(async function(){
          var expr=$('ce-expr').value.trim(); var box=$('ce-preview');
          if(!expr){ box.textContent='试算结果将显示在这里'; box.classList.remove('err'); return; }
          // 取当前表第一行做试算
          var row={}; t.columns.forEach(function(x){ row[x.label]=1; row[x.key]=1; });
          try {
            var r=await api('/api/formula/eval','POST',{expr:expr,row:row,tid:t.id});
            if(r.ok) box.textContent='= '+String(r.value);
            else { box.textContent=r.error; box.classList.add('err'); }

      }
      // ---- 跨表引用构建器 ----
      var otherTabs = META.tables.filter(function(x){ return x.id!==t.id && (x.project||'')===(t.project||''); });

      var curLabels = t.columns.map(function(c){return c.label;});

      function refreshXt(){
        var tg=xtTarget();
        if(!tg){ $('xt-match').innerHTML=''; $('xt-take').innerHTML=''; $('xt-hint').textContent=''; return; }
        var tl=tg.columns.map(function(c){return c.label;});

        $('xt-take').innerHTML=tl.map(function(l){return '<option>'+esc(l)+'</option>';}).join('');
        $('xt-local').innerHTML=curLabels.map(function(l){return '<option>'+esc(l)+'</option>';}).join('');
        // 有同名字段就默认选同名，否则按「昵称/名称」猜一对
        var guess = common[0] || curLabels.find(function(l){return /昵称|名称|达人/.test(l);});
        if(guess){
          var mi=curLabels.indexOf(guess), ti=tl.indexOf(guess);
          if(ti!==-1) $('xt-match').value=guess;
          if(mi!==-1) $('xt-local').value=guess;
          else { var li=$('xt-local').options[0]; if(li) $('xt-local').value=li.value; }
        }
        syncXtHint();
      }
      function syncXtHint(){
        $('xt-hint').textContent = '按 对方「'+$('xt-match').value+'」= 本表「{'+$('xt-local').value+'}」匹配';
      }
      xsel.onchange=refreshXt;
      $('xt-match').onchange=syncXtHint; $('xt-local').onchange=syncXtHint;
      refreshXt();
      $('xt-insert').onclick=function(){
        var tg=xtTarget(); if(!tg){ toast('先选一张表'); return; }
        var m=$('xt-match').value, lf=$('xt-local').value, tk=$('xt-take').value, fn=$('xt-fn').value;
        if(!m || !lf){ toast('先选匹配字段'); return; }
        var code = (fn==='COUNTIF')
          ? 'COUNTIF("'+tg.name+'","'+m+'",{'+lf+'})'
          : fn+'("'+tg.name+'","'+m+'",{'+lf+'},"'+tk+'")';
        var ta=$('ce-expr'), pos=ta.selectionStart||ta.value.length;
        ta.value = ta.value.slice(0,pos)+code+ta.value.slice(pos);
        ta.focus(); ta.selectionStart=ta.selectionEnd=pos+code.length;
        preview();
      };
      $('ce-cancel').onclick=function(){ openFieldMgr(); };
      $('ce-ok').onclick=async function(){
        var labels=[], colors=Object.create(null);
        optBox.querySelectorAll('.opt-row').forEach(function(row){

        // 改列时带上原有的必填/隐藏：编辑器里没有这两个开关，不带会被接口当成“取消”
        var body={ label:$('ce-label').value.trim(), type:$('ce-type').value,

        var et=$('ce-type').value;
        if(et==='select'||et==='multiselect'){
          body.options=labels.length?labels:null;

        }

        if(!body.label){ toast('请填字段名'); return; }
        try {

          else await api('/api/tables/'+t.id+'/columns','POST',body);

        } catch(e){ toast('保存失败：'+e.message); }
      };
    });
}

async function refreshMeta(selectTid) {
  META = await api('/api/meta');
  writeMetaCache(META);
  invalidateRows();
  rebuildGroups(); rebuildProjects();
  if (selectTid) state.tid = selectTid;
  if (!META.tables.some(function(t){return t.id===state.tid;})) {
    state.tid = (GROUPS[0] && GROUPS[0].sheets[0]) ? GROUPS[0].sheets[0].id : null;
  }
  if ($('table-view').classList.contains('on') && state.tid) {
    var t = META.tables.find(function (x) { return x.id === state.tid; });
    if ($('tv-name')) setTvName(t, t ? curGroupName(t) + ' · ' + (t.name.split('·')[1] || t.name) : '');
    // 项目/组可能变了，重建当前项目引用
    curProject = PROJECTS.find(function (p) {
      return p.groups.some(function (g) { return g.sheets.some(function (s) { return s.id === state.tid; }); });
    }) || curProject;
    renderAll();
  } else {
    renderAll();
  }
}

/* ============ 列宽 ============ */
function colWStore(){ try{return JSON.parse(localStorage.getItem('kb_colw')||'{}');}catch(e){return {};} }
function defW(c){
  var byLabel=84+String(c.label||'').length*14;
  var base=c.width|| (c.type==='number'||c.type==='formula'?100:Math.min(240,Math.max(120,byLabel)));
  return Math.min(260,Math.max(96,base,byLabel));
}
function renderColgroup(){
  var t=curTable(); var html='<col style="width:72px">';
  curCols().forEach(function(c){ var s=colWStore()[t.id+'|'+c.key]; html+='<col data-c="'+esc(c.key)+'" style="width:'+Math.max(96,(s||defW(c)))+'px">'; });
  html+='<col style="width:'+(canEditRows()?56:40)+'px">';
  $('colgroup').innerHTML=html;
}

/* ============ 表头 ============ */
function filterActive(k){
  var f=state.filters[k]; if(!f) return false;
  if(Array.isArray(f)) return f.length>0;
  if(f.op) return f.op==='between' ? !!(f.value||f.value2) : !(f.value===undefined||f.value===''||f.value===null);
  return !!(f.from||f.to);
}
function hasAnyFilter(){
  if (isAdvFilter(state.filters)) return state.filters.conds.length > 0;
  return Object.keys(state.filters).some(filterActive);
}
function isAdvFilter(f){ return !!(f && typeof f === 'object' && !Array.isArray(f) && Array.isArray(f.conds)); }
/* 高级筛选用到哪几列：这些列头的漏斗也点亮，一眼看出筛的是哪几列 */
function advFilterKeys(){ return isAdvFilter(state.filters) ? state.filters.conds.map(function(c){ return c && c.key; }) : []; }
function viewDirty(){ return !!(state.kw || state.sort || hasAnyFilter()); }
/* 「重置」只在这种情况下出现：这一张表被你搜索/筛选/排序过。
   这些都是你自己的视图状态（存在你账号的本地视图里、随请求参数走），不会改动别人的界面。 */
function updateViewChrome(){
  var b=$('btn-reset'); if(b) b.style.display=viewDirty()?'':'none';
  updateViewBtn();
}
function resetView(){
  if(openFilter) closeFilterPop();
  state.kw=''; state.sort=''; state.dir=1; state.filters=Object.create(null); state.page=1;
  var kw=$('kw'); if(kw) kw.value='';
  renderHead(); loadRows(); updateViewChrome();
  toast('已恢复默认视图：搜索、筛选、排序都清掉了');
}

/* ============ 常用视图：把「搜索 + 筛选 + 排序」存成命名视图，一键切换 ============
   和筛选本身一样只存在本机（按账号），不写数据库；每张表各存各的。 */
var VIEWS_KEY = 'kb_views_v1';
function readAllViews(){ try{ var o=JSON.parse(localStorage.getItem(VIEWS_KEY)||'{}'); return (o&&typeof o==='object'&&!Array.isArray(o))?o:{}; }catch(e){ return {}; } }
function writeAllViews(o){ try{ localStorage.setItem(VIEWS_KEY, JSON.stringify(o)); }catch(e){} }
function tableViews(){ var a=readAllViews()[String(state.tid)]; return Array.isArray(a)?a:[]; }
function saveTableViews(list){ var all=readAllViews(); all[String(state.tid)]=list; writeAllViews(all); }
function currentViewCore(){ return {kw:state.kw||'', sort:state.sort||'', dir:state.dir||1, filters:state.filters||{}}; }
function viewCoreKey(core){
  var f=core.filters||{}, ks=Object.keys(f).sort(), o=Object.create(null);
  ks.forEach(function(k){ o[k]=f[k]; });
  return JSON.stringify({kw:core.kw||'', sort:core.sort||'', dir:core.dir||1, filters:o});
}
function findActiveView(){
  var cur=viewCoreKey(currentViewCore());
  return tableViews().find(function(v){ return viewCoreKey(v)===cur; }) || null;
}
function updateViewBtn(){
  var b=$('btn-view'); if(!b) return;
  var v=findActiveView();
  var lbl=b.querySelector('span'); if(lbl) lbl.textContent=v?v.name:'视图';
  b.classList.toggle('on', !!v);
  b.title=v ? ('当前视图：'+v.name+'（只存本机）') : '常用视图：把当前的搜索/筛选/排序存下来一键切换（只存本机）';
}
/* 视图里引用的列可能已经被删掉：应用时把这些条件丢掉，免得整张表被筛成空 */
function sanitizeViewCore(core){
  var keys=Object.create(null); (curTable().columns||[]).forEach(function(c){ keys[c.key]=1; });
  var f=Object.create(null);
  if (isAdvFilter(core.filters)) {
    var conds = core.filters.conds.filter(function(c){ return c && keys[c.key]; });
    if (conds.length) f = { logic: core.filters.logic === 'or' ? 'or' : 'and', conds: conds };
  } else {
    Object.keys(core.filters||{}).forEach(function(k){ if(keys[k]) f[k]=core.filters[k]; });
  }
  return {kw:core.kw||'', sort:keys[core.sort]?core.sort:'', dir:core.dir||1, filters:f};
}
function applyView(v){
  var core=sanitizeViewCore(v);
  if(openFilter) closeFilterPop();
  state.kw=core.kw; state.sort=core.sort; state.dir=core.dir; state.filters=core.filters; state.page=1;
  var kw=$('kw'); if(kw) kw.value=state.kw;
  renderHead(); loadRows(); updateViewChrome();
  toast('已切换到视图「'+v.name+'」');
}
function deleteView(id){
  saveTableViews(tableViews().filter(function(v){ return v.id!==id; }));
  updateViewBtn(); toast('已删除视图');
}
function saveCurrentView(){
  if(!viewDirty()){ toast('当前没有搜索/筛选/排序，不用保存视图'); return; }
  var n=tableViews().length+1;
  modal('保存为常用视图',
    '<div class="frm"><label>视图名称</label><input id="vw-name" placeholder="例如：只看进行中 / 本周待发布" value="视图 '+n+'"></div>'
    + '<div class="hint">只保存当前的搜索词、筛选条件和排序，存在本机（只影响你自己）。同名会覆盖。</div>',
    '<button class="btn" id="vw-cancel">取消</button><button class="btn btn-primary" id="vw-ok">保存</button>',
    function(){
      $('vw-cancel').onclick=closeModal;
      $('vw-name').focus(); $('vw-name').select();
      $('vw-name').onkeydown=function(e){ if(e.key==='Enter') $('vw-ok').click(); };
      $('vw-ok').onclick=function(){
        var name=$('vw-name').value.trim();
        if(!name){ toast('请填写视图名称'); return; }
        var core=currentViewCore();
        var list=tableViews().filter(function(v){ return v.name!==name; });
        list.push({id:'v'+Date.now(), name:name, kw:core.kw, sort:core.sort, dir:core.dir, filters:core.filters});
        saveTableViews(list);
        closeModal(); updateViewBtn();
        toast('已保存视图「'+name+'」');
      };
    });
}
function closeViewMenu(){ var m=$('view-menu'); if(m) m.remove(); }
function openViewMenu(){
  var b=$('btn-view'); if(!b) return;
  closeViewMenu();
  var r=b.getBoundingClientRect(), list=tableViews(), active=findActiveView();
  var m=document.createElement('div'); m.className='ctx-menu view-menu'; m.id='view-menu';
  var html='<button type="button" class="ctx-item" data-act="default"><span>默认视图（清除搜索/筛选/排序）</span></button>';
  if(list.length){
    html+='<div class="ctx-sep"></div>';
    list.forEach(function(v){
      html+='<button type="button" class="ctx-item" data-vid="'+esc(v.id)+'"><span>'+esc(v.name)+'</span>'
        + (active&&active.id===v.id?'<span class="vw-check">✓</span>':'')
        + '<span class="vw-del" data-del="'+esc(v.id)+'" title="删除视图">×</span></button>';

/* 列级显示格式：日期 / 数字精度 / 千分位 / 百分比。
   存在 kb_column.options.display_format 里，不改变原始存储值。 */
function displayFormat(c,v){
  if(v===null||v===undefined||v==='') return v;
  var opts=c&&c.options;
  var df=(opts&&!Array.isArray(opts))?opts.display_format:null;
  if(!df) return v;
  if(df.kind==='date'){
    var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v));
    if(!m) return v;
    var p=df.pattern||'YYYY-MM-DD';
    return p.replace(/YYYY/g,m[1]).replace(/MM/g,m[2]).replace(/DD/g,m[3]);
  }
  if(df.kind==='number'){
    var n=Number(v);
    if(!isFinite(n)) return v;
    if(df.percent) n*=100;
    var prec=Math.max(0,Math.min(6,parseInt(df.precision,10)||0));
    var s=n.toFixed(prec);
    if(df.thousand){
      var parts=s.split('.');
      parts[0]=parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',');
      s=parts.join('.');
    }
    if(df.percent) s+='%';
    return s;
  }
  return v;
}
/* 防御性：历史数据/旧接口里偶尔会把 {url,name,...} 原样塞进文本列。
   表格里只显示人能读的 name/url/text，不再把 JSON 大括号甩给用户。 */
function readJsonCell(v){
  if(typeof v!=='string') return v;
  var s=v.trim();
  if(!s || (s[0]!=='{' && s[0]!=='[')) return v;
  try {
    var o=JSON.parse(s);
    function flat(x, depth){
      if(x===null||x===undefined) return '';
      if(typeof x==='string'){
        var t=x.trim();
        if(t && (t[0]==='{'||t[0]==='[')){
          try{ return flat(JSON.parse(t),depth+1); }catch(e){}
        }
        return x;
      }
      if(typeof x!=='object') return String(x);
      if(depth>4) return '';
      if(Array.isArray(x)) return x.map(function(y){return flat(y,depth+1);}).filter(Boolean).join('、');
      var keys=['name','label','text','url','value','title','nick','identifier'];
      for(var i=0;i<keys.length;i++){ if(x[keys[i]]!==undefined && x[keys[i]]!==null && String(x[keys[i]]).trim()!=='') return String(x[keys[i]]); }
      if(x.data!==undefined) { var d=flat(x.data,depth+1); if(d) return d; }
      var vals=[];
      Object.keys(x).forEach(function(k){ var z=flat(x[k],depth+1); if(z) vals.push(z); });
      return vals.slice(0,3).join(' ');
    }
    var out=flat(o,0);
    return out || '—';
  } catch(e){ return v; }
}
function cellHtml(v,c){
  if(v===null||v===undefined||v===''||(Array.isArray(v)&&!v.length)) return '<span class="cell-empty">—</span>';
  if(c.type==='text') v=readJsonCell(v);
  if(c.type==='number'||c.type==='date'||c.type==='formula'||c.type==='text') v=displayFormat(c,v);
  var s=String(v);
  if(c.type==='checkbox') return '<span class="tag '+(v?'tag-green':'tag-gray')+'">'+(v?'✓ 是':'否')+'</span>';
  if(c.type==='select') return '<span class="tag '+tagFor(s,c)+'">'+esc(s)+'</span>';
  if(c.type==='multiselect') return (Array.isArray(v)?v:[v]).map(function(x){return '<span class="tag '+tagFor(x,c)+'">'+esc(x)+'</span>';}).join(' ');
  if(c.type==='image'){
    if(/^(https?:\/\/|\/api\/tables\/)/i.test(s)) return '<img class="cell-img" src="'+esc(s)+'" loading="lazy" alt="" title="双击修改图片">';
    return esc(s);
  }
  if(/^https?:\/\//i.test(s)) return '<a class="cell-link" href="'+esc(s)+'" target="_blank" title="'+esc(s)+'">'+esc(s)+'</a>';
  return esc(s);
}
/* 行数据本地缓存：切 Sheet / 切表先用上次结果秒开，再后台对齐。
   结构变更清空全部，行变更只清对应的那张表（见 invalidateRows）；最多保留 ROWS_CACHE_MAX 份。 */
var ROWS_CACHE = {}, rowsSeq = 0;

function rowsKey(tid, page, kw, sort, dir, filters, size) {
  return tid + '|' + (size === undefined ? state.size : size) + '|' + page + '|' + kw + '|' + sort + '|' + dir + '|' + JSON.stringify(filters || {});
}
function curRowsKey(tid) {
  return rowsKey(tid, state.page, state.kw, state.sort, state.dir, state.filters, state.size);
}
var ROWS_CACHE_MAX = 30;   // 同组各 Sheet 的第 1 页 + 一些翻页/筛选结果
function rowsCachePut(key, d) {
  delete ROWS_CACHE[key];              // 先删再放：最近用过的排在最后，淘汰时从最旧的开始
  ROWS_CACHE[key] = d;
  var ks = Object.keys(ROWS_CACHE);
  for (var i = 0; i < ks.length - ROWS_CACHE_MAX; i++) delete ROWS_CACHE[ks[i]];
}
/* 行缓存失效：结构变了（建表 / 删表 / 改列 / 改名）清全部；
   只是某一张表的行变了，就只清这一张的 —— 同组其它 Sheet 预取好的数据照样能用。 */
function invalidateRows(tid) {
  if (tid === undefined || tid === null) { ROWS_CACHE = {}; return; }
  var pre = tid + '|';
  Object.keys(ROWS_CACHE).forEach(function (k) { if (k.lastIndexOf(pre, 0) === 0) delete ROWS_CACHE[k]; });
}

var ROWDATA = {};
var GRID = null, GRID_RAF = 0;

/* 大页只渲染可视窗口：300 行 × 29 列不再一次性塞 8700 个单元格。

function gridRowH() {

}
function gridRowHtml(r, gi, cols, canEdit) {

    + (canEdit ? '<button class="row-del" data-del-row="' + r.id + '" title="删除此行" aria-label="删除此行"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg></button>' : '')

function drawGridWindow(force) {

function onGridScroll() {

function gridRowIndex(rid) {

  return -1;
}

/* 键盘习惯（表格软件里通用的那一套）：单击选中一格之后
   Enter / F2 进入编辑；直接打字就用这个字开始改；
   ← → 左右移动；Esc 取消选中。Tab 在编辑框里是“提交并跳到右边一格”。 */
document.addEventListener('keydown', function (e) {
  if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey || e.isComposing || e.key === 'Process') return;
  var el = document.activeElement, tag = el && el.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || tag === 'BUTTON' || tag === 'A'
      || (el && el.isContentEditable)) return;          // 焦点在控件上时交给控件自己
  if (!$('table-view') || !$('table-view').classList.contains('on')) return;
  if ($('mask') || openFilter || document.querySelector('.cell-pop')) return;   // 弹窗/浮层打开时让它们处理键盘
  var sel = document.querySelector('#tbody td.cell-sel');
  if (!sel || !sel.isConnected) return;
  if (e.key === 'Enter' || e.key === 'F2') { e.preventDefault(); openEdit(sel); return; }
  if (e.key === 'Escape') { clearCellSel(); return; }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    var nb = cellNeighbor(sel, e.key === 'ArrowRight' ? 1 : -1);
    if (nb) { e.preventDefault(); selectCell(nb); nb.scrollIntoView({ block: 'nearest', inline: 'nearest' }); }
    return;
  }
  if (e.key.length === 1 && e.key !== ' ') {
    var cc = colByKey(sel.getAttribute('data-f'));
    if (cc && (cc.type === 'text' || cc.type === 'number')) { e.preventDefault(); openEdit(sel, e.key); }
  }
});
function renderRows(d) {
  hideRowInsert();
